<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>평일 업무 달력</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: full-bleed warm-dark editorial page. Top nav (4 items) / hero month title + controls / dashed-line weekday grid / "next up" list. Filters and item detail slide in as drawers; no permanent sidebar. */
:root{
  color-scheme:dark;
  --bg:#100904; --fg:#ffedd7; --surface:#382416; --ember:#dc5000;
  --line:color-mix(in srgb,var(--fg) 26%,var(--bg));
  --strong:color-mix(in srgb,var(--fg) 58%,var(--bg));
  --faint:color-mix(in srgb,var(--fg) 52%,var(--bg));
  --hover:#241710;
  --c1:#a3c47a; --c2:#e6c95c; --c3:#c3a0e8; --c4:#e08fb6; --c0:#cdb79a; --over:#f0661a;
  --muted:color-mix(in srgb,var(--fg) 66%,var(--bg));
  --hol-bg:#2c1304; --hol-fg:#f0661a; --today-bg:#2a1a0c;
  --high-bg:var(--fg); --high-fg:var(--bg);
  --chip-h:color-mix(in srgb,var(--surface) 78%,var(--fg)); --out:color-mix(in srgb,var(--surface) 30%,var(--bg));
  --focus-tint:color-mix(in srgb,var(--surface) 35%,var(--bg));
  --fs:14px;
  --font:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:Consolas,"D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 var(--fs)/1.5 var(--font);padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
input[type=checkbox]{accent-color:var(--fg)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow span{color:var(--faint);margin-left:8px}

.app{position:relative;min-height:100vh;display:grid;grid-template-columns:176px minmax(0,1fr);column-gap:52px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column;padding:30px 28px 30px 0;border-right:2px dashed var(--strong);overflow-y:auto}
.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;line-height:1.5}
.rail .yr{margin:24px 0 4px}
.mrow{display:block;width:100%;text-align:left;padding:4px 0;font-size:15px;color:var(--muted);min-height:24px}
.mrow:hover{color:var(--fg)}
.mrow.on{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:7px}
.tools{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:2px}
.tool{text-align:left;padding:7px 0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.tool:hover{color:var(--fg)}
.app.side-open #nav-filter{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:6px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
@media (max-height:900px){.hero{padding:22px 0 18px!important}.mtitle{font-size:clamp(40px,5vw,68px)!important}}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;padding:38px 0 32px}
.mtitle{font-size:clamp(46px,7.4vw,96px);line-height:.9;font-weight:500;margin:14px 0 0;letter-spacing:0;text-transform:uppercase}
.msub{font-size:18px;color:var(--muted);margin-top:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.tline{font-size:13px;letter-spacing:.02em;color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-decoration-color:var(--strong);text-underline-offset:5px}
.tline:hover{text-decoration-color:var(--fg)}
.tline b{font-weight:700}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:18px;min-width:0}
.stat{display:flex;gap:26px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.stat b{font-weight:500;font-size:26px;color:var(--fg);margin-right:6px;font-variant-numeric:tabular-nums;letter-spacing:0}
.ctrl{display:flex;gap:10px}
.ghost{border:1px solid var(--fg);border-radius:22.5px;padding:8px 20px;font-size:12px;letter-spacing:.1em;display:inline-flex;align-items:center;gap:8px;min-height:36px}
.ghost:hover{background:var(--surface)}
.search input{border:0;border-bottom:1px solid var(--fg);border-radius:0;background:transparent;padding:6px 2px;width:min(240px,60vw);font-size:14px;outline:0}
.search input::placeholder{color:var(--muted)}

.banner{border:1px dashed var(--faint);border-radius:12px;padding:12px 18px;margin:0 0 18px;font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner button{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}

.gw{padding-bottom:8px}
.dow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0 0 10px;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.dow span{padding-left:14px}
.dow small{margin-left:8px;font-size:11px;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:2px dashed var(--strong);grid-auto-rows:minmax(96px,auto)}
.cell:nth-child(-n+5){border-top:0}.cell:nth-child(5n+1){border-left:0}
.cell{border-top:1px dashed var(--line);border-left:1px dashed var(--line);padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;min-width:0;cursor:pointer;position:relative}
.cell:hover{background:var(--hover);outline:1px dashed var(--strong);outline-offset:-5px}
.cell.tnow:hover{background:var(--today-bg)}
.cell:focus-visible{outline:2px dashed var(--fg);outline-offset:-6px}
@media (prefers-reduced-motion:no-preference){.cell>*{transition:transform .14s ease}.cell:hover>*,.cell:focus-visible>*{transform:translateY(-2px)}.add{transition:opacity .12s}}
.cell.past .dnum{color:var(--strong)}.cell.past .chip{opacity:.78}
.dow span.now{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:6px}
.cell.out .dnum{color:var(--strong)}
.cell.out .chip,.cell.out .more{color:var(--muted)}
.cell.today{background:var(--today-bg);outline:2px dashed var(--fg);outline-offset:-5px}
.cell.hol{background:var(--hol-bg)}
.ch{display:flex;align-items:center;gap:10px;min-height:28px}
.dnum{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.cell.tnow .dnum{background:transparent;color:var(--fg);border:2px solid var(--fg);font-weight:700;border-radius:999px;padding:4px 10px;margin-left:-11px}
.lab.tdy{font-size:11px;letter-spacing:.16em;color:var(--fg);font-weight:700}
.cell.hol .dnum{color:var(--hol-fg)}
.lab{font-size:12px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--muted)}
.lab.h{color:var(--hol-fg)}
.add{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.add:hover{border-color:var(--fg);color:var(--fg)}
@media (hover:hover){.add{opacity:0}.cell:hover .add,.add:focus-visible{opacity:1}}
.note{font-size:11px;letter-spacing:.04em;color:var(--muted)}
.chipw{display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:flex;align-items:center;gap:9px;text-align:left;flex:1;min-width:0;padding:3px 0;font-size:var(--fs);color:var(--fg)}
.chip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .tg{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chip.high .tg{border:2px solid var(--high-fg);width:11px;height:11px;margin-left:-4px}
.chip.doing .t::before{content:'◐';margin-right:7px;color:var(--fg)}
.chip:hover .t{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.chip.high{background:var(--high-bg);color:var(--high-fg);border-radius:999px;padding:5px 13px;flex:0 1 auto;max-width:100%}
.chip.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--strong);color:var(--muted)}
.chip.done .t::before,.drow.done .t::before{content:'✓';display:inline-block;margin-right:7px;text-decoration:none;color:var(--fg)}
.chip.sel{outline:1px dashed var(--fg);outline-offset:4px}
.late{flex-shrink:0;font-size:11px;letter-spacing:.04em;color:var(--over);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.past .chip.overdue{opacity:1}
.stat .over b{color:var(--over)}
.badge.late{border-color:var(--over);color:var(--over)}
.more{font-size:12px;letter-spacing:.04em;color:var(--muted);text-align:left;padding:2px 0}
.more:hover{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.clip{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.clip:hover{border-color:var(--fg);color:var(--fg)}
.clip svg.i{width:13px;height:13px}
.cell.drop,.detail.drop,.modal.drop,.qa.drop{outline:1px dashed var(--fg);outline-offset:-6px;background:var(--surface)}
.modal{position:relative}
/* 끌어다 놓기 중인 칸/패널 한가운데 안내 */
.drop::after{content:"여기에 놓기";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);color:var(--fg);border:1px dashed var(--fg);border-radius:999px;padding:6px 14px;font-size:12px;letter-spacing:.06em;white-space:nowrap;pointer-events:none;z-index:4}

.next{margin-top:48px;padding:34px 0 36px;border-top:2px dashed var(--strong)}
.nrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto 72px;gap:18px;align-items:center;width:100%;text-align:left;padding:17px 0;border-bottom:1px dashed var(--line);font-size:15px}
.next .eyebrow+.nrow{border-top:1px dashed var(--line);margin-top:18px}
.nrow:hover{background:var(--out)}
.nd{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt em{font-style:normal;background:var(--high-bg);color:var(--high-fg);border-radius:999px;padding:1px 9px;margin-right:8px;font-size:12px}
.ng{color:var(--muted);font-size:12px;white-space:nowrap}
.ndd{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.06em}
.qa{position:sticky;bottom:0;z-index:12;background:var(--bg);border-top:2px dashed var(--strong);padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.qa-box{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--fg);padding:2px 2px 6px}
.qa-box input{flex:1;border:0;outline:0;background:transparent;min-width:0;font-size:16px;padding:4px 0}
.qa-box input::placeholder{color:var(--muted)}
.qa-hint{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px;letter-spacing:.02em}
.qa-hint.err{color:var(--ember)}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.ib:hover{border-color:var(--fg);color:var(--fg)}
.ib.sm{width:26px;height:26px}.ib.sm svg.i{width:13px;height:13px}
.ib.xs{position:relative;width:22px;height:22px}.ib.xs svg.i{width:13px;height:13px}
.ib.xs::before{content:'';position:absolute;inset:-5px}.sbtn .dot::before{content:'';position:absolute;inset:-7px}
.ck input[type=checkbox]{width:18px;height:18px;margin:0 3px;flex-shrink:0}
.tline,.banner button,.lk-n{min-height:24px}
.grow{flex:1}
.ti::before{content:'';position:absolute;inset:-5px}
.ti{position:relative;width:22px;height:22px;border-radius:50%;border:1px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;vertical-align:middle;text-transform:none;letter-spacing:0}
.ti svg.i{width:12px;height:12px}
.ti:hover,.ti:focus-visible{border-color:var(--fg);color:var(--fg)}
/* 툴팁: role=tooltip 요소 (aria-describedby로 연결). 모양은 이전 ::after와 동일 */
.ti .tt{position:absolute;bottom:calc(100% + 10px);left:-8px;width:max-content;max-width:min(300px,80vw);white-space:pre-line;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--strong);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.65;letter-spacing:.02em;font-weight:500;opacity:0;pointer-events:none;z-index:60}
.ti.r .tt{left:auto;right:-8px}
.ti:hover .tt,.ti:focus-visible .tt{opacity:1}
.ti.tt-off .tt{opacity:0!important}
.tok{height:28px;min-width:28px;padding:0 9px;border-radius:999px;border:1px dashed var(--faint);color:var(--muted);font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tok:hover{border-style:solid;border-color:var(--fg);color:var(--fg)}

/* 빠른 추가 입력 하이라이트: 투명 글자 input 뒤에 같은 글꼴의 미러(.mir)를 깔고 토큰만 알약으로 칠한다.
   미러는 패딩·글자 크기가 input과 같고 토큰에 가로 여백이 없어 캐럿 위치가 어긋나지 않는다 */
.qin{position:relative;flex:1;min-width:0;display:flex}
.qin .mir,.qin input{font:inherit;font-size:16px;line-height:24px;letter-spacing:normal;padding:4px 0;margin:0;border:0}
.qin .mir{position:absolute;inset:0;white-space:pre;overflow:hidden;pointer-events:none;color:var(--fg);text-align:left}
.qa-box .qin input{position:relative;z-index:1;width:100%;flex:1;color:transparent;caret-color:var(--fg);background:transparent}
.qin input::selection{background:color-mix(in srgb,var(--fg) 30%,transparent);color:transparent}
.tk{border-radius:999px;background:var(--tkf,transparent);outline:1px var(--tks,solid) var(--tko,transparent);outline-offset:1px;box-shadow:0 0 0 1px var(--tkf,transparent)}
.tk.t{--tkc:var(--c0);color:var(--tkc);--tkf:color-mix(in srgb,var(--tkc) 16%,var(--bg));--tko:color-mix(in srgb,var(--tkc) 60%,transparent)}
.tk.w{--tko:var(--strong);--tks:dashed}
.tk.p.h{--tkf:var(--high-bg);color:var(--high-fg);--tko:var(--high-bg)}
.tk.p.l{color:var(--muted);--tko:var(--faint);--tks:dashed}
.tk.p.m{--tko:var(--strong);--tks:dashed}
.tk.d{--tkf:var(--surface);--tko:var(--strong)}
.tk.x{color:var(--over);--tko:var(--over);--tks:dashed}
/* 힌트 줄 칩 / 작성 팝업 칩: 같은 종류별 색, 여백 있는 버전 */
.hc{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;margin:0 6px 2px 0;font-size:12px;line-height:18px;letter-spacing:.02em;box-shadow:none;outline-offset:-1px;white-space:nowrap;vertical-align:middle}
.hc.sg{cursor:pointer;--tks:dashed}
.hc.sg:hover{--tks:solid;color:var(--fg)}
.hint-sep{display:inline-block;width:1px;height:12px;background:var(--line);margin:0 10px 0 4px;vertical-align:middle}
.hint-mv{color:var(--muted);margin-right:6px}
#qa-hint,#day-err{min-height:26px}
.qa-hint.err .hc{color:var(--over)}
.cp{display:flex;flex-direction:column;gap:20px}
.cp .ttl{font-size:22px;border-bottom-color:var(--fg)}
.cp .warnline{margin-top:-10px}.cp .warnline:empty{display:none}
.cp-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--fg);padding:5px 2px;min-height:40px}
.cp-chips:focus-within{border-bottom:2px dashed var(--fg);padding-bottom:4px;background:var(--focus-tint)}
.cp-chips input{flex:1;min-width:90px;border:0;outline:0;background:transparent;padding:4px 0;font-size:15px}
.cp-chips .hc{margin:0}
.cx{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:inherit;position:relative;margin-right:-6px}
.cx::before{content:'';position:absolute;inset:-4px}
.cx svg.i{width:11px;height:11px}.cx:hover{background:var(--out)}
.cp-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.cp-sug:empty{display:none}
.cp-sug .hc{margin:0}
.modal.cpm{width:min(580px,100%)}
.cp .lk{padding:7px 0}
.dfoot .err{font-size:12px}

.filters,.detail{position:fixed;top:0;bottom:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;min-width:0}
.filters{left:calc(max(28px,env(safe-area-inset-left,0px)) + 176px);width:min(340px,calc(100% - 204px));border-right:2px dashed var(--strong);display:none;overflow-y:auto;padding:26px 28px 48px}
.app.side-open .filters{display:flex}
.fhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:30px 0 8px;padding-bottom:10px;border-bottom:2px dashed var(--strong)}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;font-size:15px}
.sbtn:hover{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:5px}
.sbtn.on{background:var(--surface);color:var(--fg);border:1px solid var(--fg);border-radius:999px;padding:10px 18px;margin:2px 0;text-decoration:none}
.sbtn .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sbtn.on .n{color:var(--fg)}
.sbtn .dot{position:relative;width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;outline:1px solid var(--bg);box-shadow:none}
.side-empty{font-size:13px;color:var(--muted);padding:6px 0}
.detail{right:0;width:min(470px,100%);border-left:2px dashed var(--strong)}
/* ≥1280px: 상세 패널은 덮지 않고 세 번째 그리드 컬럼이 된다 (달력 폭이 줄어듦) */
@media (min-width:1280px){
  .app.detail-open{grid-template-columns:176px minmax(0,1fr) clamp(340px,24vw,440px);column-gap:32px}
  .app.detail-open .detail{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;right:auto;width:auto;height:100vh;align-self:start;z-index:5}
}
.dh{display:flex;align-items:center;gap:10px;padding:20px 28px;border-bottom:2px dashed var(--strong)}
.dh b{flex:1;font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.db{flex:1;overflow-y:auto;padding:26px 28px 24px;display:flex;flex-direction:column;gap:26px}
.ttl{font-size:26px;line-height:1.25;font-weight:500;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;width:100%;padding:4px 0;margin:0;outline:0}
.ttl:hover,.ttl:focus{border-bottom-color:var(--fg)}
.fl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fl span{text-transform:none;letter-spacing:.02em;color:var(--faint)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--faint);border-radius:999px;padding:6px 16px;font-size:13px}
.seg button:hover{border-color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);border-color:var(--fg)}
.seg button.on::before{content:'✓ '}
.fi{width:100%;background:transparent;border:0;border-bottom:1px solid var(--fg);border-radius:0;padding:8px 2px;font-size:15px}
/* 입력 포커스: 2px 점선 밑줄 + 옅은 Bark 틴트 (밑줄이 1px→2px로 굵어지는 만큼 아래 여백 1px 상쇄) */
.fi:focus,.search input:focus,.ttl:focus,.ck input[type=text]:focus{outline:0;border-bottom:2px dashed var(--fg);margin-bottom:-1px;background:var(--focus-tint)}
textarea.fi:focus{border:2px dashed var(--fg);padding:11px;margin-bottom:0}
.qa-box:focus-within{border-bottom:2px dashed var(--fg);padding-bottom:5px;background:var(--focus-tint)}
textarea.fi{border:1px dashed var(--faint);padding:12px;min-height:100px;resize:vertical;border-radius:0}
select.fi{background:var(--bg)}

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h;}
const TAGC=['--c1','--c2','--c3','--c4','--c0'];

  r.setProperty('--fs',(+S.style.fontSize||DEF_STYLE.fontSize)+'px');
}

function weeksOf(y,m){
  const last=new Date(y,m+1,0);let d=new Date(y,m,1);const w=d.getDay();
  d=w===6?addD(d,2):w===0?addD(d,1):addD(d,-(w-1));
  const out=[];while(d<=last){out.push([0,1,2,3,4].map(i=>addD(d,i)));d=addD(d,7);}return out;
}
const holOn=k=>HOLIDAYS[k]&&!S.disabledHol.includes(k)?HOLIDAYS[k]:null;
function dayInfo(k){
  const d=P(k),w=d.getDay(),notes=[];
  if(S.style.weekendNotes){
    const chk=(dd,label)=>{const kk=K(dd);const h=holOn(kk);if(h)notes.push({t:label+' '+h,h:true});S.customs.filter(c=>c.date===kk).forEach(c=>notes.push({t:label+' '+c.name,c:c.color}));};
    if(w===5)chk(addD(d,1),'토');
    if(w===1)chk(addD(d,-1),'일');
  }
  return {hol:holOn(k),customs:S.customs.filter(c=>c.date===k),notes};
}
const PR={high:0,normal:1,low:2};

function cellHTML(d,inMonth,compact){
  const k=K(d),info=dayInfo(k),list=itemsOn(k);
  const off=info.customs.find(c=>c.off);
  const cls=['cell'];if(k<TODAY&&inMonth)cls.push('past');if(!inMonth)cls.push('out');if(info.hol)cls.push('hol');else if(k===TODAY)cls.push('today');if(k===TODAY)cls.push('tnow');

    h+='</div>';

/* ---------- focus ---------- */
/* 재렌더(innerHTML)로 포커스된 노드가 사라지면 같은 id / data-* 를 가진 새 노드로 포커스를 옮긴다 */
const FK_ATTRS=['data-act','data-id','data-v','data-f','data-day','data-l','data-i','data-mi','data-ck'];
function focusKey(el){
  if(!el||el===document.body||el===document.documentElement)return null;
  if(el.id)return '#'+CSS.escape(el.id);
  const sel=FK_ATTRS.filter(x=>el.hasAttribute(x)).map(x=>'['+x+'="'+CSS.escape(el.getAttribute(x))+'"]').join('');
  return sel?el.tagName.toLowerCase()+(el.classList[0]?'.'+CSS.escape(el.classList[0]):'')+sel:null;
}
const focusable=el=>el&&!el.disabled&&el.getClientRects().length>0&&!el.closest('[inert]');
function refocus(key){
  if(!key)return false;
  for(const k of [key,key.replace(/^([a-z]+)\.[^\[]+/,'$1')]){let n=null;try{n=document.querySelector(k);}catch(e){}if(focusable(n)){n.focus({preventScroll:true});return true;}}
  return false;
}
function keepFocus(fn){return function(){
  const a=document.activeElement,key=focusKey(a),sel=a&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  const r=fn.apply(this,arguments);
  if(key&&!document.contains(a)&&refocus(key)&&sel){try{document.activeElement.setSelectionRange(sel[0],sel[1]);}catch(e){}}
  return r;
};}
renderMain=keepFocus(renderMain);renderSide=keepFocus(renderSide);renderDetail=keepFocus(renderDetail);

/* ---------- quick add ---------- */
/* 연도 생략: 올해로 보되, 달력 범위(RMIN) 앞이면 내년 (올해 2026 → 1~10월은 2027, 11·12월은 2026) */
function inferY(m,d){const y=+TODAY.slice(0,4);return y+'-'+pad(m)+'-'+pad(d)<RMIN?y+1:y;}
const mkDate=(y,m,d)=>{const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?K(dt):null;};
/* 토큰: 공백으로 둘러싸인 #분류 @담당 !중요도 + 날짜. 날짜는 한 개만(우선순위 sl > full > kor > md > dd > rel) */
const QD='(?:\\d{4}[-./])?\\d{1,2}[-./]\\d{1,2}';
const QRE=new RegExp('(?<![^\\s])(?:'+[
  '(?<tag>#[^\\s#@!]+)','(?<who>@[^\\s#@!]+)','(?<hi>!!|!높음|!중요|!high)','(?<lo>!낮음|!low)','(?<mid>!보통)',
  '(?<sl>\\/(?:'+QD+'(?:~(?:'+QD+'|\\d{1,2}))?|오늘|내일|모레))',
  '(?<full>\\d{4}[-./]\\d{1,2}[-./]\\d{1,2})','(?<kor>\\d{1,2}월 ?\\d{1,2}일)','(?<md>\\d{1,2}[/.]\\d{1,2})','(?<dd>\\d{1,2}일)','(?<rel>오늘|내일|모레)'
].join('|')+')(?![^\\s])','gi');
const QDATE=['sl','full','kor','md','dd','rel'];
function scanQuick(text){
  const all=[];
  for(const m of String(text).matchAll(QRE)){const kind=Object.keys(m.groups).find(k=>m.groups[k]!=null);all.push({kind,s:m.index,e:m.index+m[0].length,txt:m[0]});}
  let best=null;all.forEach(t=>{const o=QDATE.indexOf(t.kind);if(o>=0&&(!best||o<QDATE.indexOf(best.kind)))best=t;});
  return all.filter(t=>QDATE.indexOf(t.kind)<0||t===best);
}
/* 날짜 토큰 → {due,start?} 또는 {err}. /11-12~12-25 는 시작~기한. 끝이 시작보다 빠르면 오류(연도를 넘기는 범위는 /12-20~2027-01-05 처럼 연도를 적는다) */
function evalDate(t){
  const x=t.txt,BAD={err:'날짜가 맞지 않아요'};let r;
  if(t.kind==='rel'||(t.kind==='sl'&&/^\/(오늘|내일|모레)$/.test(x))){const w=x.replace('/','');return {due:K(addD(P(TODAY),{오늘:0,내일:1,모레:2}[w]))};}
  if(t.kind==='full'){r=x.split(/[-./]/).map(Number);const k=mkDate(r[0],r[1],r[2]);return k?{due:k}:BAD;}
  if(t.kind==='kor'){r=x.match(/(\d+)월 ?(\d+)일/);const k=mkDate(inferY(+r[1],+r[2]),+r[1],+r[2]);return k?{due:k}:BAD;}
  if(t.kind==='md'){r=x.split(/[/.]/).map(Number);const k=mkDate(inferY(r[0],r[1]),r[0],r[1]);return k?{due:k}:BAD;}
  if(t.kind==='dd'){const m=MONTHS[ui.mi],k=mkDate(m.y,m.m+1,parseInt(x));return k?{due:k}:BAD;}
  const [a,b]=x.slice(1).split('~'),pa=a.split(/[-./]/).map(Number);
  const sy=pa.length===3?pa[0]:inferY(pa[0],pa[1]),sm=pa.length===3?pa[1]:pa[0],sd=pa.length===3?pa[2]:pa[1];
  const s=mkDate(sy,sm,sd);if(!s)return BAD;if(b==null)return {due:s};
  const pb=b.split(/[-./]/).map(Number);let e;
  if(pb.length===1)e=mkDate(sy,sm,pb[0]);else if(pb.length===2)e=mkDate(sy,pb[0],pb[1]);else e=mkDate(pb[0],pb[1],pb[2]);
  if(!e)return BAD;if(e<s)return {err:'끝이 시작보다 빨라요'};
  return e===s?{due:s}:{due:e,start:s};
}
function parseQuick(text,base){
  text=String(text);const toks=scanQuick(text),tags=[],who=[];let pr='normal',date=null,start=null,err='';
  toks.forEach(t=>{
    if(t.kind==='tag'){const v=t.txt.slice(1);if(!tags.includes(v))tags.push(v);}
    else if(t.kind==='who'){const v=t.txt.slice(1);if(!who.includes(v))who.push(v);}
    else if(t.kind==='hi')pr='high';else if(t.kind==='lo')pr='low';else if(t.kind==='mid')pr='normal';
    else{const d=evalDate(t);t.d=d;if(d.err)err=d.err;else{date=d.due;start=d.start||null;}}
  });
  let title='',pos=0;toks.forEach(t=>{title+=text.slice(pos,t.s)+' ';pos=t.e;});title+=text.slice(pos);
  return {title:title.replace(/\s+/g,' ').trim(),date:date||base,start,tags,who:who.length?who:['나'],pr,explicit:!!date,err,toks};
}
function defaultDay(){
  if(ui.selDay)return ui.selDay;
  const m=MONTHS[ui.mi];
  if(TODAY.startsWith(m.y+'-'+pad(m.m+1)))return TODAY;
  return K(weeksOf(m.y,m.m)[0].find(d=>d.getMonth()===m.m));
}
function weekdayShift(k){const d=P(k),w=d.getDay();if(w===6)return {k:K(addD(d,-1)),moved:'토 → 금'};if(w===0)return {k:K(addD(d,1)),moved:'일 → 월'};return {k,moved:''};}
/* 기한(+시작일)에 주말 이동·범위 검사를 적용 */
function finalizeDates(due,start){
  const a=weekdayShift(due),b=start?weekdayShift(start):null;
  if(a.k<RMIN||a.k>RMAX||(b&&(b.k<RMIN||b.k>RMAX)))return {err:'범위 밖 날짜 ('+RLAB+')'};
  return {due:a.k,start:b&&b.k<a.k?b.k:'',moved:a.moved||(b&&b.moved)||''};
}
function makeItem(f){
  return {id:uid(),title:f.title,due:f.due,start:f.start||'',status:'todo',priority:f.pr||'normal',assignees:f.who&&f.who.length?f.who:['나'],tags:f.tags||[],memo:f.memo||'',checklist:[],links:f.links||[]};
}
function addFromText(text,base){
  const p=parseQuick(text,base);
  if(p.err)return {err:p.err};
  if(!p.title)return {err:'제목을 입력하세요'};
  const f=finalizeDates(p.date,p.start);if(f.err)return f;
  const it=makeItem({title:p.title,due:f.due,start:f.start,pr:p.pr,who:p.who,tags:p.tags});
  S.items.push(it);save();return {it,moved:f.moved};
}
/* 힌트: 파싱 결과를 칩으로. #·@ 를 치는 중이면 기존 분류/담당 제안도 같이 */
const fmtS=k=>{const d=P(k),y=k.slice(0,4)!==TODAY.slice(0,4)?k.slice(0,4)+'.':'';return y+(d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';};
const hchip=(cls,txt,st)=>'<span class="tk hc '+cls+'"'+(st?' style="'+st+'"':'')+'>'+esc(txt)+'</span>';
function suggestHTML(text,target){
  const m=/(?:^|\s)([#@])([^\s#@!]*)$/.exec(text);if(!m)return '';
  const isT=m[1]==='#',cnt={};
  S.items.forEach(i=>(isT?i.tags:i.assignees).forEach(v=>{cnt[v]=(cnt[v]||0)+1;}));
  if(!isT&&!cnt['나'])cnt['나']=0;
  const list=Object.keys(cnt).filter(v=>v.startsWith(m[2])&&v!==m[2]).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b,'ko')).slice(0,6);
  if(!list.length)return '';
  return '<span class="hint-sep"></span>'+list.map(v=>'<button type="button" class="tk hc sg '+(isT?'t':'w')+'" data-act="qasug" data-target="'+target+'" data-t="'+esc(m[1]+v)+'"'+(isT?' style="--tkc:'+tagColor(v)+'"':'')+'>'+esc(m[1]+v)+'</button>').join('');
}
function hintFor(text,focused,base,target){
  base=base||defaultDay();target=target||'qa';
  if(!text.trim())return focused?{html:'→ '+hchip('d',fmtS(base))+hchip('w','@나'),err:false}:{html:'',err:false};
  const p=parseQuick(text,base);
  if(p.err)return {html:esc(p.err),err:true};
  const f=finalizeDates(p.date,p.start);
  let h='→ ';
  if(f.err)h+=hchip('x',f.err);
  else{h+=hchip('d',f.start?fmtS(f.start)+' ~ '+fmtS(f.due):fmtS(f.due));if(f.moved)h+='<span class="hint-mv">'+esc(f.moved)+'</span>';}
  p.tags.forEach(t=>{h+=hchip('t','#'+t,'--tkc:'+tagColor(t));});
  p.who.forEach(t=>{h+=hchip('w','@'+t);});
  if(p.pr!=='normal')h+=hchip('p '+(p.pr==='high'?'h':'l'),p.pr==='high'?'중요도 높음':'중요도 낮음');
  return {html:h+suggestHTML(text,target),err:false};
}
function setHint(el,r){el.innerHTML=r.html;el.classList.toggle('err',!!r.err);}
/* 하이라이트 미러 */
function mirHTML(text){
  const toks=scanQuick(text);let h='',pos=0;
  toks.forEach(t=>{
    h+=esc(text.slice(pos,t.s));pos=t.e;
    let cls,st='';
    if(t.kind==='tag'){cls='t';st=' style="--tkc:'+tagColor(t.txt.slice(1))+'"';}
    else if(t.kind==='who')cls='w';else if(t.kind==='hi')cls='p h';else if(t.kind==='lo')cls='p l';else if(t.kind==='mid')cls='p m';
    else cls=evalDate(t).err?'x':'d';
    h+='<span class="tk '+cls+'"'+st+'>'+esc(t.txt)+'</span>';
  });
  return h+esc(text.slice(pos));
}

const WPC_FALLBACK=['#a3c47a','#e6c95c','#c3a0e8','#e08fb6','#cdb79a'];
function drawWallpaper(mi){
  const WPC=TAGC.map((v,i)=>{const c=cssVar(v);return /^#[0-9a-f]{6}$/i.test(c)?c:WPC_FALLBACK[i];});
  const o=S.wp,W=Math.max(800,Math.min(7680,+o.w||1920)),H=Math.max(600,Math.min(4320,+o.h||1080));

  x.fillStyle=o.bg;x.fillRect(0,0,W,H);
  const s=Math.min(W/1920,H/1080),F=(z)=>'500 '+Math.round(z*s)+'px '+FONT,sp=v=>{try{x.letterSpacing=v;}catch(e){}};
  let rx,rw;if(o.place==='right'){rx=W*.3;rw=W*.66;}else if(o.place==='center'){rx=W*.16;rw=W*.68;}else{rx=W*.05;rw=W*.9;}
  const m=MONTHS[mi],top=H*.07,bottom=H*.1;
  x.textBaseline='alphabetic';x.fillStyle=fg;x.font=F(92);sp('0px');
  const t1=MON_EN[m.m];x.fillText(t1,rx,top+80*s);const tw=x.measureText(t1).width;
  x.font=F(22);x.fillStyle=mute;x.fillText(m.y+' · '+(m.m+1)+'월',rx+tw+28*s,top+80*s);
  const hy=top+136*s,weeks=weeksOf(m.y,m.m),colW=rw/5;
  x.font=F(13);sp(Math.round(2.6*s)+'px');x.fillStyle=mute;['MON','TUE','WED','THU','FRI'].forEach((d,i)=>x.fillText(d,rx+i*colW+14*s,hy));sp('0px');
  const gTop=hy+16*s,gH=H-bottom-gTop,rowH=gH/weeks.length,lh=26*s,pd=14*s;
  weeks.forEach((w,ri)=>w.forEach((d,ci)=>{
    const info=dayInfo(K(d)),offC=info.customs.find(q=>q.off);
    if(info.hol||offC){x.fillStyle=hexA(info.hol?o.hol:offC.color,.16);x.fillRect(rx+ci*colW,gTop+ri*rowH,colW,rowH);}
  }));
  x.save();x.strokeStyle=line;x.lineWidth=Math.max(1,s);x.setLineDash([5*s,5*s]);
  for(let r=0;r<=weeks.length;r++){const y=gTop+r*rowH;x.beginPath();x.moveTo(rx,y);x.lineTo(rx+rw,y);x.stroke();}
  for(let q=0;q<=5;q++){const xx=rx+q*colW;x.beginPath();x.moveTo(xx,gTop);x.lineTo(xx,gTop+gH);x.stroke();}
  x.strokeStyle=fg;x.globalAlpha=.55;x.lineWidth=Math.max(2,2*s);x.setLineDash([8*s,6*s]);x.strokeRect(rx,gTop,rw,gH);x.globalAlpha=1;
  x.restore();

    const k=K(d),cx=rx+ci*colW,cy=gTop+ri*rowH,info=dayInfo(k),inM=d.getMonth()===m.m;
    x.globalAlpha=inM?1:.58;
    x.font=F(24);x.fillStyle=info.hol?o.hol:fg;const dn=(d.getDate()===1?(d.getMonth()+1)+'/':'')+d.getDate();x.fillText(dn,cx+pd,cy+pd+22*s);
    let lx=cx+pd+x.measureText(dn).width+12*s;x.font=F(14);
    const labs=[];if(info.hol)labs.push([info.hol,o.hol]);info.customs.forEach(q=>labs.push([q.name,q.color]));
    labs.forEach(([t,col])=>{const room=cx+colW-pd-lx;if(room<30*s)return;const ft=fit(x,t,room);x.fillStyle=col;x.fillText(ft,lx,cy+pd+20*s);lx+=x.measureText(ft).width+10*s;});
    let y=cy+pd+56*s;
    x.font=F(12);info.notes.forEach(n=>{x.fillStyle=n.c||(n.h?o.hol:mute);x.fillText(fit(x,n.t,colW-2*pd),cx+pd,y);y+=19*s;});
    if(o.content!=='none'){
      let list=S.items.filter(i=>i.due===k&&!(S.style.hideDone&&i.status==='done')).sort(cmp);
      if(o.content==='high')list=list.filter(i=>i.priority==='high');
      const maxL=Math.max(0,Math.floor((cy+rowH-pd*.4-y+lh*.7)/lh));
      const shown=list.length>maxL?list.slice(0,Math.max(0,maxL-1)):list;
      shown.forEach(i=>{
        const hi=i.priority==='high'&&i.status!=='done';x.font=F(15);
        if(hi){const t='! '+i.title,tx=fit(x,t,colW-2*pd-22*s),w=x.measureText(tx).width+22*s;rr(x,cx+pd,y-18*s,w,27*s,13.5*s);x.fillStyle=fg;x.fill();x.fillStyle=inv;x.fillText(tx,cx+pd+11*s,y+1*s);y+=lh+3*s;}
        else{const dn2=i.status==='done',pre=dn2?'✓ ':(i.status==='doing'?'◐ ':''),off=dn2||pre?0:16*s;if(!pre){x.fillStyle=WPC[tagIdx(i.tags[0])%5];x.beginPath();x.arc(cx+pd+5*s,y-1*s,4.5*s,0,7);x.fill();}const tx=fit(x,pre+i.title,colW-2*pd-off);x.fillStyle=dn2?mute:fg;x.fillText(tx,cx+pd+off,y+4*s);if(dn2){const w=x.measureText(tx).width,w0=x.measureText('✓ ').width;x.fillRect(cx+pd+w0,y-1*s,w-w0,Math.max(1.5,1.5*s));}y+=lh;}
      });
      if(list.length>shown.length){x.font=F(12);x.fillStyle=mute;x.fillText('+'+(list.length-shown.length)+'개 더',cx+pd,y+4*s);}
    }

/* ---------- document links ---------- */
const LOCAL=location.protocol==='file:';
const VIEW_EXT=['pdf','png','jpg','jpeg','gif','webp','bmp','svg','txt','htm','html','mp4'];
const OFFICE={xlsx:'ms-excel',xls:'ms-excel',xlsm:'ms-excel',xlsb:'ms-excel',csv:'ms-excel',docx:'ms-word',doc:'ms-word',rtf:'ms-word',pptx:'ms-powerpoint',ppt:'ms-powerpoint'};
const isURL=s=>/^https?:\/\//i.test(s||'');
const extOf=n=>{const m=/\.([a-z0-9]+)$/i.exec(n||'');return m?m[1].toLowerCase():'';};
const lastSeg=p=>p.split('\\').filter(Boolean).pop()||p;
function fileURLToPath(u){try{const x=new URL(u);const p=decodeURIComponent(x.pathname);if(x.host)return '\\\\'+x.host+p.replace(/\//g,'\\');const q=p.replace(/^\//,'');return /^[a-zA-Z]:/.test(q)?q.replace(/\//g,'\\'):null;}catch(e){return null;}}
function asLink(raw){
  const s=String(raw).trim().replace(/^"(.*)"$/,'$1').trim();if(!s)return null;
  if(/^[a-zA-Z]:\\/.test(s)||/^\\\\[^\\]+\\/.test(s))return {id:uid(),path:s,name:lastSeg(s)};
  if(/^file:\/\//i.test(s)){const p=fileURLToPath(s);return p?{id:uid(),path:p,name:lastSeg(p)}:null;}
  if(isURL(s)){let n=s;try{const u=new URL(s);n=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname);}catch(e){}return {id:uid(),path:s,name:n};}
  return null;
}
const parseLinks=t=>String(t||'').split(/\r?\n/).filter(l=>!/^\s*#/.test(l)).map(asLink).filter(Boolean);
function toFileURL(p){
  if(p.startsWith('\\\\'))return 'file://'+p.slice(2).split('\\').map(encodeURIComponent).join('/');
  return 'file:///'+p.slice(0,2)+'/'+p.slice(3).split('\\').map(encodeURIComponent).join('/');
}
const parentOf=p=>p.replace(/\\[^\\]*$/,'');
function xb(l){
  const e=isURL(l.path)&&!extOf(l.name)?'url':extOf(l.name||l.path);
  const g=e==='url'?'url':e==='pdf'?'pdf':/^hwpx?$/.test(e)?'hwp':/^(xls|xlsx|xlsm|xlsb|csv)$/.test(e)?'xls':/^(doc|docx|rtf)$/.test(e)?'doc':/^(ppt|pptx)$/.test(e)?'ppt':'';
  return '<span class="xb '+g+'">'+esc(e==='url'?'URL':(e||'파일').toUpperCase().slice(0,4))+'</span>';
}
function copyText(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(fb);else fb();}catch(e){fb();}
}
const quoted=p=>'"'+p+'"';
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('weekday-cal-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return idbP;}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('h',mode);const r=fn(tx.objectStore('h'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);}));}
const putH=(k,h)=>idbDo('readwrite',st=>st.put(h,k));
const getH=k=>idbDo('readonly',st=>st.get(k));
const delH=k=>idbDo('readwrite',st=>st.delete(k)).catch(()=>{});
function openLink(l){
  if(l.path){
    const p=l.path;
    if(isURL(p)){window.open(p,'_blank','noopener');return;}
    const e=extOf(l.name||p);
    if(LOCAL&&VIEW_EXT.includes(e)){window.open(toFileURL(p),'_blank');return;}
    copyText(quoted(p));
    if(LOCAL&&OFFICE[e]){const a=document.createElement('a');a.href=OFFICE[e]+':ofe|u|'+toFileURL(p);document.body.appendChild(a);a.click();a.remove();toast('오피스로 여는 중 · 경로도 복사됨');return;}
    toast((LOCAL?'경로 복사됨 · Win+R에 붙여넣기':'미리보기라 경로만 복사됨'));
    return;
  }
  if(l.h){openHandle(l);return;}
  toast('경로 없음 · Ctrl+Shift+C로 복사해 붙여넣기');
}
async function openHandle(l){
  try{
    const h=await getH(l.id);if(!h)throw 0;
    let st=await h.queryPermission({mode:'read'});if(st!=='granted')st=await h.requestPermission({mode:'read'});
    if(st!=='granted'){toast('파일을 읽을 권한이 필요해요');return;}
    const f=await h.getFile(),e=extOf(f.name);
    if(VIEW_EXT.includes(e)){const u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),120000);}
    else toast((e?e.toUpperCase():'이 형식')+'은 경로가 있어야 열려요');
  }catch(e){toast('파일 없음 · 옮겨졌을 수 있어요');}
}
function attachLinks(it,links){
  it.links=it.links||[];
  links.forEach(l=>{const m=l.path&&!isURL(l.path)&&it.links.find(x=>!x.path&&x.name===l.name);if(m)m.path=l.path;else it.links.push(l);});
  delete it.ex;
}
function placeLinks(links,k){
  const sh=weekdayShift(k);
  if(sh.k<RMIN||sh.k>RMAX){toast('범위 밖 날짜 ('+RLAB+')');return;}
  let att=0;const made=[];
  links.forEach(l=>{
    const it=l.path&&S.items.find(i=>i.due===sh.k&&(i.links||[]).some(x=>!x.path&&x.name===l.name));
    if(it){attachLinks(it,[l]);att++;return;}
    const ni={id:uid(),title:(l.name||'문서').replace(/\.[a-z0-9]{1,6}$/i,''),due:sh.k,start:'',status:'todo',priority:'normal',assignees:['나'],tags:[],memo:'',checklist:[],links:[l]};
    S.items.push(ni);made.push(ni);
  });
  save();
  const idx=MONTHS.findIndex(m=>sh.k.startsWith(m.y+'-'+pad(m.m+1)));if(idx>=0&&!ui.modal)ui.mi=idx;
  renderAll();
  if(ui.modal==='day'||ui.modal==='full'){const b=$('fullb'),top=b?b.scrollTop:0;renderModal();if(b)setTimeout(()=>{const nb=$('fullb');if(nb)nb.scrollTop=top;},40);}
  const parts=[];if(made.length)parts.push(fmtD(sh.k)+'에 문서 '+made.length+'개 추가');if(att)parts.push('경로 '+att+'개 연결');if(sh.moved)parts.push(sh.moved);

}
function linksToItem(id,links){const it=S.items.find(i=>i.id===id);if(!it)return;attachLinks(it,links);save();renderAll();toast('문서 '+links.length+'개를 연결했어요');}
function handleDrop(e,k,itemId,cb){
  const deliver=ls=>itemId?linksToItem(itemId,ls):cb?cb(ls):placeLinks(ls,k);
  const dt=e.dataTransfer;if(!dt)return;
  const files=Array.from(dt.items||[]).filter(i=>i.kind==='file');
  if(files.length){
    const parts=files.map(i=>{let hp=Promise.resolve(null);try{if(i.getAsFileSystemHandle)hp=i.getAsFileSystemHandle().catch(()=>null);}catch(err){}return {f:i.getAsFile(),hp};});
    Promise.all(parts.map(x=>x.hp)).then(async hs=>{
      const links=parts.map((x,j)=>({id:uid(),name:x.f?x.f.name:((hs[j]&&hs[j].name)||'문서'),path:'',h:!!(hs[j]&&hs[j].kind==='file')}));
      await Promise.all(links.map((l,j)=>l.h?putH(l.id,hs[j]).catch(()=>{l.h=false;}):null));
      deliver(links);
      if(!cb&&links.some(l=>!(l.h&&VIEW_EXT.includes(extOf(l.name)))))setTimeout(()=>toast('원본은 경로 필요 · Ctrl+Shift+C → 같은 칸에 Ctrl+V'),2800);
    });
    return;
  }
  const links=parseLinks(dt.getData('text/uri-list')||dt.getData('text/plain'));
  if(!links.length){toast('파일이나 링크만 놓을 수 있어요');return;}
  deliver(links);
}

$('modal').addEventListener('change',e=>{

<script>
/* ===================== 출석 달력 (훈련 출결) ===================== */
(function(){
'use strict';
const pad=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,10);
const DOW='일월화수목금토';
const HOL=window.KR_HOLIDAYS||{};
const TODAY=K(new Date());
const AKEY='attend-cal-v1',MKEY='cal-mode';
const AMIN='2026-12-01',AMAX='2027-12-31',ALAB='2026.12 – 2027.12';
const AM=Array.from({length:13},(_,i)=>({y:2026+Math.floor((11+i)/12),m:(11+i)%12}));
const ymOf=m=>m.y+'-'+pad(m.m+1);
const MON_EN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const ST=['출석','유고결석','무단결석','지각','조퇴','결과'];
const ABS=['유고결석','무단결석'],PART=['지각','조퇴','결과'];
const MARK={출석:'○',유고결석:'유',무단결석:'무',지각:'지',조퇴:'조',결과:'결'};
const NP=6,PS=[1,2,3,4,5,6];
const DEF_P=[['09:00','09:45'],['10:00','10:45'],['11:00','11:45'],['13:00','13:45'],['14:00','14:45'],['15:00','15:45']];
const KC=['#a3c47a','#e6c95c','#c3a0e8','#e08fb6','#cdb79a'];
const defKinds=()=>[{id:'vac',name:'방학',noClass:true,color:KC[2]},{id:'self',name:'개별학습',noClass:true,color:KC[0]},{id:'closed',name:'자체 휴업일',noClass:true,color:KC[3]},{id:'event',name:'행사·특강',noClass:false,color:KC[1]}];
let tipN=0;
const tip=(t,r)=>{const id='atip-'+(++tipN);return '<button type="button" class="ti'+(r?' r':'')+'" aria-label="도움말" aria-describedby="'+id+'"><svg class="i" aria-hidden="true"><use href="#i-info"/></svg><span class="tt" role="tooltip" id="'+id+'">'+esc(t)+'</span></button>';};
const fmtD=k=>{const d=P(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';};
const fmtS=k=>{const d=P(k);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';};
const isWk=k=>{const w=P(k).getDay();return w===0||w===6;};
const pct=v=>v==null?'–':(Math.round(v*1000)/10)+'%';

/* ---------- state ---------- */
function freshA(){return {tracks:[],students:[],lecturers:[],periods:DEF_P.map(([s,e])=>({s,e})),kinds:defKinds(),offs:[],lect:{},att:{},disabledHol:[]};}
/* 불러온 데이터 검증: id·날짜·교시·색은 형식이 맞는 것만 (HTML 속성에 들어가므로) */
const ID_RE=/^[A-Za-z0-9_-]{1,40}$/,DATE_RE=/^\d{4}-\d{2}-\d{2}$/,TIME_RE=/^\d{2}:\d{2}$/,HEX_RE=/^#[0-9a-fA-F]{6}$/;
const okId=v=>typeof v==='string'&&ID_RE.test(v),okDate=v=>typeof v==='string'&&DATE_RE.test(v)?v:'',str=v=>v==null?'':String(v).slice(0,200);
const okPs=v=>Array.isArray(v)?[...new Set(v.map(Number).filter(p=>Number.isInteger(p)&&p>=1&&p<=NP))].sort((a,b)=>a-b):[];
function normA(s){
  const f=freshA();if(!s||typeof s!=='object')return f;
  const arr=v=>Array.isArray(v)?v:[],obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{},hasId=x=>x&&okId(x.id);
  const tracks=arr(s.tracks).filter(hasId).map(t=>({id:t.id,name:str(t.name),...(t.ex?{ex:true}:{})}));
  const tid=v=>okId(v)&&tracks.some(t=>t.id===v)?v:'';
  const lecturers=arr(s.lecturers).filter(hasId).map(x=>({id:x.id,name:str(x.name),subject:str(x.subject),phone:str(x.phone),memo:str(x.memo),...(x.ex?{ex:true}:{})}));
  const kinds=arr(s.kinds).filter(hasId).map(k=>({id:k.id,name:str(k.name),noClass:!!k.noClass,color:HEX_RE.test(k.color)?k.color:KC[4]}));
  const students=arr(s.students).filter(hasId).map(x=>({id:x.id,name:str(x.name),track:tid(x.track),no:str(x.no),admit:okDate(x.admit),complete:okDate(x.complete),commute:x.commute==='N'?'N':'Y',dorm:okDate(x.dorm),cnp:x.cnp==='Y'?'Y':'N',memo:str(x.memo),...(x.ex?{ex:true}:{})}));
  const lect={};Object.entries(obj(s.lect)).forEach(([k,v])=>{const [d,t]=k.split('|');if(!DATE_RE.test(d)||!tid(t)||!Array.isArray(v))return;const a=Array.from({length:NP},(_,i)=>okId(v[i])?v[i]:'');if(a.some(Boolean))lect[k]=a;});
  const sids=new Set(students.map(x=>x.id)),att={};
  Object.entries(obj(s.att)).forEach(([k,v])=>{const [d,id]=k.split('|');if(!DATE_RE.test(d)||!sids.has(id)||!v||typeof v!=='object'||!ST.includes(v.s))return;const r={s:v.s};if(PART.includes(v.s))r.p=okPs(v.p);if(v.m)r.m=str(v.m);att[k]=r;});
  return {
    tracks,students,lecturers,
    periods:arr(s.periods).length===NP?s.periods.map((p,i)=>({s:p&&TIME_RE.test(p.s)?p.s:DEF_P[i][0],e:p&&TIME_RE.test(p.e)?p.e:DEF_P[i][1]})):f.periods,
    kinds:kinds.length?kinds:f.kinds,
    offs:arr(s.offs).filter(o=>hasId(o)&&okDate(o.from)).map(o=>({id:o.id,from:o.from,to:okDate(o.to),kind:okId(o.kind)?o.kind:'event',name:str(o.name),track:tid(o.track),periods:okPs(o.periods),...(o.ex?{ex:true}:{})})),
    lect,att,disabledHol:arr(s.disabledHol).filter(v=>typeof v==='string'&&DATE_RE.test(v)),ex:!!s.ex
  };
}
function loadA(){try{const r=localStorage.getItem(AKEY);if(r)return normA(JSON.parse(r));}catch(e){}return freshA();}
let A=loadA();
function saveA(){SC.clear();try{localStorage.setItem(AKEY,JSON.stringify(A));}catch(e){}}

const au={mi:0,track:'',view:'month',wk:null,modal:null,tab:null,day:null,dayTrack:'',sel:new Set(),multi:false,arm:null,
  stat:{mode:'month',mi:0,from:AMIN,to:AMAX,track:'',upto:1},exp:{from:0,to:0,track:'',upto:1,sh:{daily:1,dsum:0,mstat:1,total:1,mrate:1,lcal:1,lhours:1,allow:1,roster:1}},
  stuF:'',opener:null};
{const i=AM.findIndex(m=>TODAY.startsWith(ymOf(m)));au.mi=i>=0?i:(TODAY<AMIN?0:AM.length-1);au.stat.mi=au.mi;au.exp.from=au.mi;au.exp.to=au.mi;}
function fixTrack(){const gone=id=>id&&!A.tracks.some(t=>t.id===id);if(gone(au.track))au.track='';if(gone(au.stat.track))au.stat.track='';if(gone(au.exp.track))au.exp.track='';if(gone(au.stuF))au.stuF='';if(gone(au.dayTrack))au.dayTrack='';if(!au.track&&A.tracks.length&&au.view==='week')au.track=A.tracks[0].id;}

/* ---------- schedule rules ---------- */
const SC=new Map();
const holOn=k=>HOL[k]&&!A.disabledHol.includes(k)?HOL[k]:null;
const kindOf=o=>A.kinds.find(x=>x.id===o.kind)||{id:'?',name:'기타',noClass:false,color:KC[4]};
const offCovers=(o,p)=>!o.periods||!o.periods.length||o.periods.includes(p);
/* 그날(k) 그 직종(tid)의 수업 교시. tid='' 은 "전체" — 모든 직종 공통 특이사항만 적용 */
function sched(k,tid){
  const key=k+'|'+(tid||'');let r=SC.get(key);if(r)return r;
  r={ps:[],labs:[],why:'',hol:null,wk:isWk(k)};
  if(!r.wk){
    r.hol=holOn(k);
    if(r.hol)r.why=r.hol;
    else{
      let ps=PS.slice();
      A.offs.forEach(o=>{
        if(o.from<=k&&k<=(o.to||o.from)&&(!o.track||o.track===tid)){
          const kd=kindOf(o);r.labs.push({o,kd});
          if(kd.noClass){if(!o.periods||!o.periods.length){ps=[];if(!r.why)r.why=o.name||kd.name;}else ps=ps.filter(p=>!o.periods.includes(p));}
        }
      });
      r.ps=ps;
    }
  }
  SC.set(key,r);return r;
}
const enrolled=(s,k)=>(!s.admit||s.admit<=k)&&(!s.complete||k<=s.complete);
const isDorm=(s,k)=>s.dorm?k>=s.dorm:s.commute==='N';
const trackName=id=>{const t=A.tracks.find(x=>x.id===id);return t?t.name:'(직종 없음)';};
const lectName=id=>{const l=A.lecturers.find(x=>x.id===id);return l?l.name:'';};
const stuSorted=tid=>{const ord={};A.tracks.forEach((t,i)=>ord[t.id]=i);return A.students.filter(s=>!tid||s.track===tid).sort((a,b)=>((ord[a.track]??99)-(ord[b.track]??99))||(a.no||'').localeCompare(b.no||'',undefined,{numeric:true})||a.name.localeCompare(b.name,'ko'));};
/* 하루 출결 판정: 50% 미만 출석이면 지각·조퇴·결과도 결석 */
function evalDay(s,k){
  if(!enrolled(s,k))return null;
  const sc=sched(k,s.track),n=sc.ps.length;if(!n)return null;
  const r=A.att[k+'|'+s.id];
  if(!r||!r.s||r.s==='출석')return {st:'출석',n,miss:0,abs:false,conv:false,p:[],m:r&&r.m||''};
  if(ABS.includes(r.s))return {st:r.s,n,miss:n,abs:true,conv:false,p:sc.ps.slice(),m:r.m||''};
  const p=(r.p||[]).filter(x=>sc.ps.includes(x));const miss=Math.min(n,Math.max(1,p.length));
  const conv=(n-miss)*2<n;
  return {st:r.s,n,miss,abs:conv,conv,p,m:r.m||''};
}
function weekdays(a,b){const out=[];let d=P(a);const e=P(b);while(d<=e){const w=d.getDay();if(w&&w<6)out.push(K(d));d=addD(d,1);}return out;}
const monthRange=m=>[ymOf(m)+'-01',K(new Date(m.y,m.m+1,0))];
/* 학생 통계: 지각·조퇴·결과 3회 = 결석 1일 (달마다 따로 환산) */
function statStu(s,a,b){
  const o={sd:0,sp:0,ap:0,yu:0,mu:0,ji:0,jo:0,gy:0,conv:0,hw:0,abs:0,att:0,dd:0,cd:0,rate:null,en:false};const mp={};
  weekdays(a,b).forEach(k=>{
    if(enrolled(s,k))o.en=true;
    const e=evalDay(s,k);if(!e)return;o.sd++;o.sp+=e.n;
    if(e.st==='유고결석')o.yu++;else if(e.st==='무단결석')o.mu++;
    else if(e.conv)o.conv++;
    else if(e.st!=='출석'){o[{지각:'ji',조퇴:'jo',결과:'gy'}[e.st]]++;const m=k.slice(0,7);(mp[m]=mp[m]||[]).push(isDorm(s,k));}
    if(!e.abs){o.ap+=e.n-e.miss;if(isDorm(s,k))o.dd++;else o.cd++;}
  });
  /* 환산결석 n일 = 그 달 마지막 지각·조퇴·결과 n일을 출석일에서 뺌 (그날의 통학·기숙 기준) */
  Object.values(mp).forEach(days=>{const n=Math.floor(days.length/3);o.hw+=n;days.slice(days.length-n).forEach(d=>{if(d)o.dd--;else o.cd--;});});
  o.abs=o.yu+o.mu+o.conv+o.hw;o.att=Math.max(0,o.sd-o.abs);o.rate=o.sd?o.att/o.sd:null;
  return o;
}
const SUMK=['sd','sp','ap','yu','mu','ji','jo','gy','conv','hw','abs','att','dd','cd'];
function sumStats(list){const o={};SUMK.forEach(k=>o[k]=0);list.forEach(x=>SUMK.forEach(k=>o[k]+=x[k]));o.rate=o.sd?o.att/o.sd:null;return o;}
/* 외부강사 시수 (교시 = 1시수, 수업 있는 교시만) */
function lectHours(a,b){
  const out={};/* out[lid][ym][tid]=n */
  Object.keys(A.lect).forEach(key=>{
    const [k,tid]=key.split('|');if(k<a||k>b||isWk(k))return;
    const arr=A.lect[key]||[],sc=sched(k,tid);
    arr.forEach((lid,i)=>{if(!lid||!sc.ps.includes(i+1))return;const ym=k.slice(0,7);((out[lid]=out[lid]||{})[ym]=out[lid][ym]||{})[tid]=(out[lid][ym][tid]||0)+1;});
  });
  return out;
}
function lectRuns(k,tid){/* 같은 강사가 이어진 교시를 묶어 [{lid,a,b}] */
  const arr=A.lect[k+'|'+tid]||[],sc=sched(k,tid),runs=[];
  PS.forEach(p=>{const l=sc.ps.includes(p)?arr[p-1]:'';const last=runs[runs.length-1];if(l&&last&&last.lid===l&&last.b===p-1)last.b=p;else if(l)runs.push({lid:l,a:p,b:p});});
  return runs;
}
const runTxt=r=>(r.a===r.b?r.a:r.a+'–'+r.b)+'교시';
function offLabel(k,tid,p){return sched(k,tid).labs.filter(x=>offCovers(x.o,p)).map(x=>x.o.name||x.kd.name).join(', ');}

/* ---------- sample ---------- */

let toastT;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
let dlP=null;
function linkSave(name,blob){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}catch(e){}}
function download(name,blob){
  if(window.claude&&typeof window.claude.use==='function'){dlP=dlP||window.claude.use('downloads').catch(()=>null);dlP.then(dl=>{if(!dl){linkSave(name,blob);return;}dl.save({filename:name,data:blob}).then(()=>toast('저장했어요')).catch(e=>{if(e&&e.code==='declined')return;linkSave(name,blob);});});return;}
  linkSave(name,blob);
}
function weeksOf(y,m){const last=new Date(y,m+1,0);let d=new Date(y,m,1);const w=d.getDay();d=w===6?addD(d,2):w===0?addD(d,1):addD(d,-(w-1));const out=[];while(d<=last){out.push([0,1,2,3,4].map(i=>addD(d,i)));d=addD(d,7);}return out;}
const monOf=k=>{const d=P(k);return K(addD(d,-((d.getDay()+6)%7)));};
function segA(act,cur,opts,extra){return '<div class="seg" role="group">'+opts.map(([v,l])=>'<button data-a="'+act+'" data-v="'+esc(v)+'"'+(extra||'')+' class="'+(cur===v?'on':'')+'" aria-pressed="'+(cur===v)+'">'+esc(l)+'</button>').join('')+'</div>';}
const trackOpts=(cur,all)=>(all?'<option value="">'+esc(all)+'</option>':'')+A.tracks.map(t=>'<option value="'+t.id+'"'+(t.id===cur?' selected':'')+'>'+esc(t.name)+'</option>').join('');
const monthOpts=cur=>AM.map((m,i)=>'<option value="'+i+'"'+(i===cur?' selected':'')+'>'+m.y+'년 '+(m.m+1)+'월</option>').join('');

function daySummary(k,tid){/* 출결 요약 배지 */
  const stus=stuSorted(tid);const tally={};let n=0;
  stus.forEach(s=>{const e=evalDay(s,k);if(!e)return;n++;if(e.st!=='출석'){const key=e.conv?e.st+'→결석':e.st;(tally[key]=tally[key]||[]).push(s.name);}});
  if(!n)return '';
  const keys=Object.keys(tally);
  if(!keys.length)return k<=TODAY?'<div class="ast"><span class="ab ok"><span class="okl">●</span> 출석 '+n+'</span></div>':'';
  return '<div class="ast">'+keys.map(t=>{const abs=ABS.includes(t)||/→/.test(t);return '<span class="ab '+(abs?'abs':'part')+'" title="'+esc(tally[t].join(', '))+'">'+esc(t.replace('→결석','*'))+' '+tally[t].length+'</span>';}).join('')+'</div>';
}
function acell(d,inMonth){
  const k=K(d),tid=au.track,sc=sched(k,tid);
  const cls=['cell'];if(k<TODAY&&inMonth)cls.push('past');if(!inMonth)cls.push('out');if(sc.hol)cls.push('hol');else if(!sc.ps.length)cls.push('nocls');if(k===TODAY){cls.push('tnow');if(!sc.hol)cls.push('today');}
  let h='<div class="'+cls.join(' ')+'" data-a="day" data-k="'+k+'" role="button" tabindex="'+(inMonth&&(k===au.fk||(!au.fk&&k===TODAY))?0:-1)+'" aria-label="'+esc(fmtD(k)+(sc.hol?' '+sc.hol:'')+(sc.ps.length?' 수업 '+sc.ps.length+'교시':' 수업 없음'))+'"'+(k===TODAY?' aria-current="date"':'')+'>';
  h+='<div class="ch"><span class="dnum">'+(d.getDate()===1?(d.getMonth()+1)+'/':'')+d.getDate()+'</span>';
  if(k===TODAY)h+='<span class="lab tdy">TODAY</span>';
  if(sc.hol)h+='<span class="lab h">'+esc(sc.hol)+'</span>';
  h+='</div>';
  if(k<AMIN||k>AMAX)return h+'</div>';
  sc.labs.forEach(x=>{const pp=x.o.periods&&x.o.periods.length?' '+x.o.periods.join('·')+'교시':'';h+='<div class="ln" style="color:'+esc(x.kd.color)+';font-weight:700" title="'+esc((x.o.name||x.kd.name)+pp+(x.kd.noClass?' · 수업 없음':''))+'">'+esc(x.o.name||x.kd.name)+'<span style="font-weight:400">'+esc(pp)+'</span></div>';});
  if(!inMonth)return h+'</div>';
  if(sc.ps.length){
    if(sc.ps.length<NP)h+='<div class="ln">수업 '+sc.ps.length+'교시</div>';
    if(tid){lectRuns(k,tid).forEach(r=>{h+='<div class="ln"><b>'+esc(lectName(r.lid))+'</b> '+runTxt(r)+'</div>';});}
    else{const ls=new Set();A.tracks.forEach(t=>lectRuns(k,t.id).forEach(r=>ls.add(r.lid)));if(ls.size)h+='<div class="ln">강사 <b>'+esc([...ls].map(lectName).join(', '))+'</b></div>';}
    h+=daySummary(k,tid);
  }else if(!sc.hol&&!sc.labs.length)h+='<div class="ln">수업 없음</div>';
  return h+'</div>';
}

function applyLec(lid){
  const tid=selTrack();if(!tid){toast('직종을 먼저 고르세요');return;}let skip=0,n=0;
  Object.entries(selGroups()).forEach(([k,ps])=>{const sc=sched(k,tid),key=k+'|'+tid;const arr=(A.lect[key]||Array(NP).fill('')).slice();ps.forEach(p=>{if(lid&&!sc.ps.includes(p)){skip++;return;}arr[p-1]=lid;n++;});if(arr.some(Boolean))A.lect[key]=arr;else delete A.lect[key];});
  saveA();au.sel.clear();rerender();toast((lid?lectName(lid)+' '+n+'교시 넣음':n+'교시 비움')+(skip?' · 수업 없는 '+skip+'칸 제외':''));
}
function applyOff(kind,name){
  const tid=selTrack();if(!tid){toast('직종을 먼저 고르세요');return;}
  Object.entries(selGroups()).forEach(([k,ps])=>{A.offs.push({id:uid(),from:k,to:'',kind,name,track:tid,periods:ps.length===NP?[]:ps});});
  saveA();au.sel.clear();rerender();toast('특이사항을 넣었어요');
}
function clearOff(){
  const tid=selTrack();let range=0,n=0;
  Object.entries(selGroups()).forEach(([k,ps])=>{
    A.offs.slice().forEach(o=>{
      if(!(o.from<=k&&k<=(o.to||o.from)))return;if(o.track&&o.track!==tid)return;
      if(!o.track||(o.to&&o.to!==o.from)){if(ps.some(p=>offCovers(o,p)))range++;return;}
      const left=(o.periods&&o.periods.length?o.periods:PS).filter(p=>!ps.includes(p));
      if(left.length===((o.periods&&o.periods.length)?o.periods.length:NP))return;
      n++;if(!left.length)A.offs=A.offs.filter(x=>x!==o);else o.periods=left;
    });
  });
  saveA();au.sel.clear();rerender();toast((n?'특이사항 '+n+'건 지움':'지울 특이사항 없음')+(range?' · 기간·전체 직종 특이사항은 수업일 설정에서':''));
}

function tabsA(list){return '<div class="tabs" role="tablist">'+list.map(([v,l])=>'<button role="tab" id="atab-'+v+'" aria-selected="'+(au.tab===v)+'" tabindex="'+(au.tab===v?0:-1)+'" class="'+(au.tab===v?'on':'')+'" data-a="tab" data-v="'+v+'">'+l+'</button>').join('')+'</div>';}
function openAM(kind,opt){if(!au.modal)au.opener=document.activeElement;au.modal=kind;au.arm=null;Object.assign(au,opt||{});$('att').inert=true;$('aov').hidden=false;au.sel.clear();renderAM();const f=$('amodal').querySelector('[role=tab][aria-selected=true]')||$('amodal').querySelector('[data-a=closem]');f&&f.focus();}
function closeAM(){au.modal=null;au.arm=null;au.sel.clear();$('aov').hidden=true;$('amodal').innerHTML='';$('att').inert=false;renderA();const o=au.opener;au.opener=null;try{if(o&&document.contains(o))o.focus();}catch(e){}}
const AFK=['data-a','data-v','data-sid','data-s','data-p','data-k','data-id','data-f','data-m'];
function aKey(el){if(!el||el===document.body)return null;if(el.id)return '#'+CSS.escape(el.id);const s=AFK.filter(x=>el.hasAttribute(x)).map(x=>'['+x+'="'+CSS.escape(el.getAttribute(x))+'"]').join('');return s?el.tagName.toLowerCase()+s:null;}
function renderAM(){
  fixTrack();
  const md=$('amodal'),a=document.activeElement,key=md.contains(a)?aKey(a):null,ob=md.querySelector('.mb'),top=ob?ob.scrollTop:0,same=au.lastM===au.modal+'|'+au.tab;
  md.className='modal wide';
  md.innerHTML=({day:mDay,roster:mRoster,lects:mLects,days:mDays,stats:mStats,export:mExport,data:mData}[au.modal]||(()=>''))();
  au.lastM=au.modal+'|'+au.tab;
  const nb=md.querySelector('.mb');if(nb&&same)nb.scrollTop=top;
  if(key){let n=null;try{n=md.querySelector(key);}catch(e){}if(n)n.focus({preventScroll:true});}
  if(au.modal==='day')renderActBar();
}

  else{
    h+='<div class="dayp" data-selroot>';
    PS.forEach(p=>{h+='<div class="pl">'+p+'교시<small>'+esc(A.periods[p-1].s)+'–'+esc(A.periods[p-1].e)+'</small></div>'+pcell(k,tid,p,0);});

  if(!sc.ps.length){h+='<div class="empty">수업 없는 날 · 출결 없음</div>';return h+'</div>';}
  const stus=stuSorted(tid).filter(s=>enrolled(s,k));
  if(!stus.length){h+='<div class="empty">이 날 재적 학생 없음</div>';return h+'</div>';}
  const nOff=stus.filter(s=>A.att[k+'|'+s.id]&&A.att[k+'|'+s.id].s!=='출석').length;
  h+='<div class="form" style="margin-bottom:6px"><span class="meta">'+stus.length+'명 · 출석 아님 '+nOff+'명</span>'+(nOff?'<button class="btn" data-a="allok">모두 출석으로</button>':'')+'</div>';

  });
  return h+'</div>';
}

function hoursTable(fi,ti,tid){
  const ms=AM.slice(fi,ti+1),[a]=monthRange(ms[0]),[,b]=monthRange(ms[ms.length-1]),L=lectHours(a,b);
  const ids=A.lecturers.map(l=>l.id).filter(id=>L[id]);
  if(!ids.length)return '<div class="empty">기록된 시수 없음</div>';
  let h='<div class="tw"><table class="atbl"><thead><tr><th>강사</th>'+ms.map(m=>'<th class="r">'+(m.y%100)+'.'+(m.m+1)+'</th>').join('')+'<th class="r">합계</th></tr></thead><tbody>';
  const cnt=(id,m)=>Object.entries((L[id]||{})[ymOf(m)]||{}).reduce((t,[t2,n])=>t+(!tid||t2===tid?n:0),0);
  const tot=ms.map(()=>0);
  ids.forEach(id=>{let s=0;h+='<tr><td>'+esc(lectName(id))+'</td>'+ms.map((m,i)=>{const n=cnt(id,m);s+=n;tot[i]+=n;return '<td class="r">'+(n||'')+'</td>';}).join('')+'<td class="r"><b>'+s+'</b></td></tr>';});
  h+='<tr class="sub"><td>합계</td>'+tot.map(n=>'<td class="r">'+n+'</td>').join('')+'<td class="r">'+tot.reduce((x,y)=>x+y,0)+'</td></tr>';
  return h+'</tbody></table></div>';
}

function normDate(v){
  v=String(v||'').trim();if(!v)return '';let m;
  if((m=v.match(/^(\d{4})[-.\/년 ]+\s*(\d{1,2})[-.\/월 ]+\s*(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=v.match(/^(\d{4})(\d{2})(\d{2})$/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=v.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/)))return '20'+m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(/^\d{5}$/.test(v)){const d=new Date(Date.UTC(1899,11,30)+(+v)*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
  return null;
}
const yn=(v,def)=>{v=String(v||'').trim().toUpperCase();if(!v)return def;return /^(Y|YES|O|예|네|1|TRUE|참여|해당|통학)$/.test(v)?'Y':/^(N|NO|X|아니오|아니요|0|FALSE|미참여|비해당|기숙)$/.test(v)?'N':def;};
function pasteImport(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()?l.split(l.includes('\t')?'\t':','):null).filter(Boolean);
  if(lines.length&&/이름|성명/.test(lines[0][0]))lines.shift();
  let n=0;const bad=[];
  lines.forEach((c,i)=>{
    const name=(c[0]||'').trim();if(!name)return;
    const tn=(c[1]||'').trim()||'(미지정)';let t=A.tracks.find(x=>x.name===tn);if(!t){t={id:uid(),name:tn};A.tracks.push(t);}
    const admit=normDate(c[2]),complete=normDate(c[3]),dorm=normDate(c[5]);
    if(admit===null||complete===null||dorm===null){bad.push(i+1);return;}
    A.students.push({id:uid(),name,track:t.id,admit:admit||'',complete:complete||'',commute:yn(c[4],'Y'),dorm:dorm||'',cnp:yn(c[6],'N'),no:(c[7]||'').trim(),memo:(c[8]||'').trim()});n++;
  });
  return {n,bad};
}

  au.sel=new Set(drag.base);
  drag.root.querySelectorAll('[data-pc]').forEach(x=>{const di=+x.dataset.di,p=+x.dataset.p;if(di>=d0&&di<=d1&&p>=p0&&p<=p1)au.sel.add(x.dataset.k+'|'+p);});
  paintSel();
}
function endDrag(restore){if(!drag)return;if(restore)au.sel=drag.orig;drag=null;paintSel();renderActBar();}
addEventListener('blur',()=>endDrag(true));
document.addEventListener('pointermove',e=>{if(!drag)return;if(e.pointerType==='mouse'&&!(e.buttons&1)){endDrag(false);return;}const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('[data-pc]');if(c&&drag.root.contains(c)){if(c!==drag.start)drag.moved=true;dragTo(c);}});
document.addEventListener('pointerup',()=>{if(!drag)return;if(!drag.moved&&drag.toggle){au.sel.delete(drag.start.dataset.k+'|'+drag.start.dataset.p);}endDrag(false);});
document.addEventListener('pointercancel',()=>endDrag(true));

$('amodal').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.am){const key=au.day+'|'+t.dataset.am;const r=A.att[key]||{s:'출석'};r.m=t.value;if(r.s==='출석'&&!r.m)delete A.att[key];else A.att[key]=r;saveA();return;}
  if(t.dataset.tn){const x=A.tracks.find(q=>q.id===t.dataset.tn);if(x){x.name=t.value;delete x.ex;saveA();renderA();}return;}
  if(t.dataset.lid&&t.tagName==='INPUT'){const x=A.lecturers.find(q=>q.id===t.dataset.lid);if(x){x[t.dataset.f]=t.value;saveA();}return;}
  if(t.dataset.sid&&t.dataset.f&&t.tagName==='INPUT'&&t.type!=='date'){const x=A.students.find(q=>q.id===t.dataset.sid);if(x){x[t.dataset.f]=t.value;saveA();}return;}
  if(t.dataset.on){const o=A.offs.find(q=>q.id===t.dataset.on);if(o){o.name=t.value;saveA();}return;}
  if(t.dataset.kn){const k=A.kinds.find(q=>q.id===t.dataset.kn);if(k){k.name=t.value;saveA();}return;}
});
$('amodal').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sid&&t.dataset.f&&(t.tagName==='SELECT'||t.type==='date')){const x=A.students.find(q=>q.id===t.dataset.sid);if(x){x[t.dataset.f]=t.value;saveA();renderAM();renderA();}return;}
  if(t.dataset.sid||t.dataset.lid||t.dataset.on||t.dataset.kn||t.dataset.tn){renderA();return;}
  if(t.dataset.kc){const k=A.kinds.find(q=>q.id===t.dataset.kc);if(k){k.color=t.value;saveA();renderA();}return;}
  if(t.dataset.kx){const k=A.kinds.find(q=>q.id===t.dataset.kx);if(k){k.noClass=t.checked;saveA();renderAM();renderA();}return;}
  if(t.dataset.ps!=null||t.dataset.pe!=null){const i=+(t.dataset.ps??t.dataset.pe);A.periods[i][t.dataset.ps!=null?'s':'e']=t.value;saveA();renderA();return;}
  if(t.dataset.ah){const k=t.dataset.ah;A.disabledHol=A.disabledHol.filter(x=>x!==k);if(!t.checked)A.disabledHol.push(k);saveA();renderA();return;}
  if(t.dataset.exs){au.exp.sh[t.dataset.exs]=t.checked?1:0;return;}
  if(t.id==='ex-from'){au.exp.from=+t.value;if(au.exp.to<au.exp.from)au.exp.to=au.exp.from;renderAM();return;}
  if(t.id==='ex-to'){au.exp.to=+t.value;if(au.exp.to<au.exp.from)au.exp.from=au.exp.to;renderAM();return;}
  if(t.id==='ex-track'){au.exp.track=t.value;return;}
  if(t.id==='st-mi'){au.stat.mi=+t.value;renderAM();return;}
  if(t.id==='st-from'||t.id==='st-to'){if(t.value)au.stat[t.id==='st-from'?'from':'to']=t.value;renderAM();return;}
  if(t.id==='st-track'){au.stat.track=t.value;renderAM();return;}
  if(t.id==='st-upto'){au.stat.upto=t.checked?1:0;renderAM();return;}
  if(t.id==='ex-upto'){au.exp.upto=t.checked?1:0;return;}
  if(t.id==='abk-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{$('abk-in').value=r.result;au.pendingImp=r.result;$('abk-err').textContent='';};r.readAsText(t.files[0]);return;}
});
document.addEventListener('keydown',e=>{
  if(!isAtt())return;
  if(e.key==='Escape'){const ti=[...document.querySelectorAll('#att .ti,#amodal .ti')].find(x=>!x.classList.contains('tt-off')&&(x===document.activeElement||x.matches(':hover')));if(ti){e.preventDefault();ti.classList.add('tt-off');return;}
    if(au.modal){e.preventDefault();closeAM();return;}if(au.sel.size){au.sel.clear();paintSel();renderActBar();}return;}
  if(au.modal&&e.key==='Tab'){const f=[...$('amodal').querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||!$('amodal').contains(document.activeElement))){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}
  if(au.modal&&e.target.getAttribute('role')==='tab'){const ts=[...$('amodal').querySelectorAll('[role=tab]')],i=ts.indexOf(e.target),j={ArrowLeft:i-1,ArrowRight:i+1,Home:0,End:ts.length-1}[e.key];if(j!=null){e.preventDefault();const n=ts[(j+ts.length)%ts.length];au.tab=n.dataset.v;renderAM();const nt=$('atab-'+au.tab);nt&&nt.focus();}return;}
  if(au.modal&&e.key==='Enter'&&!e.isComposing){const id=e.target.id;const map={'t-name':'tadd','n-name':'sadd','l-name':'ladd','k-name':'kadd'};if(map[id]){e.preventDefault();const b=$('amodal').querySelector('[data-a="'+map[id]+'"]');b&&b.click();}return;}
  if(!au.modal&&e.target.classList&&e.target.classList.contains('cell')&&e.target.dataset.k){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click();return;}
    const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5}[e.key];
    if(mv){e.preventDefault();const cs=[...document.querySelectorAll('#a-grid .cell')],i=cs.indexOf(e.target)+mv;if(cs[i]){e.target.tabIndex=-1;cs[i].tabIndex=0;au.fk=cs[i].dataset.k;cs[i].focus();}return;}
  }
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||au.modal)return;
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();goA(-1);}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();goA(1);}
  if(e.key==='PageUp'){e.preventDefault();goA(-1);}if(e.key==='PageDown'){e.preventDefault();goA(1);}
});

/* ---------- init ---------- */
let mode='admin';try{mode=localStorage.getItem(MKEY)==='att'?'att':'admin';}catch(e){}
try{if(/[?#&]mode=att/.test(location.href))mode='att';}catch(e){}
setMode(mode);
})();
