    /* 학생부 */
    case 'arm':if(v==='imp'){const ta=$('abk-in'),txt=ta?ta.value.trim():'';if(!txt){$('abk-err').textContent='백업 파일이나 내용 필요';break;}au.pendingImp=txt;}au.arm=v;renderAM();break;
    case 'disarm':au.arm=null;renderAM();break;
    case 'stuf':au.stuF=v;renderAM();break;
    case 'tadd':{const n=$('t-name').value.trim();if(!n)break;if(A.tracks.some(x=>x.name===n)){toast('이미 있는 직종');break;}A.tracks.push({id:uid(),name:n});saveA();renderAM();renderA();const f=$('t-name');f&&f.focus();break;}
    case 'tup':{const i=A.tracks.findIndex(x=>x.id===t.dataset.id);if(i>0){[A.tracks[i-1],A.tracks[i]]=[A.tracks[i],A.tracks[i-1]];saveA();renderAM();renderA();}break;}
    case 'tdel':{const id=t.dataset.id,gone=new Set(A.students.filter(s=>s.track===id).map(s=>s.id));A.tracks=A.tracks.filter(x=>x.id!==id);A.students=A.students.filter(s=>s.track!==id);A.offs=A.offs.filter(o=>o.track!==id);Object.keys(A.lect).forEach(k=>{if(k.split('|')[1]===id)delete A.lect[k];});Object.keys(A.spec).forEach(k=>{if(k.split('|')[1]===id)delete A.spec[k];});Object.keys(A.att).forEach(k=>{if(gone.has(k.split('|')[1]))delete A.att[k];});au.arm=null;saveA();renderAM();renderA();toast('직종을 지웠어요');break;}
    case 'sadd':{const nm=$('n-name').value.trim(),er=$('s-err');if(!nm){er.textContent='이름 필요';break;}
      const s={id:uid(),name:nm,track:$('n-track').value,no:String(A.students.filter(x=>x.track===$('n-track').value).length+1),admit:$('n-admit').value,complete:$('n-complete').value,commute:$('n-commute').value,dorm:$('n-dorm').value,cnp:$('n-cnp').value,memo:''};
      if(s.complete&&s.admit&&s.complete<s.admit){er.textContent='수료일이 입학일보다 빨라요';break;}
      A.students.push(s);saveA();renderAM();renderA();const f=$('n-name');if(f){f.value='';f.focus();}toast(nm+' 추가');break;}
    case 'sdel':{const id=t.dataset.id;A.students=A.students.filter(s=>s.id!==id);Object.keys(A.att).forEach(k=>{if(k.split('|')[1]===id)delete A.att[k];});au.arm=null;saveA();renderAM();renderA();break;}
    case 'pasteimp':{const r=pasteImport($('paste-in').value);if(!r.n&&!r.bad.length){$('paste-err').textContent='붙여넣은 내용이 없어요';break;}saveA();au.tab='stu';renderAM();renderA();toast('학생 '+r.n+'명 추가'+(r.bad.length?' · 날짜를 못 읽은 줄 '+r.bad.join(','):''));break;}
    /* 강사 */
    case 'ladd':{const n=$('l-name').value.trim();if(!n){$('l-err').textContent='이름 필요';break;}A.lecturers.push({id:uid(),name:n,subject:$('l-subject').value.trim(),phone:$('l-phone').value.trim(),memo:''});saveA();renderAM();renderA();const f=$('l-name');f&&f.focus();break;}
    case 'ldel':{const id=t.dataset.id;A.lecturers=A.lecturers.filter(l=>l.id!==id);Object.keys(A.lect).forEach(k=>{A.lect[k]=A.lect[k].map(l=>l===id?'':l);if(!A.lect[k].some(Boolean))delete A.lect[k];});au.arm=null;saveA();renderAM();renderA();break;}
    /* 수업일 */
    case 'oadd':{const f=$('o-from').value,to=$('o-to').value,er=$('o-err');if(!f){er.textContent='시작 날짜 필요';break;}if(to&&to<f){er.textContent='끝이 시작보다 빨라요';break;}
      const ps=PS.filter(p=>{const c=$('o-p'+p);return c&&c.checked;});
      A.offs.push({id:uid(),from:f,to:to&&to!==f?to:'',kind:$('o-kind').value,name:$('o-name').value.trim(),track:$('o-track').value,periods:ps.length===NP?[]:ps});saveA();renderAM();renderA();toast('특이사항을 추가했어요');break;}
    case 'odel':A.offs=A.offs.filter(o=>o.id!==t.dataset.id);saveA();renderAM();renderA();break;
    case 'kadd':{const n=$('k-name').value.trim();if(!n)break;A.kinds.push({id:uid(),name:n,noClass:$('k-x').checked,color:KC[A.kinds.length%5]});saveA();renderAM();break;}
    case 'kdel':A.kinds=A.kinds.filter(k=>k.id!==t.dataset.id);saveA();renderAM();break;
    case 'pdef':A.periods=DEF_P.map(([s,e])=>({s,e}));saveA();renderAM();renderA();break;
    /* 분석 · 엑셀 */
    case 'smode':au.stat.mode=v;renderAM();break;
    case 'stexp':{const st=au.stat,[a,b]=statRange();au.exp.from=Math.max(0,AM.findIndex(m=>a.startsWith(ymOf(m))));const ti=AM.findIndex(m=>b.startsWith(ymOf(m)));au.exp.to=ti<0?AM.length-1:ti;au.exp.track=st.track;au.exp.upto=st.upto;au.modal='export';au.tab=null;renderAM();break;}
    case 'exall':au.exp.from=0;au.exp.to=AM.length-1;renderAM();break;
    case 'exgo':doExport();break;
    /* 백업 */
    case 'bk':download('출석백업_'+TODAY+'.json',new Blob([JSON.stringify(Object.assign({},A,{fixed:FXA.list()}),null,1)],{type:'application/json'}));break;
    case 'imp':{try{const s=JSON.parse($('abk-in').value||au.pendingImp||'');if(!s||!Array.isArray(s.students))throw 0;A=normA(s);FXA.imp(s);saveA();au.arm=null;au.pendingImp=null;au.track='';renderAM();renderA();toast('불러왔어요 · 학생 '+A.students.length+'명');}catch(err){au.arm=null;renderAM();$('abk-err').textContent='출석 백업 형식이 아니에요';}break;}
    case 'reset':A=freshA();au.arm=null;au.track='';saveA();renderAM();renderA();toast('출석 데이터를 지웠어요');break;
  }
});
/* 끌어서 교시 고르기 */
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(!isAtt()||e.button!==0)return;const c=e.target.closest('[data-pc]');if(!c)return;
  if(e.pointerType==='mouse')e.preventDefault();
  const add=e.ctrlKey||e.metaKey||e.shiftKey||au.multi;
  drag={base:add?new Set(au.sel):new Set(),orig:new Set(au.sel),a:[+c.dataset.di,+c.dataset.p],root:c.closest('[data-selroot]'),moved:false,start:c,toggle:add&&au.sel.has(c.dataset.k+'|'+c.dataset.p)};
  dragTo(c);if(e.pointerType==='mouse')c.focus({preventScroll:true});
});
function dragTo(c){
  const b=[+c.dataset.di,+c.dataset.p],d0=Math.min(drag.a[0],b[0]),d1=Math.max(drag.a[0],b[0]),p0=Math.min(drag.a[1],b[1]),p1=Math.max(drag.a[1],b[1]);
  au.sel=new Set(drag.base);
  drag.root.querySelectorAll('[data-pc]').forEach(x=>{const di=+x.dataset.di,p=+x.dataset.p;if(di>=d0&&di<=d1&&p>=p0&&p<=p1)au.sel.add(x.dataset.k+'|'+p);});
  paintSel();
}
function endDrag(restore){if(!drag)return;if(restore)au.sel=drag.orig;drag=null;paintSel();renderActBar();}
addEventListener('blur',()=>endDrag(true));
document.addEventListener('pointermove',e=>{if(!drag)return;if(e.pointerType==='mouse'&&!(e.buttons&1)){endDrag(false);return;}const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('[data-pc]');if(c&&drag.root.contains(c)){if(c!==drag.start)drag.moved=true;dragTo(c);}});
document.addEventListener('pointerup',()=>{if(!drag)return;if(!drag.moved&&drag.toggle){au.sel.delete(drag.start.dataset.k+'|'+drag.start.dataset.p);}endDrag(false);});
document.addEventListener('pointercancel',()=>endDrag(true));

$('amodal').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.am){const key=au.day+'|'+t.dataset.am;const r=A.att[key]||{s:'출석'};r.m=t.value;if(r.s==='출석'&&!r.m)delete A.att[key];else A.att[key]=r;saveA();return;}
  if(t.dataset.tn){const x=A.tracks.find(q=>q.id===t.dataset.tn);if(x){x.name=t.value;delete x.ex;saveA();renderA();}return;}
  if(t.dataset.lid&&t.tagName==='INPUT'){const x=A.lecturers.find(q=>q.id===t.dataset.lid);if(x){x[t.dataset.f]=t.value;saveA();}return;}
  if(t.dataset.sid&&t.dataset.f&&t.tagName==='INPUT'&&t.type!=='date'){const x=A.students.find(q=>q.id===t.dataset.sid);if(x){x[t.dataset.f]=t.value;saveA();}return;}
  if(t.dataset.on){const o=A.offs.find(q=>q.id===t.dataset.on);if(o){o.name=t.value;saveA();}return;}
  if(t.dataset.kn){const k=A.kinds.find(q=>q.id===t.dataset.kn);if(k){k.name=t.value;saveA();}return;}
  if(t.dataset.sjn){const x=A.subjects.find(q=>q.id===t.dataset.sjn);if(x){x.name=t.value;saveA();renderA();}return;}
});
$('amodal').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sid&&t.dataset.f&&(t.tagName==='SELECT'||t.type==='date')){const x=A.students.find(q=>q.id===t.dataset.sid);if(x){x[t.dataset.f]=t.value;saveA();renderAM();renderA();}return;}
  if(t.dataset.sid||t.dataset.lid||t.dataset.on||t.dataset.kn||t.dataset.tn||t.dataset.sjn){renderA();return;}
  if(t.dataset.sjc){const x=A.subjects.find(q=>q.id===t.dataset.sjc);if(x){x.color=t.value;saveA();renderA();}return;}
  if(t.dataset.kc){const k=A.kinds.find(q=>q.id===t.dataset.kc);if(k){k.color=t.value;saveA();renderA();}return;}
  if(t.dataset.kx){const k=A.kinds.find(q=>q.id===t.dataset.kx);if(k){k.noClass=t.checked;saveA();renderAM();renderA();}return;}
  if(t.dataset.ps!=null||t.dataset.pe!=null){const i=+(t.dataset.ps??t.dataset.pe);A.periods[i][t.dataset.ps!=null?'s':'e']=t.value;saveA();renderA();return;}
  if(t.dataset.fxf){if(FXA.edit(t)&&(t.dataset.fxf==='from'||t.dataset.fxf==='to'))renderAM();return;}
  if(t.dataset.ah){const k=t.dataset.ah;A.disabledHol=A.disabledHol.filter(x=>x!==k);if(!t.checked)A.disabledHol.push(k);saveA();renderA();return;}
  if(t.dataset.exs){au.exp.sh[t.dataset.exs]=t.checked?1:0;return;}
  if(t.id==='ex-from'){au.exp.from=+t.value;if(au.exp.to<au.exp.from)au.exp.to=au.exp.from;renderAM();return;}
  if(t.id==='ex-to'){au.exp.to=+t.value;if(au.exp.to<au.exp.from)au.exp.from=au.exp.to;renderAM();return;}
  if(t.id==='ex-track'){au.exp.track=t.value;return;}
  if(t.id==='st-mi'){au.stat.mi=+t.value;renderAM();return;}
  if(t.id==='st-from'||t.id==='st-to'){if(t.value)au.stat[t.id==='st-from'?'from':'to']=t.value;renderAM();return;}
  if(t.id==='st-track'){au.stat.track=t.value;renderAM();return;}
  if(t.id==='st-upto'){au.stat.upto=t.checked?1:0;renderAM();return;}
  if(t.id==='ex-upto'){au.exp.upto=t.checked?1:0;return;}
  if(t.id==='abk-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{$('abk-in').value=r.result;au.pendingImp=r.result;$('abk-err').textContent='';};r.readAsText(t.files[0]);return;}
});
document.addEventListener('keydown',e=>{
  if(!isAtt())return;
  if(e.key==='Escape'){const ti=[...document.querySelectorAll('#att .ti,#amodal .ti')].find(x=>!x.classList.contains('tt-off')&&(x===document.activeElement||x.matches(':hover')));if(ti){e.preventDefault();ti.classList.add('tt-off');return;}
    if(au.modal){e.preventDefault();closeAM();return;}if(au.sel.size){au.sel.clear();paintSel();renderActBar();}return;}
  if(au.modal&&e.key==='Tab'){const f=[...$('amodal').querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||!$('amodal').contains(document.activeElement))){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}
  if(au.modal&&e.target.getAttribute('role')==='tab'){const ts=[...$('amodal').querySelectorAll('[role=tab]')],i=ts.indexOf(e.target),j={ArrowLeft:i-1,ArrowRight:i+1,Home:0,End:ts.length-1}[e.key];if(j!=null){e.preventDefault();const n=ts[(j+ts.length)%ts.length];au.tab=n.dataset.v;renderAM();const nt=$('atab-'+au.tab);nt&&nt.focus();}return;}
  if(au.modal&&e.key==='Enter'&&!e.isComposing){const id=e.target.id;const map={'t-name':'tadd','n-name':'sadd','l-name':'ladd','k-name':'kadd','sj-name':'sjadd'};if(map[id]){e.preventDefault();const b=$('amodal').querySelector('[data-a="'+map[id]+'"]');b&&b.click();}return;}
  if(!au.modal&&e.target.classList&&e.target.classList.contains('cell')&&e.target.dataset.k){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click();return;}
    const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5}[e.key];
    if(mv){e.preventDefault();const cs=[...document.querySelectorAll('#a-grid .cell')],i=cs.indexOf(e.target)+mv;if(cs[i]){e.target.tabIndex=-1;cs[i].tabIndex=0;au.fk=cs[i].dataset.k;cs[i].focus();}return;}
  }
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||au.modal)return;
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();goA(-1);}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();goA(1);}
  if(e.key==='PageUp'){e.preventDefault();goA(-1);}if(e.key==='PageDown'){e.preventDefault();goA(1);}
});

/* ---------- init ---------- */
let mode='admin';try{mode=localStorage.getItem(MKEY)==='att'?'att':'admin';}catch(e){}
try{if(/[?#&]mode=att/.test(location.href))mode='att';}catch(e){}
setMode(mode);
})();
</script>
