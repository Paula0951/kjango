<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>평일 업무 달력</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: full-bleed warm-dark editorial page. Top nav (4 items) / hero month title + controls / dashed-line weekday grid / "next up" list. Filters and item detail slide in as drawers; no permanent sidebar. */
:root{
  color-scheme:dark;
  --bg:#100904; --fg:#ffedd7; --surface:#382416; --ember:#dc5000;
  --line:color-mix(in srgb,var(--fg) 26%,var(--bg));
  --strong:color-mix(in srgb,var(--fg) 58%,var(--bg));
  --faint:color-mix(in srgb,var(--fg) 52%,var(--bg));
  --hover:#241710;
  --c1:#a3c47a; --c2:#e6c95c; --c3:#c3a0e8; --c4:#e08fb6; --c0:#cdb79a; --over:#f0661a;
  --muted:color-mix(in srgb,var(--fg) 66%,var(--bg));
  --hol-bg:#2c1304; --hol-fg:#f0661a; --today-bg:#2a1a0c;
  --high-bg:var(--fg); --high-fg:var(--bg);
  --chip-h:color-mix(in srgb,var(--surface) 78%,var(--fg)); --out:color-mix(in srgb,var(--surface) 30%,var(--bg));
  --focus-tint:color-mix(in srgb,var(--surface) 35%,var(--bg));
  --fs:14px;
  --font:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:Consolas,"D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 var(--fs)/1.5 var(--font);padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
input[type=checkbox]{accent-color:var(--fg)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow span{color:var(--faint);margin-left:8px}

.app{position:relative;min-height:100vh;display:grid;grid-template-columns:176px minmax(0,1fr);column-gap:52px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column;padding:30px 28px 30px 0;border-right:2px dashed var(--strong);overflow-y:auto}
.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;line-height:1.5}
.rail .yr{margin:24px 0 4px}
.mrow{display:block;width:100%;text-align:left;padding:4px 0;font-size:15px;color:var(--muted);min-height:24px}
.mrow:hover{color:var(--fg)}
.mrow.on{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:7px}
.tools{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:2px}
.tool{text-align:left;padding:7px 0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.tool:hover{color:var(--fg)}
.app.side-open #nav-filter{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:6px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hero{display:flex;justify-content:space-between;align-items:center;gap:10px 28px;flex-wrap:wrap;padding:20px 0 16px}
.hl{min-width:0}
.ttl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mtitle{font-size:clamp(34px,4vw,56px);line-height:1;font-weight:500;margin:0;letter-spacing:0;text-transform:uppercase}
.ghost.nv{padding:0;width:36px;justify-content:center;flex-shrink:0}
.ttl>.ghost:not(.nv){margin-left:6px;padding:6px 16px;min-height:32px}
.msub{font-size:14px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
.msub .banner{border:0;padding:0;margin:0;font-size:13px;gap:8px;color:var(--muted)}
.tline{font-size:13px;letter-spacing:.02em;color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-decoration-color:var(--strong);text-underline-offset:5px}
.tline:hover{text-decoration-color:var(--fg)}
.tline b{font-weight:700}
.hero-r{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 28px;min-width:0}
.stat{display:flex;gap:22px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.stat b{font-weight:500;font-size:22px;color:var(--fg);margin-right:6px;font-variant-numeric:tabular-nums;letter-spacing:0}
.ghost{border:1px solid var(--fg);border-radius:22.5px;padding:8px 20px;font-size:12px;letter-spacing:.1em;display:inline-flex;align-items:center;gap:8px;min-height:36px}
.ghost:hover{background:var(--surface)}
.search input{border:0;border-bottom:1px solid var(--fg);border-radius:0;background:transparent;padding:6px 2px;width:min(200px,60vw);font-size:14px;outline:0}
.search input::placeholder{color:var(--muted)}

.banner{border:1px dashed var(--faint);border-radius:12px;padding:12px 18px;margin:0 0 18px;font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner button{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}

.gw{padding-bottom:8px}
.dow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0 0 10px;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.dow span{padding-left:14px}
.dow small{margin-left:8px;font-size:11px;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:2px dashed var(--strong);grid-auto-rows:minmax(0,1fr)}
.cell:nth-child(-n+5){border-top:0}.cell:nth-child(5n+1){border-left:0}
.cell{border-top:1px dashed var(--line);border-left:1px dashed var(--line);padding:10px 12px 8px;display:flex;flex-direction:column;gap:5px;min-width:0;min-height:0;overflow:visible;clip-path:inset(0 -100vw);cursor:pointer;position:relative;--px:12px;--ins:6px}
/* 기간 막대의 제목이 오른쪽 칸 위로 넘쳐 그려지므로 앞 칸이 위에 온다 (세로만 잘라 냄) */
.cell:nth-child(5n+1){z-index:5}.cell:nth-child(5n+2){z-index:4}.cell:nth-child(5n+3){z-index:3}.cell:nth-child(5n+4){z-index:2}
.cell>*{flex-shrink:0}
.cell:hover{background:var(--hover);outline:1px dashed var(--strong);outline-offset:-5px}
.cell.tnow:hover{background:var(--today-bg)}
.cell:focus-visible{outline:2px dashed var(--fg);outline-offset:-6px}
@media (prefers-reduced-motion:no-preference){.cell>*{transition:transform .14s ease}.cell:hover>*,.cell:focus-visible>*{transform:translateY(-2px)}.add{transition:opacity .12s}}
.cell.past .dnum{color:var(--strong)}.cell.past .chip{opacity:.78}
.dow span.now{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:6px}
.cell.out .dnum{color:var(--strong)}
.cell.out .chip,.cell.out .more{color:var(--muted)}
.cell.today{background:var(--today-bg);outline:2px dashed var(--fg);outline-offset:-5px}
.cell.hol{background:var(--hol-bg)}
.ch{display:flex;align-items:center;gap:10px;min-height:26px}
.dnum{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.cell.tnow .dnum{background:transparent;color:var(--fg);border:2px solid var(--fg);font-weight:700;border-radius:999px;padding:4px 10px;margin:-3px 0 -3px -11px}
.lab.tdy{font-size:11px;letter-spacing:.16em;color:var(--fg);font-weight:700}
.cell.hol .dnum{color:var(--hol-fg)}
.lab{font-size:12px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--muted)}
.lab.h{color:var(--hol-fg)}
.add{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.add:hover{border-color:var(--fg);color:var(--fg)}
@media (hover:hover){.add{opacity:0}.cell:hover .add,.add:focus-visible{opacity:1}}
.note{font-size:11px;letter-spacing:.04em;color:var(--muted)}
.chipw{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.chip{display:flex;align-items:center;gap:8px;text-align:left;flex:1;min-width:0;padding:2px 0;font-size:var(--fs);color:var(--fg)}
.chip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .tg{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chip.high .tg{border:2px solid var(--high-fg);width:11px;height:11px}
.chip.doing .t::before{content:'◐';margin-right:7px;color:var(--fg)}
.chip.high.doing .t::before{color:var(--high-fg);margin-right:5px}
.chip:hover .t{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.chip.high{background:var(--high-bg);color:var(--high-fg);border-radius:999px;padding:2px 12px 2px 10px;gap:6px;flex:0 1 auto;max-width:100%}
.chip .bang{margin-right:4px;font-weight:700}
.chip.high .tg{margin-left:0}
.chip.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--strong);color:var(--muted)}
.chip.done .t::before,.drow.done .t:not(.tk)::before{content:'✓';display:inline-block;margin-right:7px;text-decoration:none;color:var(--fg)}
.chip.sel{outline:1px dashed var(--fg);outline-offset:4px}
.late{flex-shrink:0;font-size:11px;letter-spacing:.04em;color:var(--over);font-variant-numeric:tabular-nums;white-space:nowrap}
/* D+n은 칩(알약) 안 오른쪽 끝, 첨부 표시는 작은 클립 글리프 — 제목이 칸 너비를 거의 다 쓴다 */
.chip .late{margin-left:auto;padding-left:4px}
.chip.high .late{color:var(--high-fg);font-weight:700;border-left:1px solid color-mix(in srgb,var(--high-fg) 40%,transparent);padding-left:6px;margin-left:2px}
.chip.overdue .hl{display:none}
.cell.hasmore .lab.tdy{display:none}
.cell .ch{container-type:inline-size}
@container (max-width:120px){.lab.tdy{display:none}}
.chip .hl{width:11px;height:11px;flex-shrink:0;opacity:.65}
/* 클립 버튼은 칸/칩에 마우스·포커스가 있을 때만 (키보드 Tab으로는 항상 도달) */
.chipw .clip{position:absolute;right:0;top:50%;transform:translateY(-50%);width:24px;height:24px;background:var(--surface);border-color:var(--strong);color:var(--fg);opacity:0;z-index:1}
.chipw:hover .clip,.chipw:focus-within .clip,.clip:focus-visible{opacity:1}
@media (hover:none){.chipw .clip{opacity:1}}
.cell.past .chip.overdue{opacity:1}
.stat .over b{color:var(--over)}
.badge.late{border-color:var(--over);color:var(--over)}
.more{font-size:12px;line-height:1.3;letter-spacing:.04em;color:var(--muted);text-align:left;padding:1px 0}
.ch .more{margin-left:auto;padding:2px 8px;border:1px dashed var(--strong);border-radius:999px;white-space:nowrap}.ch .more:hover{color:var(--fg);border-color:var(--fg)}.ch .more~.add{margin-left:0}
.more:hover{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.clip{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.clip:hover{border-color:var(--fg);color:var(--fg)}
.clip svg.i{width:13px;height:13px}
/* 기간 막대 (.rl = 막대 칸들, .rb = 한 칸 분량의 조각) */
.rl{display:flex;flex-direction:column;gap:3px}
.rb{position:relative;display:block;height:22px;box-sizing:border-box;margin:0 calc(-1*var(--px));padding:0;text-align:left;font-size:13px;line-height:20px;color:var(--fg);background:color-mix(in srgb,var(--tc) 26%,var(--bg));border-top:1px solid color-mix(in srgb,var(--tc) 75%,var(--bg));border-bottom:1px solid color-mix(in srgb,var(--tc) 75%,var(--bg));cursor:pointer}
.rb[hidden]{display:none}
.rb.ph{visibility:hidden;pointer-events:none}
.rb.cs{margin-left:calc(var(--ins) - var(--px));border-left:1px solid color-mix(in srgb,var(--tc) 75%,var(--bg));border-radius:11px 0 0 11px}
.rb.ce{margin-right:calc(var(--ins) - var(--px));border-right:3px solid var(--tc);border-radius:0 11px 11px 0}
.rb:hover{background:color-mix(in srgb,var(--tc) 40%,var(--bg))}
.rb:focus-visible{outline:2px dashed var(--fg);outline-offset:1px;z-index:2}
.rb .rt{position:absolute;left:0;top:0;height:100%;box-sizing:border-box;width:calc(var(--n)*(100% + var(--sl)) - var(--sl) - var(--er) + var(--n)*1px - 1px);padding:0 calc(8px + var(--rp,0px)) 0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none;z-index:1}
.rb.cl .rt{padding-left:12px}.rb.cr::after{content:'▸';position:absolute;right:6px;top:0;color:var(--fg);font-size:11px}
.rb.high.cr::after,.rb.high .late{color:var(--high-fg)}
.rb .late{position:absolute;right:6px;top:0;font-size:11px;z-index:1}
.rb.high{background:var(--high-bg);color:var(--high-fg);border-top-color:var(--high-bg);border-bottom-color:var(--high-bg)}
.rb.high.cs{border-left-color:var(--high-bg)}
.rb.high:hover{background:#fff6e8}
.rb.high .bang{margin-right:4px;font-weight:700}
.rb.doing .rt::before{content:'◐';margin-right:6px}
.rb.done{background:transparent;border-top-style:dashed;border-bottom-style:dashed;border-top-color:var(--strong);border-bottom-color:var(--strong);color:var(--muted)}
.rb.done.cs{border-left:1px dashed var(--strong)}.rb.done.ce{border-right:3px solid var(--strong)}
.rb.done .rt .rtt{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--strong)}
.rb.done .rt::before{content:'✓';margin-right:6px;color:var(--fg)}
.rb.sel{outline:1px dashed var(--fg);outline-offset:2px}
/* 완료 체크박스 (과제만). 보이는 크기 14px, ::before로 히트 영역 26px. 진행 중 = 반쯤 채움 */
.cb{position:relative;display:inline-block;width:14px;height:14px;flex-shrink:0;margin:0 -2px 0 0;padding:0;border:1.5px solid var(--tc,var(--c0));border-radius:3px;background:transparent;color:var(--bg);font-size:10px;line-height:11px;text-align:center;cursor:pointer}
.cb::before{content:'';position:absolute;inset:-6px}
.cb:hover{background:color-mix(in srgb,var(--tc,var(--c0)) 35%,transparent)}
.cb.mid{background:linear-gradient(90deg,var(--tc,var(--c0)) 50%,transparent 50%)}
.cb[aria-checked=true]{background:var(--tc,var(--c0))}.cb[aria-checked=true]::after{content:'✓';font-weight:700}
.cb:focus-visible{outline:2px dashed var(--fg);outline-offset:2px}
.cb[hidden]{display:none}
.cb.w-strong{border-width:2px;box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--tc,var(--c0))}.cb.w-ref{border-style:dashed;opacity:.85}
.cbb{position:absolute;left:calc(var(--ins) - var(--px) + 6px);top:calc(var(--lane)*var(--lh,25px) + (var(--rh,22px) - 14px)/2);z-index:2;margin:0}
.cbb.cl{left:calc(6px - var(--px))}
.rl{--lh:25px;--rh:22px;position:relative}.mm .rl{--lh:21px;--rh:18px}
.rb.tk .rt{padding-left:28px}.rb.tk.cl .rt{padding-left:30px}
.rb.tk.done .rt::before,.rb.tk.doing .rt::before{content:none}
.chipw.tk .chip .tg{display:none}
.chipw.tk .chip.done .t::before,.chipw.tk .chip.doing .t::before{content:none}
.chipw.tk .chip.high{padding-left:12px}
/* 날짜 범위 끌기 선택 */
.grid{user-select:none;-webkit-user-select:none}
.cell.rsel{background:var(--surface);outline:1px dashed var(--fg);outline-offset:-5px}
.cell.rsel.today,.cell.rsel.tnow{outline:2px dashed var(--fg)}
.cell.rsel:hover{background:var(--surface)}
body.rdrag,body.rdrag .cell,body.rdrag .chip,body.rdrag .rb{cursor:crosshair}
.cell.past .rb:not(.overdue){opacity:.78}
.cell.out .rb{color:var(--muted)}.cell.out .rb.high{color:var(--high-fg)}
.rb.overdue .late{color:var(--over)}.rb.high.overdue .late{color:var(--high-fg)}
.cell.drop,.detail.drop,.modal.drop,.qa.drop{outline:1px dashed var(--fg);outline-offset:-6px;background:var(--surface)}
.modal{position:relative}
/* 끌어다 놓기 중인 칸/패널 한가운데 안내 */
.drop::after{content:"여기에 놓기";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);color:var(--fg);border:1px dashed var(--fg);border-radius:999px;padding:6px 14px;font-size:12px;letter-spacing:.06em;white-space:nowrap;pointer-events:none;z-index:4}

.next{margin-top:28px;padding:28px 0 32px;border-top:2px dashed var(--strong)}
.nrow{display:flex;align-items:center;gap:14px;width:100%;border-bottom:1px dashed var(--line);font-size:15px}
.nbtn{display:grid;grid-template-columns:150px minmax(0,1fr) auto 72px;gap:18px;align-items:center;flex:1;min-width:0;text-align:left;padding:17px 0}
/* 완료 체크(task) / 일정·참고 표시(event) */
.drow .cb,.nrow .cb{position:relative;width:20px;height:20px;border:1.5px solid var(--faint);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;flex-shrink:0;color:var(--fg)}
.drow .cb::before,.nrow .cb::before{content:'';position:absolute;inset:-3px}
.drow .cb:hover,.nrow .cb:hover{border-color:var(--fg)}
.drow .cb.on,.nrow .cb.on{background:var(--surface);border-color:var(--fg)}
.ev{width:20px;text-align:center;color:var(--faint);flex-shrink:0;font-size:12px}
.drow.cbk.done .t:not(.tk)::before{content:none}
.dmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.next .eyebrow+.nrow{border-top:1px dashed var(--line);margin-top:18px}
.nrow:hover{background:var(--out)}
.nd{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt em{font-style:normal;background:var(--high-bg);color:var(--high-fg);border-radius:999px;padding:1px 9px;margin-right:8px;font-size:12px}
.ng{color:var(--muted);font-size:12px;white-space:nowrap}
.ndd.now{color:var(--fg);font-weight:700}
.ndd{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.06em}
.qa{position:sticky;bottom:0;z-index:12;background:var(--bg);border-top:2px dashed var(--strong);padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.qa-box{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--fg);padding:2px 2px 6px}
.qa-box input{flex:1;border:0;outline:0;background:transparent;min-width:0;font-size:16px;padding:4px 0}
.qa-box input::placeholder{color:var(--muted)}
.qa-hint{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px;letter-spacing:.02em}
.qa-hint.err{color:var(--ember)}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.ib:hover{border-color:var(--fg);color:var(--fg)}
.ib.sm{width:26px;height:26px}.ib.sm svg.i{width:13px;height:13px}
.ib.xs{position:relative;width:22px;height:22px}.ib.xs svg.i{width:13px;height:13px}
.ib.xs::before{content:'';position:absolute;inset:-5px}.sbtn .dot::before{content:'';position:absolute;inset:-7px}
.ck input[type=checkbox]{width:18px;height:18px;margin:0 3px;flex-shrink:0}
.tline,.banner button,.lk-n{min-height:24px}
.grow{flex:1}
.ti::before{content:'';position:absolute;inset:-5px}
.ti{position:relative;width:22px;height:22px;border-radius:50%;border:1px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;vertical-align:middle;text-transform:none;letter-spacing:0}
.ti svg.i{width:12px;height:12px}
.ti:hover,.ti:focus-visible{border-color:var(--fg);color:var(--fg)}
/* 툴팁: role=tooltip 요소 (aria-describedby로 연결). 모양은 이전 ::after와 동일 */
.ti .tt{position:absolute;bottom:calc(100% + 10px);left:-8px;width:max-content;max-width:min(300px,80vw);white-space:pre-line;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--strong);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.65;letter-spacing:.02em;font-weight:500;opacity:0;pointer-events:none;z-index:60}

.tok{height:28px;min-width:28px;padding:0 9px;border-radius:999px;border:1px dashed var(--faint);color:var(--muted);font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tok:hover{border-style:solid;border-color:var(--fg);color:var(--fg)}

/* 빠른 추가 입력 하이라이트: 투명 글자 input 뒤에 같은 글꼴의 미러(.mir)를 깔고 토큰만 알약으로 칠한다.
   미러는 패딩·글자 크기가 input과 같고 토큰에 가로 여백이 없어 캐럿 위치가 어긋나지 않는다 */
.qin{position:relative;flex:1;min-width:0;display:flex}
.qin .mir,.qin input{font:inherit;font-size:16px;line-height:24px;letter-spacing:normal;padding:4px 0;margin:0;border:0}
.qin .mir{position:absolute;inset:0;white-space:pre;overflow:hidden;pointer-events:none;color:var(--fg);text-align:left}
.qa-box .qin input{position:relative;z-index:1;width:100%;flex:1;color:transparent;caret-color:var(--fg);background:transparent}
.qin input::selection{background:color-mix(in srgb,var(--fg) 30%,transparent);color:transparent}
.tk{border-radius:999px;background:var(--tkf,transparent);outline:1px var(--tks,solid) var(--tko,transparent);outline-offset:1px;box-shadow:0 0 0 1px var(--tkf,transparent)}
/* 종류(# @ ! /)는 접두 글자가, 값은 모양이 구분한다. 색만으로 구분하지 않는다.
   분류: 강조=태그색 채움+굵게(미러에선 굵기 없이 채움+실선, 캐럿 정렬 때문) · 보통=윤곽 · 참고=점선+흐린 글자
   담당: 나=Bark 채움+실선 · 그 외=점선. 날짜: 오늘·내일=Bark+크림 윤곽 · 이번 주=실선 · 이후=흐림+점선 · 지남=--over 점선 */
.tk.t{--tkc:var(--c0);color:var(--tkc);--tko:color-mix(in srgb,var(--tkc) 62%,transparent)}
.tk.t.s{--tkf:color-mix(in srgb,var(--tkc) 26%,var(--bg));--tko:var(--tkc)}
.tk.t.r{color:var(--muted);--tko:color-mix(in srgb,var(--tkc) 50%,transparent);--tks:dashed}
.hc.t.s,.hc.w.me,.hc.d.now{font-weight:700}
.tk.w{--tko:var(--strong);--tks:dashed}
.tk.w.me{--tkf:var(--surface);--tks:solid}
.tk.p.h{--tkf:var(--high-bg);color:var(--high-fg);--tko:var(--high-bg)}
.tk.p.l{color:var(--muted);--tko:var(--faint);--tks:dashed}
.tk.p.m{--tko:var(--strong);--tks:dashed}
.tk.d{--tko:var(--strong)}
.tk.d.now{--tkf:var(--surface);--tko:var(--fg)}
.tk.d.far{color:var(--muted);--tko:var(--faint);--tks:dashed}
.tk.d.over{color:var(--over);--tko:var(--over);--tks:dashed}
.tk.x{color:var(--over);--tko:var(--over);--tks:dashed;text-decoration:underline wavy var(--over);text-underline-offset:3px}
.hc[data-rel]::after{content:attr(data-rel);margin-left:6px;font-size:11px;font-weight:500;letter-spacing:.04em}
/* 힌트 줄 칩 / 작성 팝업 칩: 같은 종류별 색, 여백 있는 버전 */

const DEF_SYN={d:'/',p:'!',hi:['높음','중요','high'],lo:['낮음','low'],mid:['보통'],fmt:'slash',inn:{ymd:1,md:1,kor:1,dd:1,rel:1,wd:1}};

function synCheck(c){
  const sym=v=>typeof v==='string'&&v.length===1&&!/[\s\p{L}\p{N}~.\-_,]/u.test(v)&&v!=='#'&&v!=='@';
  for(const [k,l] of [['d','날짜'],['p','중요']]){if(c[k]==='#'||c[k]==='@')return '# 와 @ 는 분류·담당자 전용이에요';if(!sym(c[k]))return l+' 기호는 한 글자예요 (글자·숫자·공백·~ . - _ , 는 안 돼요)';}
  if(c.d===c.p)return '날짜와 중요 기호가 같아요';
  const seen=new Set();
  for(const [k,l] of [['hi','높음'],['lo','낮음'],['mid','보통']]){
    if(!Array.isArray(c[k]))return l+' 말이 잘못됐어요';
    if(k!=='mid'&&!c[k].length)return l+' 말이 하나는 있어야 해요';
    for(const w of c[k]){if(!/^[^\s#@,]+$/.test(w))return l+' 말에 공백·#·@·쉼표는 못 써요';const lw=w.toLowerCase();if(seen.has(lw))return '"'+w+'" 가 겹쳐요';seen.add(lw);}
  }
  if(!['slash','korean','iso'].includes(c.fmt))return '표시 형식이 잘못됐어요';
  if(!(c.inn.ymd||c.inn.md||c.inn.rel))return '날짜 형식을 하나는 켜 두세요 (연-월-일 · 월-일 · 오늘/내일)';
  return '';
}
function normSyn(x){
  x=x&&typeof x==='object'?x:{};
  const c={d:x.d,p:x.p,hi:x.hi,lo:x.lo,mid:x.mid,fmt:x.fmt,inn:Object.assign({},DEF_SYN.inn)};
  if(x.inn&&typeof x.inn==='object')Object.keys(DEF_SYN.inn).forEach(k=>{if(k in x.inn)c.inn[k]=x.inn[k]?1:0;});
  Object.keys(DEF_SYN).forEach(k=>{if(c[k]==null)c[k]=JSON.parse(JSON.stringify(DEF_SYN[k]));});
  return synCheck(c)?JSON.parse(JSON.stringify(DEF_SYN)):c;
}

/* 완료 체크가 필요한 분류인가: 분류별 설정(S.tagDone on/off) > 일정 키워드(자동) */
const tagNeed0=t=>!kwHit(t,'event');
const tagNeed=t=>{const v=S.tagDone&&S.tagDone[t];return v==='on'?true:v==='off'?false:tagNeed0(t);};
/* 완료 체크가 필요한 항목(task)인가. 항목의 kind가 우선, 없으면 분류에서 추정(분류가 없거나 하나라도 필요하면 필요) */
function needsDone(i){if(i.kind==='task')return true;if(i.kind==='event')return false;const ts=i.tags||[];return !ts.length||ts.some(tagNeed);}
const tagW=t=>{const v=S.tagWeights&&S.tagWeights[t];return v==='strong'||v==='normal'||v==='ref'?v:tagW0(t);};
const WLAB={strong:'강조',normal:'보통',ref:'참고'};
/* 칩에 붙일 클래스(t / t s / t r)와 --tkc 인라인 스타일 */
function tagStyle(t){const w=tagW(t);return {w:w,cls:'t'+(w==='strong'?' s':w==='ref'?' r':''),st:'--tkc:'+tagColor(t),ttl:w==='normal'?'':' title="'+WLAB[w]+' 분류"'};}
const whoCls=v=>'w'+(v==='나'?' me':'');
/* 항목의 대표 분류(강조 > 보통 > 참고)와 달력 칸 점: 강조=고리 · 참고=속 빈 점 */
function primaryTag(i){const ts=i.tags||[];return ts.find(t=>tagW(t)==='strong')||ts.find(t=>tagW(t)!=='ref')||ts[0];}
function tagDot(i,extra){
  const t=primaryTag(i),c=tagColor(t),w=t?tagW(t):'normal',hi=i.priority==='high'&&i.status!=='done';
  return '<span class="tg" style="'+(w==='ref'?'background:transparent;box-shadow:inset 0 0 0 1.5px '+c:'background:'+c+(w==='strong'&&!hi?';outline:1.5px solid '+c+';outline-offset:1.5px':''))+(extra||'')+'"></span>';
}
const tagsHTML=ts=>ts.map(t=>{const x=tagStyle(t);return '<span class="tk hc sm '+x.cls+'" style="'+x.st+'"'+x.ttl+'>#'+esc(t)+'</span>';}).join('');
const whoHTML=ws=>ws.map(v=>'<span class="tk hc sm '+whoCls(v)+'">@'+esc(v)+'</span>').join('');
/* 날짜의 가까움(오늘 기준): 지남 / 오늘·내일(또는 오늘이 범위 안) / 이번 주 / 이후 */
function dateRel(due,start){
  if(start&&start<=TODAY&&TODAY<=due)return 'now';
  if(due<TODAY)return 'over';
  const n=Math.round((P(due)-P(TODAY))/864e5);return n<=1?'now':n<=7?'wk':'far';
}
function dateStyle(due,start){
  const r=dateRel(due,start);
  return {cls:r==='wk'?'d':'d '+r,rel:r==='over'?ddayTxt(due):r==='now'?(start&&start<=TODAY&&TODAY<due?'진행':due===TODAY?'오늘':'내일'):''};
}

function applyStyle(){
  const r=document.documentElement.style;
  STYLE_VARS.forEach(([k,v])=>{S.style[k]?r.setProperty(v,S.style[k]):r.removeProperty(v);});
  r.setProperty('--fs',(+S.style.fontSize||DEF_STYLE.fontSize)+'px');
}
function cssVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function weeksOf(y,m){
  const last=new Date(y,m+1,0);let d=new Date(y,m,1);const w=d.getDay();
  d=w===6?addD(d,2):w===0?addD(d,1):addD(d,-(w-1));
  const out=[];while(d<=last){out.push([0,1,2,3,4].map(i=>addD(d,i)));d=addD(d,7);}return out;
}
const holOn=k=>HOLIDAYS[k]&&!S.disabledHol.includes(k)?HOLIDAYS[k]:null;
function dayInfo(k){
  const d=P(k),w=d.getDay(),notes=[];
  if(S.style.weekendNotes){
    const chk=(dd,label)=>{const kk=K(dd);const h=holOn(kk);if(h)notes.push({t:label+' '+h,h:true});S.customs.filter(c=>c.date===kk).forEach(c=>notes.push({t:label+' '+c.name,c:c.color}));};
    if(w===5)chk(addD(d,1),'토');
    if(w===1)chk(addD(d,-1),'일');
  }
  if(w>=1&&w<=5)FIXED.forEach(f=>{if(f.from<=k&&k<=f.to&&f.on)notes.push({t:f.name,f:1});});
  return {hol:holOn(k),customs:S.customs.filter(c=>c.date===k),notes};
}
const PR={high:0,normal:1,low:2};
const cmp=(a,b)=>((a.status==='done')-(b.status==='done'))||(PR[a.priority]-PR[b.priority])||a.title.localeCompare(b.title,'ko');
function visible(i){
  const f=ui.filter;
  if(S.style.hideDone&&i.status==='done')return false;
  if(f.tag&&!i.tags.includes(f.tag))return false;
  if(f.who&&!i.assignees.includes(f.who))return false;
  if(f.mode==='high'&&i.priority!=='high')return false;
  if(f.mode==='open'&&i.status==='done')return false;
  if(ui.q){const q=ui.q.toLowerCase();if(![i.title,i.memo,i.tags.join(' '),i.assignees.join(' '),(i.links||[]).map(l=>l.name).join(' ')].join(' ').toLowerCase().includes(q))return false;}
  return true;
}
const isRange=i=>!!(i.start&&i.start<i.due);
const itemsOn=k=>S.items.filter(i=>i.due===k&&!isRange(i)&&visible(i)).sort(cmp);
const fmtMD=k=>{const d=P(k);return (d.getMonth()+1)+'/'+d.getDate();};
/* 기간 항목(start<due)을 주(월~금) 단위 막대 조각으로 나눠 같은 줄(lane)에 쌓는다. 주 안에서 모든 칸이 같은 lane 번호를 쓰므로 막대가 정렬된다 */
let WL={};
function weekLanes(monK){
  if(WL[monK])return WL[monK];
  const mon=P(monK),friK=K(addD(mon,4)),sunK=K(addD(mon,6)),pre=K(addD(mon,-2));
  const segs=S.items.filter(i=>isRange(i)&&i.start<=friK&&i.due>=monK&&visible(i)).map(i=>{
    const a=i.start>monK?i.start:monK,b=i.due<friK?i.due:friK;
    return {i,c0:(P(a).getDay()+6)%7,c1:(P(b).getDay()+6)%7,contL:i.start<pre,contR:i.due>sunK,endsHere:i.due<=friK};
  }).sort((x,y)=>x.c0-y.c0||(y.c1-y.c0)-(x.c1-x.c0)||cmp(x.i,y.i));
  const lanes=[];
  segs.forEach(sg=>{let l=lanes.findIndex(L=>L[L.length-1].c1<sg.c0);if(l<0){lanes.push([]);l=lanes.length-1;}lanes[l].push(sg);});
  return WL[monK]=lanes;
}
function rangeHTML(d,lanes){
  const col=(d.getDay()+6)%7;let last=-1;
  const cur=lanes.map(L=>L.find(sg=>sg.c0<=col&&col<=sg.c1)||null);
  cur.forEach((x,li)=>{if(x)last=li;});
  if(last<0)return {h:'',n:0};
  let h='<div class="rl">',n=0;
  cur.slice(0,last+1).forEach((sg,li)=>{
    if(!sg){h+='<span class="rb ph" data-lane="'+li+'" aria-hidden="true"></span>';return;}
    n++;
    const i=sg.i,hi=i.priority==='high'&&i.status!=='done',late=isLate(i),first=col===sg.c0,lastc=col===sg.c1;
    const cls='rb'+(needsDone(i)?' tk':'')+(hi?' high':'')+(i.status==='done'?' done':i.status==='doing'?' doing':'')+(late?' overdue':'')+(ui.sel===i.id?' sel':'')+(first&&!sg.contL?' cs':'')+(lastc&&sg.endsHere?' ce':'')+(first&&sg.contL?' cl':'')+(lastc&&sg.contR?' cr':'');
    const lateTxt=late&&lastc&&sg.endsHere?'<span class="late" aria-hidden="true">'+ddayTxt(i.due)+'</span>':'';
    const rng=fmtMD(i.start)+'~'+fmtMD(i.due);
    const common=' data-lane="'+li+'" data-act="item" data-id="'+i.id+'" style="--tc:'+tagColor(primaryTag(i))+(first?';--n:'+(sg.c1-sg.c0+1)+';--sl:'+(sg.contL?'0px':'var(--ins)')+';--er:'+(sg.endsHere?'var(--ins)':'0px')+';--rp:'+((sg.contR?14:0)+(late&&sg.endsHere?34:0))+'px':'')+'"';
    if(first){
      h+='<button class="'+cls+'"'+common+' title="'+esc(i.title+' ('+rng+')')+'" aria-label="'+esc(i.title+(hi?', 중요':'')+', 기간 '+rng+', '+STAT_KO[i.status]+(late?', 기한 지남 '+ddayTxt(i.due):''))+'">';
      h+='<span class="rt">'+(sg.contL?'◂ ':'')+(hi?'<span class="bang" aria-hidden="true">!</span>':'')+'<span class="rtt">'+esc(i.title)+'</span></span>'+lateTxt+'</button>'+cellCb(i,' cbb'+(sg.contL?' cl':''),';--lane:'+li).replace('data-act="toggle"','data-lane="'+li+'" data-act="toggle"');
    }else h+='<span class="'+cls+'"'+common+' aria-hidden="true">'+lateTxt+'</span>';
  });
  return {h:h+'</div>',n};
}
function preview(list,n){
  const must=list.filter(i=>i.priority==='high'&&i.status!=='done');
  const rest=list.filter(i=>!must.includes(i));
  const shown=must.concat(rest.slice(0,Math.max(0,n-must.length)));
  return {shown,more:list.length-shown.length};
}
function ddayTxt(k){const n=Math.round((P(k)-P(TODAY))/864e5);return n===0?'D-day':n>0?'D-'+n:'D+'+(-n);}
const isLate=i=>needsDone(i)&&i.status!=='done'&&i.due<TODAY;
/* 행 앞의 완료 체크(task, role=checkbox) 또는 일정·참고 표시(event) */
function cbHTML(i){
  if(!needsDone(i))return '<span class="ev" title="일정·참고 · 완료 체크 없음" aria-hidden="true">◇</span>';
  const d=i.status==='done';
  return '<button type="button" class="cb'+(d?' on':'')+'" role="checkbox" aria-checked="'+d+'" data-act="tgl" data-id="'+i.id+'" aria-label="'+esc(i.title)+' 완료">'+(d?'✓':'')+'</button>';
}
const cellCb=(i,extra,st)=>needsDone(i)?'<button type="button" class="cb'+(i.status==='doing'?' mid':'')+(i.tags&&i.tags.length?' w-'+tagW(primaryTag(i)):'')+(extra||'')+'" role="checkbox" aria-checked="'+(i.status==='done'?'true':i.status==='doing'?'mixed':'false')+'" data-act="toggle" data-id="'+i.id+'" aria-label="'+esc(i.title)+' 완료" style="--tc:'+tagColor(primaryTag(i))+(st||'')+'"></button>':'';
const STAT_KO={todo:'할 일',doing:'진행 중',done:'완료'};
const fmtD=k=>{const d=P(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';};

function cellHTML(d,inMonth,compact){
  const k=K(d),info=dayInfo(k),list=itemsOn(k),rg=rangeHTML(d,weekLanes(K(addD(d,-((d.getDay()+6)%7)))));
  const off=info.customs.find(c=>c.off);
  const cls=['cell'];if(k<TODAY&&inMonth)cls.push('past');if(!inMonth)cls.push('out');if(info.hol)cls.push('hol');else if(k===TODAY)cls.push('today');if(k===TODAY)cls.push('tnow');
  const st=off&&!info.hol?' style="background:'+esc(off.color)+'26"':'';
  let h='<div class="'+cls.join(' ')+'" data-act="day" data-day="'+k+'" role="button" tabindex="'+(compact?-1:(k===(ui.fk||(inMonth&&k===TODAY?k:''))?0:-1))+'" aria-label="'+fmtD(k)+(k===TODAY?' 오늘':'')+(info.hol?' '+esc(info.hol):'')+' 항목 '+(list.length+rg.n)+'개"'+(k===TODAY?' aria-current="date"':'')+st+'>';
  h+='<div class="ch"><span class="dnum">'+(d.getDate()===1||(!inMonth&&compact)?(d.getMonth()+1)+'/':'')+d.getDate()+'</span>';
  if(k===TODAY&&!compact)h+='<span class="lab tdy">TODAY</span>';
  if(info.hol)h+='<span class="lab h" title="'+esc(info.hol)+'">'+esc(info.hol)+'</span>';
  info.customs.forEach(c=>{h+='<span class="lab" title="'+esc(c.name)+'" style="color:'+esc(c.color)+';font-weight:700">'+esc(c.name)+'</span>';});
  if(!compact)h+='<button class="add" data-act="add" data-day="'+k+'" aria-label="'+fmtD(k)+'에 추가"><svg class="i" style="width:14px;height:14px"><use href="#i-plus"/></svg></button>';
  h+='</div>';
  h+=rg.h;
  info.notes.forEach(n=>{h+='<div class="note"'+(n.c?' style="color:'+esc(n.c)+'"':n.h?' style="color:var(--hol-fg)"':'')+'>'+esc(n.t)+'</div>';});
  const p=preview(list,compact?2:1e9);
  p.shown.forEach(i=>{
    const late=isLate(i);
    h+='<div class="chipw'+(needsDone(i)?' tk':'')+'">'+cellCb(i)+'<button class="chip'+(i.priority==='high'&&i.status!=='done'?' high':'')+(i.status==='done'?' done':i.status==='doing'?' doing':'')+(late?' overdue':'')+(ui.sel===i.id?' sel':'')+'" data-act="item" data-id="'+i.id+'" title="'+esc(i.title)+'" aria-label="'+esc(i.title+(i.priority==='high'&&i.status!=='done'?', 중요':'')+', '+STAT_KO[i.status]+(late?', 기한 지남 '+ddayTxt(i.due):''))+'">';
    h+=tagDot(i);
    h+='<span class="t">'+(i.priority==='high'&&i.status!=='done'?'<span class="bang" aria-hidden="true">!</span>':'')+esc(i.title)+'</span>';
    if(i.links&&i.links.length)h+='<svg class="i hl" aria-hidden="true"><use href="#i-clip"/></svg>';
    if(late)h+='<span class="late" aria-hidden="true">'+ddayTxt(i.due)+'</span>';
    h+='</button>';
    if(i.links&&i.links.length)h+='<button class="clip" data-act="openlink" data-id="'+i.id+'" aria-label="문서 열기" title="'+esc(i.links[0].name)+(i.links.length>1?' 외 '+(i.links.length-1)+'개':'')+'"><svg class="i"><use href="#i-clip"/></svg></button>';
    h+='</div>';
  });
  if(p.more>0)h+='<button class="more" data-act="day" data-day="'+k+'">+'+p.more+'개 더</button>';
  return h+'</div>';
}

function renderMain(){
  const m=MONTHS[ui.mi];WL={};
  {const td=new Date(TODAY+'T00:00:00'),inM=td.getFullYear()===m.y&&td.getMonth()===m.m,wi=(td.getDay()+6)%7;document.querySelectorAll('.dow span').forEach((e,i)=>e.classList.toggle('now',inM&&i===wi));}
  const _af=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('cell')?document.activeElement.dataset.day:null;
  $('mtitle').textContent=MON_EN[m.m];
  {const tl=S.items.filter(i=>i.due===TODAY),th=tl.filter(i=>i.priority==='high'&&i.status!=='done').length,inR=TODAY>=RMIN&&TODAY<=RMAX;
   $('msub').innerHTML='<span>'+m.y+' · '+(m.m+1)+'월</span>'+(inR?'<button class="tline" data-act="gotoday" aria-label="오늘 칸으로 이동">오늘 · <b>'+esc(fmtD(TODAY))+'</b> · '+tl.length+'건'+(th?' (중요 '+th+')':'')+'</button>':'');}
  const weeks=weeksOf(m.y,m.m);let h='';
  weeks.forEach(w=>w.forEach(d=>{h+=cellHTML(d,d.getMonth()===m.m,false);}));
  $('grid').innerHTML=h;markSel();
  if(_af){const c=$('grid').querySelector('[data-day="'+_af+'"]');if(c){c.tabIndex=0;c.focus({preventScroll:true});}}
  const pre=m.y+'-'+pad(m.m+1);const mon=S.items.filter(i=>i.due.startsWith(pre));
  $('stat').innerHTML='<span><b>'+mon.length+'</b>항목</span><span><b>'+mon.filter(i=>i.priority==='high'&&i.status!=='done').length+'</b>중요</span><span><b>'+mon.filter(i=>i.status==='done').length+'</b>완료</span>'+(()=>{const n=S.items.filter(isLate).length;return n?'<span class="over" title="기한이 지난 미완료 항목 (전체)"><b>'+n+'</b>지연</span>':'';})();
  const ex=S.items.filter(i=>i.ex).length+S.customs.filter(c=>c.ex).length;
  const f=ui.filter,fl=[];if(f.tag)fl.push('#'+f.tag);if(f.who)fl.push('@'+f.who);if(f.mode==='high')fl.push('중요만');if(f.mode==='open')fl.push('미완료만');if(ui.q)fl.push('"'+ui.q+'"');
  let b='';
  if(fl.length)b+='<span class="banner">필터: '+esc(fl.join(' · '))+' <button data-act="clearf">필터 해제</button></span>';
  if(ex)b+='<span class="banner">예시 '+ex+'개 <button data-act="clearex">지우기</button></span>';
  $('msub').insertAdjacentHTML('beforeend',b);
  $('nav-filter').textContent='필터'+(fl.length?' · '+fl.length:'');
  renderRail();renderNext();fitGrid();
}

/* 그리드가 화면 남은 높이를 꽉 채우고(행 높이 동일), 칸 높이만큼만 항목을 보여준다 */
function fitGrid(){
  const g=$('grid');if(!g)return;
  if(innerWidth<=640){g.style.height='';fitChips();return;}
  const top=g.getBoundingClientRect().top+scrollY,qa=document.querySelector('.qa'),rows=Math.round(g.children.length/5)||5;
  g.style.height=Math.max(rows*84,Math.floor(innerHeight-top-(qa?qa.offsetHeight:0)-8))+'px';
  fitChips();
}
function fitChips(){
  const mob=innerWidth<=640,cap=+S.style.previewCap||0;
  const cells=[...$('grid').querySelectorAll('.cell')];
  const setLanes=(c,lim)=>c.querySelectorAll('.rl>[data-lane]').forEach(b=>{b.hidden=+b.dataset.lane>=lim;});
  const fits=c=>c.scrollHeight<=c.clientHeight+1;
  cells.forEach(c=>{const old=c.querySelector('.more');if(old)old.remove();c.querySelectorAll('.chipw').forEach(x=>x.hidden=false);setLanes(c,99);});
  /* 1) 주(행)별로 막대 줄 수를 정한다: 모든 칸에 일반 항목 1개가 더 들어갈 만큼만. 넘치는 막대는 칸별 '+N개 더'로 */
  for(let r=0;r*5<cells.length;r++){
    const row=cells.slice(r*5,r*5+5),maxL=Math.max(0,...row.map(c=>c.querySelectorAll('.rl>.rb').length));
    let lim=maxL;
    if(maxL&&mob)lim=Math.min(maxL,cap||2);
    else if(maxL){
      for(lim=maxL;lim>1;lim--){
        row.forEach(c=>{setLanes(c,lim);c.querySelectorAll('.chipw').forEach((x,i)=>x.hidden=i>=1);});
        if(row.every(fits))break;
      }
      row.forEach(c=>c.querySelectorAll('.chipw').forEach(x=>x.hidden=false));
    }
    row.forEach(c=>setLanes(c,lim));
  }
  /* 2) 칸별로 일반 항목 수를 정한다 */
  cells.forEach(c=>{
    const chips=[...c.querySelectorAll('.chipw')];
    const hidR=[...c.querySelectorAll('.rl>.rb:not(.ph)[hidden]')].length;
    const totR=new Set([...c.querySelectorAll('.rl>.rb:not(.ph)')].map(b=>b.dataset.id)).size;
    const lim=mob?(cap||3):(cap||chips.length);
    let n=Math.min(chips.length,lim);
    const apply=()=>{chips.forEach((x,i)=>x.hidden=i>=n);const o=c.querySelector('.more');if(o)o.remove();
      const hid=chips.length-n+hidR;c.classList.toggle('hasmore',hid>0&&!mob);
      if(hid>0){const b=document.createElement('button');b.className='more';b.dataset.act='day';b.dataset.day=c.dataset.day;b.textContent='+'+hid+'개 더';b.setAttribute('aria-label',fmtD(c.dataset.day)+' 항목 '+(chips.length+totR)+'개 모두 보기');const ch=c.querySelector('.ch');if(ch&&!mob)ch.insertBefore(b,ch.querySelector('.add'));else c.appendChild(b);}};
    apply();
    if(!mob)while(n>1&&!fits(c)){n--;apply();}
  });
}
function todayCell(){return $('grid').querySelector('.cell[data-day="'+TODAY+'"]');}
function focusToday(scroll){
  const i=MONTHS.findIndex(m=>TODAY.startsWith(m.y+'-'+pad(m.m+1)));if(i<0){toast('오늘은 달력 범위 밖');return;}
  if(ui.mi!==i){ui.mi=i;ui.selDay=null;renderMain();}
  const c=todayCell();if(!c)return;
  $('grid').querySelectorAll('.cell[tabindex="0"]').forEach(x=>x.tabIndex=-1);c.tabIndex=0;ui.fk=TODAY;
  c.focus({preventScroll:true});if(scroll!==false)c.scrollIntoView({block:'nearest'});
}
function renderRail(){
  const el=$('rail-months');if(!el)return;
  let h='',ly=0;
  MONTHS.forEach((m,i)=>{
    if(m.y!==ly){h+='<div class="yr eyebrow">'+m.y+'</div>';ly=m.y;}
    h+='<button class="mrow'+(i===ui.mi?' on':'')+'" data-act="gomonth" data-mi="'+i+'">'+(m.m+1)+'월</button>';
  });
  el.innerHTML=h;
}
function renderNext(){
  const el=$('next');if(!el)return;
  const lim=K(addD(P(TODAY),21));

/* 연도 생략: 올해로 보되, 달력 범위(RMIN) 앞이면 내년 (올해 2026 → 1~10월은 2027, 11·12월은 2026) */
function inferY(m,d){const y=+TODAY.slice(0,4);return y+'-'+pad(m)+'-'+pad(d)<RMIN?y+1:y;}
const mkDate=(y,m,d)=>{const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?K(dt):null;};
/* 토큰: 공백으로 둘러싸인 #분류 @담당 !중요도 + 날짜. 분류·담당은 공백에서 끝나므로 여러 단어는 _ 로 잇는다(#본부_제출).
   !: 홀로 있는 ! (또는 !!, !높음 …)는 중요. 글 맨 앞에 붙은 !교육 도 중요(! 는 떼어낸다). 글 중간 '와!' 는 글자 그대로.  날짜는 한 개만(우선순위 sl > full > kor > md > dd > rel) */
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\\/-]/g,'\\$&');
function buildQRE(){
  const c=S.syn,n=c.inn,D=reEsc(c.d),P=reEsc(c.p),kws=a=>a.map(reEsc).join('|');
  const YMD='\\d{4}[-./]\\d{1,2}[-./]\\d{1,2}',MD='\\d{1,2}[-./]\\d{1,2}';
  const QD=n.ymd&&n.md?'(?:\\d{4}[-./])?'+MD:n.ymd?YMD:n.md?MD:null;
  const sl=[];
  if(QD)sl.push(QD+'(?:~(?:'+QD+'|\\d{1,2}))?');
  if(n.rel)sl.push('오늘|내일|모레');
  if(n.wd)sl.push('(?:다음주|이번주)?[월화수목금](?:요일)?');
  const parts=['(?<tag>#[^\\s#@'+P+']+)','(?<who>@[^\\s#@'+P+']+)','(?<hi>'+P+P+'|'+P+'(?:'+kws(c.hi)+')|'+P+')','(?<lo>'+P+'(?:'+kws(c.lo)+'))'];
  if(c.mid.length)parts.push('(?<mid>'+P+'(?:'+kws(c.mid)+'))');
  if(sl.length)parts.push('(?<sl>'+D+'(?:'+sl.join('|')+'))');
  if(n.ymd)parts.push('(?<full>'+YMD+')');
  if(n.kor)parts.push('(?<kor>\\d{1,2}월 ?\\d{1,2}일)');

function qaTipText(){

  return '날짜: '+ex.join(' · ')+(n.rel||n.wd?'\n'+[n.rel&&d+'내일',n.wd&&d+'금 · '+d+'다음주금'].filter(Boolean).join(' · '):'')+(old.length?'\n이전 형식: '+old.join(' · ')+' (달력 버튼)':'')
    +'\n'+p+' 중요 (글 맨 앞이나 띄어서) · '+p+c.lo[0]+'\n#분류  @담당자  (띄어쓰기는 _ : #본부_제출)\n문서: 파일을 줄에 끌어다 놓기 · 경로 붙여넣기\nShift+Enter: 자세히 추가\n\n예) '+p+' '+d+'11-20 주간보고 #본부_제출 @나';

const QDATE=['sl','full','kor','md','dd','rel'];
function scanQuick(text){
  const all=[];
  for(const m of String(text).matchAll(QRE)){const kind=Object.keys(m.groups).find(k=>m.groups[k]!=null);all.push({kind,s:m.index,e:m.index+m[0].length,txt:m[0]});}
  let best=null;all.forEach(t=>{const o=QDATE.indexOf(t.kind);if(o>=0&&(!best||o<QDATE.indexOf(best.kind)))best=t;});
  return all.filter(t=>QDATE.indexOf(t.kind)<0||t===best);
}
/* 날짜 토큰 → {due,start?} 또는 {err}. /11-12~12-25 는 시작~기한. 끝이 시작보다 빠르면 오류(연도를 넘기는 범위는 /12-20~2027-01-05 처럼 연도를 적는다) */
function evalDate(t){
  const x=t.txt,BAD={err:'날짜가 맞지 않아요'};let r;
  if(t.kind==='rel'||(t.kind==='sl'&&/^(오늘|내일|모레)$/.test(x.slice(1)))){const w=t.kind==='rel'?x:x.slice(1);return {due:K(addD(P(TODAY),{오늘:0,내일:1,모레:2}[w]))};}
  if(t.kind==='sl'){/* 요일: 금(오늘 이후 가장 가까운 금) · 이번주금 · 다음주금 */
    const m=/^(다음주|이번주)?([월화수목금])(?:요일)?$/.exec(x.slice(1));
    if(m){const b=P(TODAY),mon=addD(b,-((b.getDay()+6)%7));let d=addD(mon,'월화수목금'.indexOf(m[2]));
      if(m[1]==='다음주')d=addD(d,7);else if(!m[1]&&K(d)<TODAY)d=addD(d,7);return {due:K(d)};}
  }
  if(t.kind==='full'){r=x.split(/[-./]/).map(Number);const k=mkDate(r[0],r[1],r[2]);return k?{due:k}:BAD;}
  if(t.kind==='kor'){r=x.match(/(\d+)월 ?(\d+)일/);const k=mkDate(inferY(+r[1],+r[2]),+r[1],+r[2]);return k?{due:k}:BAD;}
  if(t.kind==='md'){r=x.split(/[/.]/).map(Number);const k=mkDate(inferY(r[0],r[1]),r[0],r[1]);return k?{due:k}:BAD;}
  if(t.kind==='dd'){const m=MONTHS[ui.mi],k=mkDate(m.y,m.m+1,parseInt(x));return k?{due:k}:BAD;}
  const [a,b]=x.slice(1).split('~'),pa=a.split(/[-./]/).map(Number);
  const sy=pa.length===3?pa[0]:inferY(pa[0],pa[1]),sm=pa.length===3?pa[1]:pa[0],sd=pa.length===3?pa[2]:pa[1];
  const s=mkDate(sy,sm,sd);if(!s)return BAD;if(b==null)return {due:s};
  const pb=b.split(/[-./]/).map(Number);let e;
  if(pb.length===1)e=mkDate(sy,sm,pb[0]);else if(pb.length===2)e=mkDate(sy,pb[0],pb[1]);else e=mkDate(pb[0],pb[1],pb[2]);
  if(!e)return BAD;if(e<s)return {err:'끝이 시작보다 빨라요'};

function parseQuick(text,base){

    else if(t.kind==='who'){const v=t.txt.slice(1);if(!who.includes(v))who.push(v);}
    else if(t.kind==='hi'||t.kind==='bang')pr='high';else if(t.kind==='lo')pr='low';else if(t.kind==='mid')pr='normal';
    else{const d=evalDate(t);t.d=d;if(d.err)err=d.err;else{date=d.due;start=d.start||null;}}
  });
  let title='',pos=0;toks.forEach(t=>{title+=text.slice(pos,t.s)+' ';pos=t.e;});title+=text.slice(pos);
  return {title:title.replace(/\s+/g,' ').trim(),date:date||base,start,tags,who:who.length?who:['나'],pr,explicit:!!date,err,toks};
}

/* ---------- wallpaper canvas ---------- */
function lum(hex){const n=parseInt(hex.slice(1),16);return ((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255;}
function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();}

const WPC_FALLBACK=['#a3c47a','#e6c95c','#c3a0e8','#e08fb6','#cdb79a'];
function drawWallpaper(mi){
  const WPC=TAGC.map((v,i)=>{const c=cssVar(v);return /^#[0-9a-f]{6}$/i.test(c)?c:WPC_FALLBACK[i];});
  const o=S.wp,W=Math.max(800,Math.min(7680,+o.w||1920)),H=Math.max(600,Math.min(4320,+o.h||1080));
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const light=lum(o.bg)>=.5,fg=light?'#1d1c1f':'#ffedd7',inv=o.bg;
  const mute=light?'rgba(29,28,31,.66)':'rgba(255,237,215,.66)',line=light?'rgba(29,28,31,.26)':'rgba(255,237,215,.26)';
  x.fillStyle=o.bg;x.fillRect(0,0,W,H);
  const s=Math.min(W/1920,H/1080),F=(z)=>'500 '+Math.round(z*s)+'px '+FONT,sp=v=>{try{x.letterSpacing=v;}catch(e){}};
  let rx,rw;if(o.place==='right'){rx=W*.3;rw=W*.66;}else if(o.place==='center'){rx=W*.16;rw=W*.68;}else{rx=W*.05;rw=W*.9;}
  const m=MONTHS[mi],top=H*.07,bottom=H*.1;
  x.textBaseline='alphabetic';x.fillStyle=fg;x.font=F(92);sp('0px');
  const t1=MON_EN[m.m];x.fillText(t1,rx,top+80*s);const tw=x.measureText(t1).width;
  x.font=F(22);x.fillStyle=mute;x.fillText(m.y+' · '+(m.m+1)+'월',rx+tw+28*s,top+80*s);
  const hy=top+136*s,weeks=weeksOf(m.y,m.m),colW=rw/5;
  x.font=F(13);sp(Math.round(2.6*s)+'px');x.fillStyle=mute;['MON','TUE','WED','THU','FRI'].forEach((d,i)=>x.fillText(d,rx+i*colW+14*s,hy));sp('0px');
  const gTop=hy+16*s,gH=H-bottom-gTop,rowH=gH/weeks.length,lh=26*s,pd=14*s;
  weeks.forEach((w,ri)=>w.forEach((d,ci)=>{
    const info=dayInfo(K(d)),offC=info.customs.find(q=>q.off);
    if(info.hol||offC){x.fillStyle=hexA(info.hol?o.hol:offC.color,.16);x.fillRect(rx+ci*colW,gTop+ri*rowH,colW,rowH);}
  }));
  x.save();x.strokeStyle=line;x.lineWidth=Math.max(1,s);x.setLineDash([5*s,5*s]);
  for(let r=0;r<=weeks.length;r++){const y=gTop+r*rowH;x.beginPath();x.moveTo(rx,y);x.lineTo(rx+rw,y);x.stroke();}
  for(let q=0;q<=5;q++){const xx=rx+q*colW;x.beginPath();x.moveTo(xx,gTop);x.lineTo(xx,gTop+gH);x.stroke();}
  x.strokeStyle=fg;x.globalAlpha=.55;x.lineWidth=Math.max(2,2*s);x.setLineDash([8*s,6*s]);x.strokeRect(rx,gTop,rw,gH);x.globalAlpha=1;
  x.restore();
  WL={};
  const wpLanes=weeks.map(w=>{const L=weekLanes(K(w[0])).map(l=>l.filter(sg=>!(S.style.hideDone&&sg.i.status==='done')&&(o.content!=='none')&&(o.content!=='high'||sg.i.priority==='high')));return L.filter(l=>l.length).slice(0,2);});
  weeks.forEach((w,ri)=>w.forEach((d,ci)=>{
    const k=K(d),cx=rx+ci*colW,cy=gTop+ri*rowH,info=dayInfo(k),inM=d.getMonth()===m.m;
    x.globalAlpha=inM?1:.58;
    x.font=F(24);x.fillStyle=info.hol?o.hol:fg;const dn=(d.getDate()===1?(d.getMonth()+1)+'/':'')+d.getDate();x.fillText(dn,cx+pd,cy+pd+22*s);
    let lx=cx+pd+x.measureText(dn).width+12*s;x.font=F(14);
    const labs=[];if(info.hol)labs.push([info.hol,o.hol]);info.customs.forEach(q=>labs.push([q.name,q.color]));
    labs.forEach(([t,col])=>{const room=cx+colW-pd-lx;if(room<30*s)return;const ft=fit(x,t,room);x.fillStyle=col;x.fillText(ft,lx,cy+pd+20*s);lx+=x.measureText(ft).width+10*s;});
    let y=cy+pd+56*s+wpLanes[ri].length*25*s;
    x.font=F(12);info.notes.forEach(n=>{x.fillStyle=n.c||(n.h?o.hol:mute);x.fillText(fit(x,n.t,colW-2*pd),cx+pd,y);y+=19*s;});
    if(o.content!=='none'){
      let list=S.items.filter(i=>i.due===k&&!isRange(i)&&!(S.style.hideDone&&i.status==='done')).sort(cmp);

      const maxL=Math.max(0,Math.floor((cy+rowH-pd*.4-y+lh*.7)/lh));
      const shown=list.length>maxL?list.slice(0,Math.max(0,maxL-1)):list;
      shown.forEach(i=>{
        const hi=i.priority==='high'&&i.status!=='done';x.font=F(15);
        if(hi){const t='! '+i.title,tx=fit(x,t,colW-2*pd-22*s),w=x.measureText(tx).width+22*s;rr(x,cx+pd,y-18*s,w,27*s,13.5*s);x.fillStyle=fg;x.fill();x.fillStyle=inv;x.fillText(tx,cx+pd+11*s,y+1*s);y+=lh+3*s;}
        else{const dn2=i.status==='done',pre=dn2?'✓ ':(i.status==='doing'?'◐ ':''),off=dn2||pre?0:16*s;if(!pre){x.fillStyle=WPC[tagIdx(i.tags[0])%5];x.beginPath();x.arc(cx+pd+5*s,y-1*s,4.5*s,0,7);x.fill();}const tx=fit(x,pre+i.title,colW-2*pd-off);x.fillStyle=dn2?mute:fg;x.fillText(tx,cx+pd+off,y+4*s);if(dn2){const w=x.measureText(tx).width,w0=x.measureText('✓ ').width;x.fillRect(cx+pd+w0,y-1*s,w-w0,Math.max(1.5,1.5*s));}y+=lh;}
      });
      if(list.length>shown.length){x.font=F(12);x.fillStyle=mute;x.fillText('+'+(list.length-shown.length)+'개 더',cx+pd,y+4*s);}
    }
    x.globalAlpha=1;
  }));
  /* 기간 막대: 주별 lane, 날짜 줄 바로 아래 (최대 2줄) */
  wpLanes.forEach((lanes,ri)=>lanes.forEach((L,li)=>L.forEach(sg=>{
    const i=sg.i,hi=i.priority==='high'&&i.status!=='done',dn=i.status==='done',hh=21*s;
    const bx=rx+sg.c0*colW+(sg.contL?0:6*s),bw=(sg.c1-sg.c0+1)*colW-(sg.contL?0:6*s)-(sg.endsHere?6*s:0),by=gTop+ri*rowH+pd+33*s+li*25*s;
    const col=WPC[tagIdx(i.tags[0])%5];
    x.save();x.globalAlpha=(weeks[ri][sg.c0].getMonth()===m.m)?1:.58;
    rr(x,bx,by,bw,hh,sg.contL&&sg.contR?0:hh/2);
    if(hi){x.fillStyle=fg;x.fill();}else if(dn){x.strokeStyle=mute;x.setLineDash([4*s,3*s]);x.lineWidth=Math.max(1,s);x.stroke();}else{x.fillStyle=col;x.globalAlpha*=.3;x.fill();x.globalAlpha=(weeks[ri][sg.c0].getMonth()===m.m)?1:.58;}
    if(sg.endsHere){x.fillStyle=hi?mute:col;x.fillRect(bx+bw-3*s,by+2*s,3*s,hh-4*s);}
    x.font=F(14);x.fillStyle=hi?inv:dn?mute:fg;const tt=(sg.contL?'◂ ':'')+(hi?'! ':dn?'✓ ':'')+i.title+(sg.contR?' ▸':'');

    if(dn){const w=x.measureText(tx).width;x.fillRect(bx+10*s,by+hh/2,w,Math.max(1.5,1.5*s));}
    x.restore();
  })));
  return c;
}

const VIEW_EXT=['pdf','png','jpg','jpeg','gif','webp','bmp','svg','txt','htm','html','mp4'];
const OFFICE={xlsx:'ms-excel',xls:'ms-excel',xlsm:'ms-excel',xlsb:'ms-excel',csv:'ms-excel',docx:'ms-word',doc:'ms-word',rtf:'ms-word',pptx:'ms-powerpoint',ppt:'ms-powerpoint'};
const isURL=s=>/^https?:\/\//i.test(s||'');
const extOf=n=>{const m=/\.([a-z0-9]+)$/i.exec(n||'');return m?m[1].toLowerCase():'';};
const lastSeg=p=>p.split('\\').filter(Boolean).pop()||p;
function fileURLToPath(u){try{const x=new URL(u);const p=decodeURIComponent(x.pathname);if(x.host)return '\\\\'+x.host+p.replace(/\//g,'\\');const q=p.replace(/^\//,'');return /^[a-zA-Z]:/.test(q)?q.replace(/\//g,'\\'):null;}catch(e){return null;}}
function asLink(raw){
  const s=String(raw).trim().replace(/^"(.*)"$/,'$1').trim();if(!s)return null;
  if(/^[a-zA-Z]:\\/.test(s)||/^\\\\[^\\]+\\/.test(s))return {id:uid(),path:s,name:lastSeg(s)};
  if(/^file:\/\//i.test(s)){const p=fileURLToPath(s);return p?{id:uid(),path:p,name:lastSeg(p)}:null;}
  if(isURL(s)){let n=s;try{const u=new URL(s);n=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname);}catch(e){}return {id:uid(),path:s,name:n};}
  return null;
}
const parseLinks=t=>String(t||'').split(/\r?\n/).filter(l=>!/^\s*#/.test(l)).map(asLink).filter(Boolean);
function toFileURL(p){
  if(p.startsWith('\\\\'))return 'file://'+p.slice(2).split('\\').map(encodeURIComponent).join('/');
  return 'file:///'+p.slice(0,2)+'/'+p.slice(3).split('\\').map(encodeURIComponent).join('/');
}
const parentOf=p=>p.replace(/\\[^\\]*$/,'');
function xb(l){
  const e=isURL(l.path)&&!extOf(l.name)?'url':extOf(l.name||l.path);
  const g=e==='url'?'url':e==='pdf'?'pdf':/^hwpx?$/.test(e)?'hwp':/^(xls|xlsx|xlsm|xlsb|csv)$/.test(e)?'xls':/^(doc|docx|rtf)$/.test(e)?'doc':/^(ppt|pptx)$/.test(e)?'ppt':'';
  return '<span class="xb '+g+'">'+esc(e==='url'?'URL':(e||'파일').toUpperCase().slice(0,4))+'</span>';
}
function copyText(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(fb);else fb();}catch(e){fb();}
}
const quoted=p=>'"'+p+'"';
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('weekday-cal-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return idbP;}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('h',mode);const r=fn(tx.objectStore('h'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);}));}
const putH=(k,h)=>idbDo('readwrite',st=>st.put(h,k));
const getH=k=>idbDo('readonly',st=>st.get(k));
const delH=k=>idbDo('readwrite',st=>st.delete(k)).catch(()=>{});
function openLink(l){
  if(l.path){
    const p=l.path;
    if(isURL(p)){window.open(p,'_blank','noopener');return;}
    const e=extOf(l.name||p);
    if(LOCAL&&VIEW_EXT.includes(e)){window.open(toFileURL(p),'_blank');return;}
    copyText(quoted(p));
    if(LOCAL&&OFFICE[e]){const a=document.createElement('a');a.href=OFFICE[e]+':ofe|u|'+toFileURL(p);document.body.appendChild(a);a.click();a.remove();toast('오피스로 여는 중 · 경로도 복사됨');return;}
    toast((LOCAL?'경로 복사됨 · Win+R에 붙여넣기':'미리보기라 경로만 복사됨'));
    return;
  }
  if(l.h){openHandle(l);return;}
  toast('경로 없음 · Ctrl+Shift+C로 복사해 붙여넣기');
}
async function openHandle(l){
  try{
    const h=await getH(l.id);if(!h)throw 0;
    let st=await h.queryPermission({mode:'read'});if(st!=='granted')st=await h.requestPermission({mode:'read'});
    if(st!=='granted'){toast('파일을 읽을 권한이 필요해요');return;}
    const f=await h.getFile(),e=extOf(f.name);
    if(VIEW_EXT.includes(e)){const u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),120000);}
    else toast((e?e.toUpperCase():'이 형식')+'은 경로가 있어야 열려요');
  }catch(e){toast('파일 없음 · 옮겨졌을 수 있어요');}
}
function attachLinks(it,links){
  it.links=it.links||[];
  links.forEach(l=>{const m=l.path&&!isURL(l.path)&&it.links.find(x=>!x.path&&x.name===l.name);if(m)m.path=l.path;else it.links.push(l);});
  delete it.ex;
}
function placeLinks(links,k){
  const sh=weekdayShift(k);
  if(sh.k<RMIN||sh.k>RMAX){toast('범위 밖 날짜 ('+RLAB+')');return;}
  let att=0;const made=[];
  links.forEach(l=>{
    const it=l.path&&S.items.find(i=>i.due===sh.k&&(i.links||[]).some(x=>!x.path&&x.name===l.name));
    if(it){attachLinks(it,[l]);att++;return;}
    const ni={id:uid(),title:(l.name||'문서').replace(/\.[a-z0-9]{1,6}$/i,''),due:sh.k,start:'',status:'todo',priority:'normal',assignees:['나'],tags:[],memo:'',checklist:[],links:[l]};
    S.items.push(ni);made.push(ni);
  });
  save();
  const idx=MONTHS.findIndex(m=>sh.k.startsWith(m.y+'-'+pad(m.m+1)));if(idx>=0&&!ui.modal)ui.mi=idx;
  renderAll();
  if(ui.modal==='day'||ui.modal==='full'){const b=$('fullb'),top=b?b.scrollTop:0;renderModal();if(b)setTimeout(()=>{const nb=$('fullb');if(nb)nb.scrollTop=top;},40);}
  const parts=[];if(made.length)parts.push(fmtD(sh.k)+'에 문서 '+made.length+'개 추가');if(att)parts.push('경로 '+att+'개 연결');if(sh.moved)parts.push(sh.moved);
  toast(parts.join(' · ')||'추가할 문서가 없어요');
}
function linksToItem(id,links){const it=S.items.find(i=>i.id===id);if(!it)return;attachLinks(it,links);save();renderAll();toast('문서 '+links.length+'개를 연결했어요');}
function handleDrop(e,k,itemId,cb){
  const deliver=ls=>itemId?linksToItem(itemId,ls):cb?cb(ls):placeLinks(ls,k);
  const dt=e.dataTransfer;if(!dt)return;
  const files=Array.from(dt.items||[]).filter(i=>i.kind==='file');
  if(files.length){
    const parts=files.map(i=>{let hp=Promise.resolve(null);try{if(i.getAsFileSystemHandle)hp=i.getAsFileSystemHandle().catch(()=>null);}catch(err){}return {f:i.getAsFile(),hp};});
    Promise.all(parts.map(x=>x.hp)).then(async hs=>{
      const links=parts.map((x,j)=>({id:uid(),name:x.f?x.f.name:((hs[j]&&hs[j].name)||'문서'),path:'',h:!!(hs[j]&&hs[j].kind==='file')}));
      await Promise.all(links.map((l,j)=>l.h?putH(l.id,hs[j]).catch(()=>{l.h=false;}):null));
      deliver(links);
      if(!cb&&links.some(l=>!(l.h&&VIEW_EXT.includes(extOf(l.name)))))setTimeout(()=>toast('원본은 경로 필요 · Ctrl+Shift+C → 같은 칸에 Ctrl+V'),2800);
    });
    return;
  }
  const links=parseLinks(dt.getData('text/uri-list')||dt.getData('text/plain'));
  if(!links.length){toast('파일이나 링크만 놓을 수 있어요');return;}
  deliver(links);
}

/* ---------- 항목 작성 팝업 (compose) ----------
   열기: 빠른 추가 줄에 파일 끌어놓기 / 줄의 ⤢ 버튼 / #qa 에서 Shift+Enter (입력 중인 글은 필드로 파싱해 가져감)
   저장: 제목에서 Enter 또는 어디서든 Ctrl+Enter · 닫기: Esc/취소 (줄의 글은 그대로 남음)
   여러 파일: 기본은 파일 전부를 링크로 가진 항목 1개, 2개 이상이면 [파일별로] 버튼으로 파일마다 1개씩 */
const baseName=n=>String(n||'문서').replace(/\.[a-z0-9]{1,6}$/i,'')||'문서';
/* 항목 작성 팝업 열기 (안정된 진입점): openComposer({title,start,due,tags,who,pr,kind,memo,links,text,fromQA})
   text 가 있으면 빠른 추가 문법으로 파싱해 채우고, 나머지 값이 있으면 그것이 우선한다. 값이 없는 칸은 기본값 */
function openComposer(o){
  o=o||{};
  const base=defaultDay(),p=o.text&&o.text.trim()?parseQuick(o.text,base):null,links=o.links||[];
  let title=o.title!=null?o.title:p?p.title:'';
  if(!title&&links.length)title=baseName(links[0].name)+(links.length>1?' 외 '+(links.length-1)+'개':'');
  let due=o.due||(p?p.date:base),start=o.start!=null?o.start:(p&&p.start||'');
  if(start&&start>due){const x=start;start=due;due=x;}if(start===due)start='';
  const vm=MONTHS.findIndex(m=>due.startsWith(m.y+'-'+pad(m.m+1)));
  ui.cmp={title,due,start,tags:(o.tags||(p?p.tags:[])).slice(),who:(o.who||(p?p.who:['나'])).slice(),pr:o.pr||(p?p.pr:'normal'),kind:o.kind==='task'||o.kind==='event'?o.kind:'',memo:o.memo||'',links:links.slice(),fromQA:!!o.fromQA,err:p&&p.err||'',vm:vm>=0?vm:ui.mi,anchor:null,kbA:null,fk:due};
  const a=document.activeElement;
  openModal('compose');
  if(!a||a===document.body||!document.contains(a))ui.opener=$('qa');
  const t=$('cp-title');if(t){t.focus();t.select();}
}
const openCompose=openComposer;
window.openComposer=openComposer;
/* ---- 기간 고르기 (작성 팝업 안의 월 달력, 월–금) ----
   끌어서 기간 · 클릭=하루 · Shift+클릭=늘리기 · 방향키 이동 · Space/Enter로 시작→끝 · Shift+방향키로 늘리기 */
function cpPickHTML(){
  const c=ui.cmp,m=MONTHS[c.vm],a=c.start&&c.start<c.due?c.start:'',b=c.due;
  let h='<div class="mc-h"><button type="button" class="ib sm" data-act="cpvm" data-v="-1" aria-label="이전 달"'+(c.vm<=0?' disabled':'')+'><svg class="i"><use href="#i-l"/></svg></button><b>'+m.y+'년 '+(m.m+1)+'월</b><button type="button" class="ib sm" data-act="cpvm" data-v="1" aria-label="다음 달"'+(c.vm>=MONTHS.length-1?' disabled':'')+'><svg class="i"><use href="#i-r"/></svg></button><span class="meta">끌어서 기간 · Shift+클릭 늘리기</span></div>';
  h+='<div class="mc-w" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div><div class="mc-g" role="group" aria-label="기간 고르기">';
  const fk=c.fk&&MONTHS[c.vm]&&c.fk.startsWith(m.y+'-'+pad(m.m+1))?c.fk:K(weeksOf(m.y,m.m)[0].find(d=>d.getMonth()===m.m));
  weeksOf(m.y,m.m).forEach(w=>w.forEach(d=>{
    const k=K(d),cls=['mc-d'];
    if(d.getMonth()!==m.m)cls.push('o');if(k===TODAY)cls.push('t');
    if(a&&k>=a&&k<=b)cls.push('in');if(k===b)cls.push('e');if(a&&k===b)cls.push('rg');if(a&&k===a)cls.push('s');
    h+='<button type="button" class="'+cls.join(' ')+'" data-d="'+k+'" tabindex="'+(k===fk?0:-1)+'"'+(k<RMIN||k>RMAX?' disabled':'')+' aria-pressed="'+(!!a&&k>=a&&k<=b||k===b)+'" aria-label="'+fmtD(k)+(k===a?' 시작':k===b?(a?' 끝':' 기한'):'')+'">'+d.getDate()+'</button>';
  }));
  return h+'</div>';
}
function cpPickRefresh(focus){const e=$('cp-pick');if(!e||!ui.cmp)return;e.innerHTML=cpPickHTML();if(focus){const n=e.querySelector('[data-d="'+ui.cmp.fk+'"]');if(n)n.focus({preventScroll:true});}}
function cpSet(a,b){
  const c=ui.cmp,s=a<b?a:b,e=a<b?b:a;c.start=s===e?'':s;c.due=e;
  const vm=MONTHS.findIndex(m=>e.startsWith(m.y+'-'+pad(m.m+1)));
  const st=$('cp-start'),du=$('cp-due');if(st)st.value=c.start;if(du)du.value=c.due;cpWarn();
}
const mcStep=(k,dx)=>{let d=P(k);if(Math.abs(dx)===7)d=addD(d,dx);else{d=addD(d,dx);while(d.getDay()===0||d.getDay()===6)d=addD(d,dx);}return K(d);};
function mcGo(k,ext){
  const c=ui.cmp;if(k<RMIN||k>RMAX)return;
  const vm=MONTHS.findIndex(m=>k.startsWith(m.y+'-'+pad(m.m+1)));if(vm>=0)c.vm=vm;
  c.fk=k;
  if(ext){if(!c.anchor)c.anchor=c.start||c.due;cpSet(c.anchor,k);}else if(c.kbA)cpSet(c.kbA,k);
  cpPickRefresh(true);
}
function mcKey(e){
  const c=ui.cmp,k=e.target.dataset.d;
  const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
  if(mv){e.preventDefault();mcGo(mcStep(k,mv),e.shiftKey);return true;}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();
    if(!c.kbA){c.kbA=k;c.anchor=k;c.fk=k;cpSet(k,k);}else{cpSet(c.kbA,k);c.kbA=null;}
    cpPickRefresh(true);return true;}
  if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();c.vm=Math.max(0,Math.min(MONTHS.length-1,c.vm+(e.key==='PageUp'?-1:1)));c.fk=null;cpPickRefresh();const n=$('cp-pick').querySelector('.mc-d:not(.o):not(:disabled)');if(n){c.fk=n.dataset.d;cpPickRefresh(true);}return true;}
  return false;
}
/* 바깥(스크림) 클릭으로만 닫기: 안에서 끌다가 밖에서 놓아도 닫히지 않게 누른 곳도 확인 */
document.addEventListener('pointerdown',e=>{ui.ovDown=e.target===$('ov');},true);
document.addEventListener('pointerdown',e=>{
  const d=e.target.closest&&e.target.closest('.mc-d');if(!d||d.disabled||!ui.cmp)return;
  e.preventDefault();const c=ui.cmp,k=d.dataset.d;c.kbA=null;
  if(e.shiftKey&&(c.start||c.due)){if(!c.anchor)c.anchor=c.start||c.due;cpSet(c.anchor,k);}
  else{c.anchor=k;cpSet(k,k);ui.mcDrag=true;}
  c.fk=k;cpPickRefresh(true);
});
document.addEventListener('pointermove',e=>{
  if(!ui.mcDrag||!ui.cmp)return;
  const el=document.elementFromPoint(e.clientX,e.clientY),d=el&&el.closest&&el.closest('.mc-d');
  if(!d||d.disabled||d.dataset.d===ui.cmp.fk)return;
  ui.cmp.fk=d.dataset.d;cpSet(ui.cmp.anchor,d.dataset.d);cpPickRefresh();
});
const mcEnd=()=>{if(ui.mcDrag){ui.mcDrag=false;if(ui.cmp)cpPickRefresh(true);}};
document.addEventListener('pointerup',mcEnd);document.addEventListener('pointercancel',mcEnd);
function cpKindSeg(){const c=ui.cmp,cur=c.kind||'',auto=needsDone({kind:'',tags:c.tags});return [['','자동 · '+(auto?'필요':'일정')],['task','완료 체크 필요'],['event','일정 · 참고']].map(([v,l])=>'<button type="button" data-act="cpkind" data-v="'+v+'" class="'+(cur===v?'on':'')+'" aria-pressed="'+(cur===v)+'">'+l+'</button>').join('');}
function cpSeg(cur){return [['low','낮음'],['normal','보통'],['high','높음','ph']].map(([v,l,c])=>'<button type="button" data-act="cppr" data-v="'+v+'" class="'+(cur===v?'on':'')+(c?' '+c:'')+'" aria-pressed="'+(cur===v)+'">'+l+'</button>').join('');}
/* ---- 칩 편집기 (작성 팝업 cp · 상세 패널 d 가 같이 쓴다) ----
   칩 + 입력칸 + 제안. 칸에서 공백은 _ 로 바뀌고(분류·담당자는 공백이 없다), Enter·쉼표는 칩으로 확정, 빈 칸 Backspace는 마지막 칩 삭제 */
function edGet(p,k){
  if(p==='cp')return ui.cmp?ui.cmp[k]:[];
  const it=S.items.find(i=>i.id===ui.sel);return it?(k==='tags'?it.tags:it.assignees):[];
}
function edChips(p,k){
  const isT=k==='tags',pre=isT?'#':'@';
  return edGet(p,k).map(v=>{const x=isT?tagStyle(v):null;
    return '<span class="tk hc '+(isT?x.cls:whoCls(v))+'"'+(isT?' style="'+x.st+'"'+x.ttl:'')+'>'+esc(pre+v)+'<button type="button" class="cx" data-act="edrm" data-p="'+p+'" data-k="'+k+'" data-v="'+esc(v)+'" aria-label="'+esc(pre+v)+' 빼기"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></span>';}).join('');
}
function edSug(p,k){
  const isT=k==='tags',cur=edGet(p,k),cnt={};
  S.items.forEach(i=>(isT?i.tags:i.assignees).forEach(v=>{cnt[v]=(cnt[v]||0)+1;}));
  if(!isT&&!(('나') in cnt))cnt['나']=0;
  return Object.keys(cnt).filter(v=>!cur.includes(v)).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b,'ko')).slice(0,8)
    .map(v=>{const x=isT?tagStyle(v):null;return '<button type="button" class="tk hc sg '+(isT?x.cls:whoCls(v))+'" data-act="edadd" data-p="'+p+'" data-k="'+k+'" data-v="'+esc(v)+'"'+(isT?' style="'+x.st+'"'+x.ttl:'')+' aria-label="'+esc((isT?'#':'@')+v)+' 넣기">'+esc((isT?'#':'@')+v)+'</button>';}).join('');
}
function edHTML(p,k){
  const isT=k==='tags',lab=isT?'분류':'담당자';
  return '<div class="cp-chips" id="'+p+'-'+k+'"><span id="'+p+'-'+k+'-c" style="display:contents">'+edChips(p,k)+'</span><input id="'+p+'-'+k+'-i" placeholder="'+lab+'" aria-label="'+lab+' 추가" autocomplete="off" spellcheck="false" data-ed="'+p+'" data-k="'+k+'"></div><div class="cp-sug" id="'+p+'-'+k+'-s">'+edSug(p,k)+'</div>';
}
function edRefresh(p,k){
  const c=$(p+'-'+k+'-c'),sg=$(p+'-'+k+'-s');if(c)c.innerHTML=edChips(p,k);if(p==='cp'&&k==='tags'&&$('cp-kind')&&ui.cmp)$('cp-kind').innerHTML=cpKindSeg();if(sg)sg.innerHTML=edSug(p,k);
  if(p==='d'){const it=S.items.find(i=>i.id===ui.sel);if(it){delete it.ex;save();soon();}}
}
const normTok=v=>String(v).replace(/^[#@\s]+/,'').replace(/\s+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
function edAdd(p,k,raw){
  const arr=edGet(p,k);let n=0;
  String(raw||'').split(/,|\s+(?=[#@])/).map(normTok).filter(Boolean).forEach(v=>{if(!arr.includes(v)){arr.push(v);n++;}});
  if(n)edRefresh(p,k);return n;
}
function edRm(p,k,v){const a=edGet(p,k),i=a.indexOf(v);if(i>=0){a.splice(i,1);edRefresh(p,k);}}
/* 입력 중 정리: 공백→_ (글자 수 그대로라 캐럿 유지), 맨 앞·연속 _ 제거, 쉼표가 들어오면 그때까지를 확정 */
function edSan(t){
  const v=t.value,c=t.selectionStart;
  if(v.includes(',')){t.value='';edAdd(t.dataset.ed,t.dataset.k,v);return;}
  let out='',nc=c;
  for(let i=0;i<v.length;i++){const ch=/\s/.test(v[i])?'_':v[i];if(ch==='_'&&(out===''||out.endsWith('_'))){if(i<c)nc--;continue;}out+=ch;}
  if(out!==v){t.value=out;try{t.setSelectionRange(nc,nc);}catch(e){}}
}
function edKey(e){
  const t=e.target,p=t.dataset&&t.dataset.ed;if(!p||e.isComposing)return false;
  const k=t.dataset.k;
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))return false;
  if(e.key==='Enter'||e.key===','){e.preventDefault();if(t.value.trim())edAdd(p,k,t.value);t.value='';return true;}

const SC=new Map();
const holOn=k=>HOL[k]&&!A.disabledHol.includes(k)?HOL[k]:null;
const kindOf=o=>A.kinds.find(x=>x.id===o.kind)||{id:'?',name:'기타',noClass:false,color:KC[4]};
const fixKind=f=>A.kinds.find(x=>x.id===f.kind)||defKinds().find(x=>x.id===f.kind)||{id:'?',name:'기타',noClass:true,color:KC[4]};

/* 그날(k) 그 직종(tid)의 수업 교시. tid='' 은 "전체" — 모든 직종 공통 특이사항만 적용 */
function sched(k,tid){
  const key=k+'|'+(tid||'');let r=SC.get(key);if(r)return r;
  r={ps:[],labs:[],why:'',hol:null,wk:isWk(k)};
  if(!r.wk){
    r.hol=holOn(k);
    if(r.hol)r.why=r.hol;
    else{
      let ps=PS.slice();
      A.offs.forEach(o=>{
        if(o.from<=k&&k<=(o.to||o.from)&&(!o.track||o.track===tid)){
          const kd=kindOf(o);r.labs.push({o,kd});
          if(kd.noClass){if(!o.periods||!o.periods.length){ps=[];if(!r.why)r.why=o.name||kd.name;}else ps=ps.filter(p=>!o.periods.includes(p));}
        }
      });
      FIX.forEach(f=>{if(f.from<=k&&k<=f.to&&f.on){r.labs.push({o:{id:f.id,from:f.from,to:f.to,kind:f.kind,name:f.name,track:'',periods:[],fx:1},kd:fixKind(f)});ps=[];if(!r.why)r.why=f.name;}});
      r.ps=ps;
    }
  }
  SC.set(key,r);return r;
}
const enrolled=(s,k)=>(!s.admit||s.admit<=k)&&(!s.complete||k<=s.complete);
const isDorm=(s,k)=>s.dorm?k>=s.dorm:s.commute==='N';

/* 하루 출결 판정: 50% 미만 출석이면 지각·조퇴·결과도 결석 */
function evalDay(s,k){
  if(!enrolled(s,k))return null;
  const sc=sched(k,s.track),n=sc.ps.length;if(!n)return null;
  const r=A.att[k+'|'+s.id];
  if(!r||!r.s||r.s==='출석')return {st:'출석',n,miss:0,abs:false,conv:false,p:[],m:r&&r.m||''};
  if(ABS.includes(r.s))return {st:r.s,n,miss:n,abs:true,conv:false,p:sc.ps.slice(),m:r.m||''};
  const p=(r.p||[]).filter(x=>sc.ps.includes(x));const miss=Math.min(n,Math.max(1,p.length));
  const conv=(n-miss)*2<n;
  return {st:r.s,n,miss,abs:conv,conv,p,m:r.m||''};
}
function weekdays(a,b){const out=[];let d=P(a);const e=P(b);while(d<=e){const w=d.getDay();if(w&&w<6)out.push(K(d));d=addD(d,1);}return out;}
const monthRange=m=>[ymOf(m)+'-01',K(new Date(m.y,m.m+1,0))];
/* 학생 통계: 지각·조퇴·결과 3회 = 결석 1일 (달마다 따로 환산) */
function statStu(s,a,b){
  const o={sd:0,sp:0,ap:0,yu:0,mu:0,ji:0,jo:0,gy:0,conv:0,hw:0,abs:0,att:0,dd:0,cd:0,rate:null,en:false};const mp={};
  weekdays(a,b).forEach(k=>{
    if(enrolled(s,k))o.en=true;
    const e=evalDay(s,k);if(!e)return;o.sd++;o.sp+=e.n;
    if(e.st==='유고결석')o.yu++;else if(e.st==='무단결석')o.mu++;
    else if(e.conv)o.conv++;
    else if(e.st!=='출석'){o[{지각:'ji',조퇴:'jo',결과:'gy'}[e.st]]++;const m=k.slice(0,7);(mp[m]=mp[m]||[]).push(isDorm(s,k));}
    if(!e.abs){o.ap+=e.n-e.miss;if(isDorm(s,k))o.dd++;else o.cd++;}
  });
  /* 환산결석 n일 = 그 달 마지막 지각·조퇴·결과 n일을 출석일에서 뺌 (그날의 통학·기숙 기준) */
  Object.values(mp).forEach(days=>{const n=Math.floor(days.length/3);o.hw+=n;days.slice(days.length-n).forEach(d=>{if(d)o.dd--;else o.cd--;});});
  o.abs=o.yu+o.mu+o.conv+o.hw;o.att=Math.max(0,o.sd-o.abs);o.rate=o.sd?o.att/o.sd:null;
  return o;
}
const SUMK=['sd','sp','ap','yu','mu','ji','jo','gy','conv','hw','abs','att','dd','cd'];
function sumStats(list){const o={};SUMK.forEach(k=>o[k]=0);list.forEach(x=>SUMK.forEach(k=>o[k]+=x[k]));o.rate=o.sd?o.att/o.sd:null;return o;}
/* 외부강사 시수 (교시 = 1시수, 수업 있는 교시만) */
function lectHours(a,b){
  const out={};/* out[lid][ym][tid]=n */
  Object.keys(A.lect).forEach(key=>{
    const [k,tid]=key.split('|');if(k<a||k>b||isWk(k))return;
    const arr=A.lect[key]||[],sc=sched(k,tid);
    arr.forEach((lid,i)=>{if(!lid||!sc.ps.includes(i+1))return;const ym=k.slice(0,7);((out[lid]=out[lid]||{})[ym]=out[lid][ym]||{})[tid]=(out[lid][ym][tid]||0)+1;});
  });
  return out;
}
function lectRuns(k,tid){/* 같은 강사가 이어진 교시를 묶어 [{lid,a,b}] */
  const arr=A.lect[k+'|'+tid]||[],sc=sched(k,tid),runs=[];
  PS.forEach(p=>{const l=sc.ps.includes(p)?arr[p-1]:'';const last=runs[runs.length-1];if(l&&last&&last.lid===l&&last.b===p-1)last.b=p;else if(l)runs.push({lid:l,a:p,b:p});});
  return runs;
}
/* 특별 수업: 같은 과목이 이어진 교시를 묶어 [{lid(=과목 id),a,b}] (수업 있는 교시만) */
function specRuns(k,tid){

  PS.forEach(p=>{const l=sc.ps.includes(p)?arr[p-1]:'';const last=runs[runs.length-1];if(l&&last&&last.lid===l&&last.b===p-1)last.b=p;else if(l)runs.push({lid:l,a:p,b:p});});
  return runs;
}
/* 특별 수업 시수 (교시 = 1시수, 수업 있는 교시만): out[sid][ym][tid]=n */

function hoursTable(fi,ti,tid){

function normDate(v){
  v=String(v||'').trim();if(!v)return '';let m;
  if((m=v.match(/^(\d{4})[-.\/년 ]+\s*(\d{1,2})[-.\/월 ]+\s*(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=v.match(/^(\d{4})(\d{2})(\d{2})$/)))return m[1]+'-'+m[2]+'-'+m[3];
  if((m=v.match(/^(\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/)))return '20'+m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(/^\d{5}$/.test(v)){const d=new Date(Date.UTC(1899,11,30)+(+v)*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
  return null;
}
const yn=(v,def)=>{v=String(v||'').trim().toUpperCase();if(!v)return def;return /^(Y|YES|O|예|네|1|TRUE|참여|해당|통학)$/.test(v)?'Y':/^(N|NO|X|아니오|아니요|0|FALSE|미참여|비해당|기숙)$/.test(v)?'N':def;};
function pasteImport(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()?l.split(l.includes('\t')?'\t':','):null).filter(Boolean);
  if(lines.length&&/이름|성명/.test(lines[0][0]))lines.shift();
  let n=0;const bad=[];
  lines.forEach((c,i)=>{
    const name=(c[0]||'').trim();if(!name)return;
    const tn=(c[1]||'').trim()||'(미지정)';let t=A.tracks.find(x=>x.name===tn);if(!t){t={id:uid(),name:tn};A.tracks.push(t);}
    const admit=normDate(c[2]),complete=normDate(c[3]),dorm=normDate(c[5]);
    if(admit===null||complete===null||dorm===null){bad.push(i+1);return;}
    A.students.push({id:uid(),name,track:t.id,admit:admit||'',complete:complete||'',commute:yn(c[4],'Y'),dorm:dorm||'',cnp:yn(c[6],'N'),no:(c[7]||'').trim(),memo:(c[8]||'').trim()});n++;
  });
  return {n,bad};
}
