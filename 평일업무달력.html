<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>평일 업무 달력</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: full-bleed warm-dark editorial page. Top nav (4 items) / hero month title + controls / dashed-line weekday grid / "next up" list. Filters and item detail slide in as drawers; no permanent sidebar. */
:root{
  color-scheme:dark;
  --bg:#100904; --fg:#ffedd7; --surface:#382416; --ember:#dc5000;
  --line:color-mix(in srgb,var(--fg) 26%,var(--bg));
  --strong:color-mix(in srgb,var(--fg) 58%,var(--bg));
  --faint:color-mix(in srgb,var(--fg) 52%,var(--bg));
  --hover:#241710;
  --c1:#a3c47a; --c2:#e6c95c; --c3:#c3a0e8; --c4:#e08fb6; --c0:#cdb79a; --over:#f0661a;
  --muted:color-mix(in srgb,var(--fg) 66%,var(--bg));
  --hol-bg:#2c1304; --hol-fg:#f0661a; --today-bg:#2a1a0c;
  --high-bg:var(--fg); --high-fg:var(--bg);
  --win:var(--bg); --chip:var(--surface); --chip-h:color-mix(in srgb,var(--surface) 78%,var(--fg)); --out:color-mix(in srgb,var(--surface) 30%,var(--bg));
  --accent:var(--fg); --accent-soft:var(--surface); --warn:var(--ember); --ok:var(--fg);
  --fs:14px;
  --font:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:Consolas,"D2Coding",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 var(--fs)/1.5 var(--font);padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px dashed var(--fg);outline-offset:3px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
input[type=checkbox]{accent-color:var(--fg)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow span{color:var(--faint);margin-left:8px}

.app{position:relative;min-height:100vh;display:grid;grid-template-columns:176px minmax(0,1fr);column-gap:52px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start;display:flex;flex-direction:column;padding:30px 28px 30px 0;border-right:2px dashed var(--strong);overflow-y:auto}
.brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;line-height:1.5}
.rail .yr{margin:34px 0 8px}
.mrow{display:block;width:100%;text-align:left;padding:7px 0;font-size:15px;color:var(--muted)}
.mrow:hover{color:var(--fg)}
.mrow.on{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:7px}
.tools{margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:2px}
.tool{text-align:left;padding:7px 0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.tool:hover{color:var(--fg)}
.app.side-open #nav-filter{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:6px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
@media (max-height:900px){.hero{padding:22px 0 18px!important}.mtitle{font-size:clamp(40px,5vw,68px)!important}.grid{grid-auto-rows:minmax(120px,auto)!important}}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;padding:38px 0 32px}
.mtitle{font-size:clamp(46px,7.4vw,96px);line-height:.9;font-weight:500;margin:14px 0 0;letter-spacing:0;text-transform:uppercase}
.msub{font-size:18px;color:var(--muted);margin-top:14px}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:18px;min-width:0}
.stat{display:flex;gap:26px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.stat b{font-weight:500;font-size:26px;color:var(--fg);margin-right:6px;font-variant-numeric:tabular-nums;letter-spacing:0}
.ctrl{display:flex;gap:10px}
.ghost{border:1px solid var(--fg);border-radius:22.5px;padding:8px 20px;font-size:12px;letter-spacing:.1em;display:inline-flex;align-items:center;gap:8px;min-height:36px}
.ghost:hover{background:var(--surface)}
.search input{border:0;border-bottom:1px solid var(--fg);border-radius:0;background:transparent;padding:6px 2px;width:min(240px,60vw);font-size:14px;outline:0}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:1px dashed var(--fg);outline-offset:3px}
.banner{border:1px dashed var(--faint);border-radius:12px;padding:12px 18px;margin:0 0 18px;font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.banner button{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}

.gw{padding-bottom:8px}
.dow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0 0 10px;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.dow span{padding-left:14px}
.dow small{margin-left:8px;font-size:11px;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:2px dashed var(--strong);grid-auto-rows:minmax(152px,auto)}
.cell:nth-child(-n+5){border-top:0}.cell:nth-child(5n+1){border-left:0}
.cell{border-top:1px dashed var(--line);border-left:1px dashed var(--line);padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;min-width:0;cursor:pointer;position:relative}
.cell:hover{background:var(--hover);outline:1px dashed var(--strong);outline-offset:-5px}
.cell.tnow:hover{background:var(--today-bg)}
.cell:focus-visible{outline:2px dashed var(--fg);outline-offset:-6px}
@media (prefers-reduced-motion:no-preference){.cell>*{transition:transform .14s ease}.cell:hover>*,.cell:focus-visible>*{transform:translateY(-2px)}.add{transition:opacity .12s}}
.cell.past .dnum{color:var(--strong)}.cell.past .chip{opacity:.78}
.dow span.now{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:6px}
.cell.out .dnum{color:var(--strong)}
.cell.out .chip,.cell.out .more{color:var(--muted)}
.cell.today{background:var(--today-bg);outline:2px dashed var(--fg);outline-offset:-5px}
.cell.hol{background:var(--hol-bg)}
.ch{display:flex;align-items:center;gap:10px;min-height:28px}
.dnum{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.cell.tnow .dnum{background:transparent;color:var(--fg);border:2px solid var(--fg);font-weight:700;border-radius:999px;padding:4px 10px;margin-left:-11px}
.lab.tdy{font-size:11px;letter-spacing:.16em;color:var(--fg);font-weight:700}
.cell.hol .dnum{color:var(--hol-fg)}
.lab{font-size:12px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--muted)}
.lab.h{color:var(--hol-fg)}
.add{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.add:hover{border-color:var(--fg);color:var(--fg)}
@media (hover:hover){.add{opacity:0}.cell:hover .add,.add:focus-visible{opacity:1}}
.note{font-size:11px;letter-spacing:.04em;color:var(--muted)}
.chipw{display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:flex;align-items:center;gap:9px;text-align:left;flex:1;min-width:0;padding:3px 0;font-size:var(--fs);color:var(--fg)}
.chip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .tg{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chip.high .tg{border:2px solid var(--high-fg);width:11px;height:11px;margin-left:-4px}
.chip.doing .t::before{content:'◐';margin-right:7px;color:var(--fg)}
.chip:hover .t{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.chip.high{background:var(--high-bg);color:var(--high-fg);border-radius:999px;padding:5px 13px;flex:0 1 auto;max-width:100%}
.chip.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--strong);color:var(--muted)}
.chip.done .t::before,.drow.done .t::before{content:'✓';display:inline-block;margin-right:7px;text-decoration:none;color:var(--fg)}
.chip.sel{outline:1px dashed var(--fg);outline-offset:4px}
.more{font-size:12px;letter-spacing:.04em;color:var(--muted);text-align:left;padding:2px 0}
.more:hover{color:var(--fg);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.clip{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.clip:hover{border-color:var(--fg);color:var(--fg)}
.clip svg.i{width:13px;height:13px}
.cell.drop,.db.drop,.mb.drop{outline:1px dashed var(--fg);outline-offset:-6px;background:var(--surface)}

.next{margin-top:48px;padding:34px 0 36px;border-top:2px dashed var(--strong)}
.nrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto 72px;gap:18px;align-items:center;width:100%;text-align:left;padding:17px 0;border-bottom:1px dashed var(--line);font-size:15px}
.next .eyebrow+.nrow{border-top:1px dashed var(--line);margin-top:18px}
.nrow:hover{background:var(--out)}
.nd{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt em{font-style:normal;background:var(--high-bg);color:var(--high-fg);border-radius:999px;padding:1px 9px;margin-right:8px;font-size:12px}
.ng{color:var(--muted);font-size:12px;white-space:nowrap}
.ndd{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.06em}
.qa{position:sticky;bottom:0;z-index:12;background:var(--bg);border-top:2px dashed var(--strong);padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.qa-box{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--fg);padding:2px 2px 6px}
.qa-box input{flex:1;border:0;outline:0;background:transparent;min-width:0;font-size:16px;padding:4px 0}
.qa-box input::placeholder{color:var(--muted)}
.qa-hint{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px;letter-spacing:.02em}
.qa-hint.err{color:var(--ember)}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.ib:hover{border-color:var(--fg);color:var(--fg)}
.ib.sm{width:26px;height:26px}.ib.sm svg.i{width:13px;height:13px}
.grow{flex:1}
.ti::before{content:'';position:absolute;inset:-5px}
.ti{position:relative;width:22px;height:22px;border-radius:50%;border:1px solid var(--faint);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;vertical-align:middle;text-transform:none;letter-spacing:0}
.ti svg.i{width:12px;height:12px}
.ti:hover,.ti:focus-visible{border-color:var(--fg);color:var(--fg)}
.ti::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:-8px;width:max-content;max-width:min(300px,80vw);white-space:pre-line;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--strong);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.65;letter-spacing:.02em;font-weight:500;opacity:0;pointer-events:none;z-index:60}
.ti.r::after{left:auto;right:-8px}
.ti:hover::after,.ti:focus-visible::after{opacity:1}
.tok{height:28px;min-width:28px;padding:0 9px;border-radius:999px;border:1px dashed var(--faint);color:var(--muted);font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tok:hover{border-style:solid;border-color:var(--fg);color:var(--fg)}

.filters,.detail{position:fixed;top:0;bottom:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;min-width:0}
.filters{left:calc(max(28px,env(safe-area-inset-left,0px)) + 176px);width:min(340px,calc(100% - 204px));border-right:2px dashed var(--strong);display:none;overflow-y:auto;padding:26px 28px 48px}
.app.side-open .filters{display:flex}
.fhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sec{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:30px 0 8px;padding-bottom:10px;border-bottom:2px dashed var(--strong)}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;font-size:15px}
.sbtn:hover{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:5px}
.sbtn.on{background:var(--surface);color:var(--fg);border:1px solid var(--fg);border-radius:999px;padding:10px 18px;margin:2px 0;text-decoration:none}
.sbtn .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sbtn.on .n{color:var(--fg)}
.sbtn .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;outline:1px solid var(--bg);box-shadow:none}
.side-empty{font-size:13px;color:var(--muted);padding:6px 0}
.detail{right:0;width:min(470px,100%);border-left:2px dashed var(--strong)}
/* ≥1280px: 상세 패널은 덮지 않고 세 번째 그리드 컬럼이 된다 (달력 폭이 줄어듦) */
@media (min-width:1280px){
  .app.detail-open{grid-template-columns:176px minmax(0,1fr) clamp(340px,24vw,440px);column-gap:32px}
  .app.detail-open .detail{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;right:auto;width:auto;height:100vh;align-self:start;z-index:5}
}
.dh{display:flex;align-items:center;gap:10px;padding:20px 28px;border-bottom:2px dashed var(--strong)}
.dh b{flex:1;font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.db{flex:1;overflow-y:auto;padding:26px 28px 24px;display:flex;flex-direction:column;gap:26px}
.ttl{font-size:26px;line-height:1.25;font-weight:500;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;width:100%;padding:4px 0;margin:0;outline:0}
.ttl:hover,.ttl:focus{border-bottom-color:var(--fg)}
.fl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fl span{text-transform:none;letter-spacing:.02em;color:var(--faint)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1px solid var(--faint);border-radius:999px;padding:6px 16px;font-size:13px}
.seg button:hover{border-color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);border-color:var(--fg)}
.seg button.on::before{content:'✓ '}
.fi{width:100%;background:transparent;border:0;border-bottom:1px solid var(--fg);border-radius:0;padding:8px 2px;font-size:15px}
.fi:focus{outline:0;border-bottom-style:dashed}
textarea.fi{border:1px dashed var(--faint);padding:12px;min-height:100px;resize:vertical;border-radius:0}
select.fi{background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.dday{font-weight:500;font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:.06em}
.warnline{font-size:12px;color:var(--ember);margin-top:-14px}
.ck{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ck input[type=text]{flex:1;border:0;border-bottom:1px solid transparent;background:none;padding:4px 0;min-width:0;outline:0}
.ck input[type=text]:focus{border-bottom-color:var(--faint)}
.ck.dn input[type=text]{text-decoration:line-through;text-decoration-color:var(--strong);color:var(--muted)}
.dfoot{display:flex;gap:10px;padding:18px 28px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px dashed var(--strong);flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--fg);border-radius:22.5px;padding:8px 20px;font-size:12px;letter-spacing:.08em;min-height:36px;display:inline-flex;align-items:center}
.btn:hover{background:var(--surface)}
.btn.pri{background:var(--surface);border-color:var(--surface);border-radius:36px;padding:10px 24px}
.btn.pri:hover{background:var(--chip-h);border-color:var(--chip-h)}
.btn.danger.arm{background:var(--fg);color:var(--bg)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.modal{background:var(--bg);border:2px dashed var(--strong);border-radius:12px;width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(1200px,100%)}
.mh{display:flex;align-items:center;gap:12px;padding:20px 28px;border-bottom:2px dashed var(--strong)}
.mh h2{font-size:24px;font-weight:500;margin:0;flex:1;min-width:0;line-height:1.2}
.mh h2 .meta{display:block;margin-top:6px;font-size:12px;letter-spacing:.04em}
.mb{overflow-y:auto;padding:26px 28px 34px}
.tabs{display:flex;gap:30px;padding:0 28px;border-bottom:2px dashed var(--strong);overflow-x:auto}
.tabs button{padding:15px 0 13px;font-size:13px;letter-spacing:.06em;color:var(--muted);border-bottom:1px dashed transparent;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.mm{margin-bottom:44px}
.mm h3{font-size:24px;font-weight:500;margin:0;position:sticky;top:-26px;background:var(--bg);padding:14px 0 12px;z-index:1;display:flex;gap:14px;align-items:baseline}
.mm h3 small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.mm.cur h3{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:8px}
.mm .grid{grid-auto-rows:minmax(78px,auto)}
.mm .cell{padding:8px 9px;gap:4px}
.mm .dnum{font-size:15px}.mm .ch{min-height:20px}
.mm .chip{font-size:12px;padding:1px 0}.mm .chip.high{padding:2px 9px}
.mm .cell.tnow .dnum{padding:2px 7px;margin-left:-8px}
.drow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;border-bottom:1px dashed var(--line)}
.drow:hover{background:var(--out)}
.drow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.drow.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--strong);color:var(--muted)}
.meta{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.badge{font-size:11px;letter-spacing:.08em;padding:2px 10px;border-radius:999px;border:1px solid var(--faint);white-space:nowrap}
.badge.high{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.badge.hol{border-color:var(--ember);color:var(--ember)}
.labs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.set h4{font-size:16px;font-weight:500;margin:0 0 8px}
.set p.help{font-size:13px;color:var(--muted);margin:0 0 16px;max-width:64ch}
.set .blk{margin-bottom:44px}
.form{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.form .fi{width:auto}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lrow .d{font-variant-numeric:tabular-nums;color:var(--muted);width:130px;flex-shrink:0;font-size:13px}
.lrow .nm{flex:1;min-width:0}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
input[type=color]{width:44px;height:28px;border:1px solid var(--faint);border-radius:0;padding:0;background:none}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:2px;border:1px solid var(--faint)}
.presets{display:flex;gap:10px;flex-wrap:wrap}
.presets button{display:flex;align-items:center;gap:8px;border:1px solid var(--faint);border-radius:22.5px;padding:7px 16px;font-size:13px}
.presets button:hover{border-color:var(--fg)}
.err{color:var(--ember);font-size:12px}
.wp-prev{margin-top:16px;border:1px dashed var(--faint);overflow:hidden}
.wp-prev img{display:block;width:100%}
textarea.code{font-family:var(--mono);font-size:11px;min-height:140px}

<script>
(function(){
'use strict';
const pad=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const tip=(t,r)=>'<button type="button" class="ti'+(r?' r':'')+'" data-tip="'+String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" aria-label="도움말"><svg class="i"><use href="#i-info"/></svg></button>';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW='일월화수목금토';
const uid=()=>Math.random().toString(36).slice(2,10);
const MONTHS=Array.from({length:8},(_,i)=>({y:2026+Math.floor((10+i)/12),m:(10+i)%12}));
const RMIN='2026-11-01',RMAX='2027-06-30';
const FONT='"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const HOLIDAYS={
 '2026-12-25':'성탄절','2027-01-01':'신정',
 '2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일(설날)',
 '2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일(노동절)',
 '2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일'
};
const TODAY=K(new Date());
const KEY='weekday-cal-v1';

const DEF_STYLE={bg:'',fg:'',surface:'',holBg:'',holFg:'',todayBg:'',highBg:'',highFg:'',fontSize:14,maxPreview:3,hideDone:false,weekendNotes:true};
const DEF_WP={w:1920,h:1080,place:'right',bg:'#100904',hol:'#f0661a',content:'all'};
const STYLE_VARS=[['bg','--bg','배경'],['fg','--fg','글자'],['surface','--surface','강조 면 (버튼·선택)'],['holBg','--hol-bg','공휴일 칸 배경'],['holFg','--hol-fg','공휴일 글자'],['todayBg','--today-bg','오늘 칸 배경'],['highBg','--high-bg','중요 항목 배경'],['highFg','--high-fg','중요 항목 글자']];
const PRESETS=[['월넛 (기본)',{}],['그래파이트',{bg:'#121314',fg:'#ecebe8',surface:'#2b2d30',holBg:'#2a1812',holFg:'#e8703c',todayBg:'#1b1c1e'}],['포레스트',{bg:'#0c120e',fg:'#e8f0e2',surface:'#1f3426',holBg:'#2a2410',holFg:'#e3a932',todayBg:'#14201a'}],['미드나이트',{bg:'#0b0f18',fg:'#e7edfb',surface:'#1c2943',holBg:'#2a1420',holFg:'#ff7d8f',todayBg:'#121a2b'}]];
const MON_EN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

function sample(){
  const it=(due,title,o)=>Object.assign({id:uid(),title,due,start:'',status:'todo',priority:'normal',assignees:['나'],tags:[],memo:'',checklist:[],links:[],ex:true},o||{});
  return [
   it('2026-11-02','주간 회의',{tags:['회의']}),it('2026-11-09','주간 회의',{tags:['회의']}),
   it('2026-11-16','주간 회의',{tags:['회의']}),it('2026-11-23','주간 회의',{tags:['회의']}),it('2026-11-30','주간 회의',{tags:['회의']}),
   it('2026-11-10','예산안 제출',{tags:['예산'],priority:'high',status:'done',links:[{id:uid(),name:'2027 예산안.xlsx',path:'C:\\업무\\예산\\2027 예산안.xlsx'}]}),
   it('2026-11-13','분기 보고서',{tags:['보고','분기'],priority:'high',status:'doing',start:'2026-11-09',assignees:['나','김과장'],memo:'3분기 실적 표 갱신 후 팀장님 검토',checklist:[{t:'자료 취합',d:true},{t:'초안 작성',d:false},{t:'팀장님 검토',d:false}],links:[{id:uid(),name:'3분기 보고서.hwp',path:'\\\\fileserver\\공유\\기획팀\\3분기 보고서.hwp'},{id:uid(),name:'3분기 실적.pdf',path:'C:\\업무\\2026\\3분기 실적.pdf'}]}),
   it('2026-11-13','자료 취합',{tags:['보고'],assignees:['박대리']}),
   it('2026-11-13','회의실 예약',{tags:['회의'],priority:'low',status:'done'}),
   it('2026-11-18','워크숍 준비',{tags:['행사'],assignees:['나','박대리']}),
   it('2026-11-25','감사 대응 자료',{tags:['행정'],priority:'high'}),
   it('2026-11-30','월말 마감',{tags:['예산']}),
   it('2026-12-24','연말정산 서류 제출',{tags:['행정']}),
   it('2027-01-04','시무식',{tags:['행사'],priority:'low'})
  ];
}
function fresh(){return {items:sample(),customs:[{id:uid(),date:'2026-11-27',name:'창립기념일',color:'#c9a46a',off:true,ex:true}],disabledHol:[],style:Object.assign({},DEF_STYLE),wp:Object.assign({},DEF_WP)};}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);return normalize(s);}}catch(e){}
  return fresh();
}
function normalize(s){
  const st=Object.assign({},DEF_STYLE,s.style||{}),wp=Object.assign({},DEF_WP,s.wp||{});
  if(+st.fontSize===13)st.fontSize=14;if(wp.bg==='#1f2a36')wp.bg=DEF_WP.bg;if(wp.hol==='#ff7b72'||wp.hol==='#dc5000')wp.hol=DEF_WP.hol;
  return {items:Array.isArray(s.items)?s.items.filter(i=>i&&i.id&&i.due).map(i=>Object.assign({title:'',start:'',status:'todo',priority:'normal',assignees:[],tags:[],memo:'',checklist:[],links:[]},i)):[],
    customs:Array.isArray(s.customs)?s.customs.filter(c=>c&&c.date):[],disabledHol:Array.isArray(s.disabledHol)?s.disabledHol:[],
    style:st,wp:wp,tagColors:(s.tagColors&&typeof s.tagColors==='object')?s.tagColors:{}};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const ui={mi:0,sel:null,filter:{tag:null,who:null,mode:'all'},q:'',modal:null,stab:'days',arm:null,wpUrl:null,selDay:null};
(function(){const t=TODAY.slice(0,7);const i=MONTHS.findIndex(m=>m.y+'-'+pad(m.m+1)===t);ui.mi=i>=0?i:(TODAY<RMIN?0:7);})();

const $=id=>document.getElementById(id);
let toastT;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
let dlP=null;
function download(name,blob){
  if(window.claude&&typeof window.claude.use==='function'){
    dlP=dlP||window.claude.use('downloads').catch(()=>null);
    dlP.then(dl=>{if(!dl){linkSave(name,blob);return;}dl.save({filename:name,data:blob}).then(()=>toast('저장했어요')).catch(e=>{if(e&&e.code==='declined')return;linkSave(name,blob);});});
    return;
  }
  linkSave(name,blob);
}
function linkSave(name,blob){try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}catch(e){}}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h;}
const TAGC=['--c1','--c2','--c3','--c4','--c0'];
const tagIdx=t=>{const v=S.tagColors&&S.tagColors[t];return v!=null?+v:hue(t)%4;};
const tagColor=t=>t?'var('+TAGC[tagIdx(t)%5]+')':'var(--c0)';

function applyStyle(){
  const r=document.documentElement.style;
  STYLE_VARS.forEach(([k,v])=>{S.style[k]?r.setProperty(v,S.style[k]):r.removeProperty(v);});
  r.setProperty('--fs',(+S.style.fontSize||13)+'px');
}
function cssVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function weeksOf(y,m){
  const last=new Date(y,m+1,0);let d=new Date(y,m,1);const w=d.getDay();
  d=w===6?addD(d,2):w===0?addD(d,1):addD(d,-(w-1));
  const out=[];while(d<=last){out.push([0,1,2,3,4].map(i=>addD(d,i)));d=addD(d,7);}return out;
}
const holOn=k=>HOLIDAYS[k]&&!S.disabledHol.includes(k)?HOLIDAYS[k]:null;
function dayInfo(k){
  const d=P(k),w=d.getDay(),notes=[];
  if(S.style.weekendNotes){
    const chk=(dd,label)=>{const kk=K(dd);const h=holOn(kk);if(h)notes.push({t:label+' '+h,h:true});S.customs.filter(c=>c.date===kk).forEach(c=>notes.push({t:label+' '+c.name,c:c.color}));};
    if(w===5)chk(addD(d,1),'토');
    if(w===1)chk(addD(d,-1),'일');
  }
  return {hol:holOn(k),customs:S.customs.filter(c=>c.date===k),notes};
}
const PR={high:0,normal:1,low:2};
const cmp=(a,b)=>((a.status==='done')-(b.status==='done'))||(PR[a.priority]-PR[b.priority])||a.title.localeCompare(b.title,'ko');
function visible(i){
  const f=ui.filter;
  if(S.style.hideDone&&i.status==='done')return false;
  if(f.tag&&!i.tags.includes(f.tag))return false;
  if(f.who&&!i.assignees.includes(f.who))return false;
  if(f.mode==='high'&&i.priority!=='high')return false;
  if(f.mode==='open'&&i.status==='done')return false;
  if(ui.q){const q=ui.q.toLowerCase();if(![i.title,i.memo,i.tags.join(' '),i.assignees.join(' '),(i.links||[]).map(l=>l.name).join(' ')].join(' ').toLowerCase().includes(q))return false;}
  return true;
}
const itemsOn=k=>S.items.filter(i=>i.due===k&&visible(i)).sort(cmp);
function preview(list,n){
  const must=list.filter(i=>i.priority==='high'&&i.status!=='done');
  const rest=list.filter(i=>!must.includes(i));
  const shown=must.concat(rest.slice(0,Math.max(0,n-must.length)));
  return {shown,more:list.length-shown.length};
}
function ddayTxt(k){const n=Math.round((P(k)-P(TODAY))/864e5);return n===0?'D-day':n>0?'D-'+n:'D+'+(-n);}
const fmtD=k=>{const d=P(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';};

function cellHTML(d,inMonth,compact){
  const k=K(d),info=dayInfo(k),list=itemsOn(k);
  const off=info.customs.find(c=>c.off);
  const cls=['cell'];if(k<TODAY&&inMonth)cls.push('past');if(!inMonth)cls.push('out');if(info.hol)cls.push('hol');else if(k===TODAY)cls.push('today');if(k===TODAY)cls.push('tnow');
  const st=off&&!info.hol?' style="background:'+esc(off.color)+'26"':'';
  let h='<div class="'+cls.join(' ')+'" data-act="day" data-day="'+k+'" role="button" tabindex="'+(compact?-1:(k===(ui.fk||(inMonth&&k===TODAY?k:''))?0:-1))+'" aria-label="'+fmtD(k)+(k===TODAY?' 오늘':'')+(info.hol?' '+esc(info.hol):'')+' 항목 '+list.length+'개"'+(k===TODAY?' aria-current="date"':'')+st+'>';
  h+='<div class="ch"><span class="dnum">'+(d.getDate()===1||(!inMonth&&compact)?(d.getMonth()+1)+'/':'')+d.getDate()+'</span>';
  if(k===TODAY&&!compact)h+='<span class="lab tdy">TODAY</span>';
  if(info.hol)h+='<span class="lab h">'+esc(info.hol)+'</span>';
  info.customs.forEach(c=>{h+='<span class="lab" style="color:'+esc(c.color)+';font-weight:700">'+esc(c.name)+'</span>';});
  if(!compact)h+='<button class="add" data-act="add" data-day="'+k+'" aria-label="'+fmtD(k)+'에 추가"><svg class="i" style="width:14px;height:14px"><use href="#i-plus"/></svg></button>';
  h+='</div>';
  info.notes.forEach(n=>{h+='<div class="note"'+(n.c?' style="color:'+esc(n.c)+'"':n.h?' style="color:var(--hol-fg)"':'')+'>'+esc(n.t)+'</div>';});
  const p=preview(list,compact?2:(+S.style.maxPreview||3));
  p.shown.forEach(i=>{
    h+='<div class="chipw"><button class="chip'+(i.priority==='high'&&i.status!=='done'?' high':'')+(i.status==='done'?' done':i.status==='doing'?' doing':'')+(ui.sel===i.id?' sel':'')+'" data-act="item" data-id="'+i.id+'" title="'+esc(i.title)+'">';

/* ---------- quick add ---------- */
const inferY=m=>m>=11?2026:2027;
function parseQuick(text,base){
  let s=' '+text.replace(/\s+/g,' ')+' ';const tags=[],who=[];let pr='normal',date=null;
  s=s.replace(/ #([^\s#@!]+)(?= )/g,(_,t)=>{tags.push(t);return ' ';});
  s=s.replace(/ @([^\s#@!]+)(?= )/g,(_,t)=>{who.push(t);return ' ';});
  s=s.replace(/ (!!|!높음|!중요|!high)(?= )/gi,()=>{pr='high';return ' ';});
  s=s.replace(/ (!낮음|!low)(?= )/gi,()=>{pr='low';return ' ';});
  s=s.replace(/ !보통(?= )/g,' ');
  const mk=(y,m,d)=>{const dt=new Date(y,m-1,d);return dt.getMonth()===m-1?K(dt):null;};
  let r;
  if((r=s.match(/ (\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})(?= )/))){date=mk(+r[1],+r[2],+r[3]);s=s.replace(r[0],' ');}
  else if((r=s.match(/ (\d{1,2})월 ?(\d{1,2})일(?= )/))){date=mk(inferY(+r[1]),+r[1],+r[2]);s=s.replace(r[0],' ');}
  else if((r=s.match(/ (\d{1,2})[\/.](\d{1,2})(?= )/))){date=mk(inferY(+r[1]),+r[1],+r[2]);s=s.replace(r[0],' ');}
  else if((r=s.match(/ (\d{1,2})일(?= )/))){const m=MONTHS[ui.mi];date=mk(m.y,m.m+1,+r[1]);s=s.replace(r[0],' ');}
  else if((r=s.match(/ (오늘|내일|모레)(?= )/))){date=K(addD(P(TODAY),{오늘:0,내일:1,모레:2}[r[1]]));s=s.replace(r[0],' ');}
  return {title:s.trim().replace(/\s+/g,' '),date:date||base,tags,who:who.length?who:['나'],pr,explicit:!!date};
}
function defaultDay(){
  if(ui.selDay)return ui.selDay;
  const m=MONTHS[ui.mi];
  if(TODAY.startsWith(m.y+'-'+pad(m.m+1)))return TODAY;
  return K(weeksOf(m.y,m.m)[0].find(d=>d.getMonth()===m.m));
}
function weekdayShift(k){const d=P(k),w=d.getDay();if(w===6)return {k:K(addD(d,-1)),moved:'토요일이라 금요일로 옮겼어요'};if(w===0)return {k:K(addD(d,1)),moved:'일요일이라 월요일로 옮겼어요'};return {k,moved:''};}
function addFromText(text,base){
  const p=parseQuick(text,base);
  if(!p.title)return {err:'할 일 내용을 입력하세요.'};
  const sh=weekdayShift(p.date);
  if(sh.k<RMIN||sh.k>RMAX)return {err:'달력 범위(2026년 11월~2027년 6월) 밖의 날짜예요.'};
  const it={id:uid(),title:p.title,due:sh.k,start:'',status:'todo',priority:p.pr,assignees:p.who,tags:p.tags,memo:'',checklist:[]};
  S.items.push(it);save();return {it,moved:sh.moved};
}
function hintFor(text){
  if(!text.trim())return '';
  const p=parseQuick(text,defaultDay());const sh=weekdayShift(p.date);
  const parts=['→ '+fmtD(sh.k)];if(p.tags.length)parts.push(p.tags.map(t=>'#'+t).join(' '));parts.push(p.who.map(t=>'@'+t).join(' '));if(p.pr!=='normal')parts.push(p.pr==='high'?'중요도 높음':'중요도 낮음');
  return parts.join(' · ')+(sh.moved?' ('+sh.moved+')':'');
}

function lum(hex){const n=parseInt(hex.slice(1),16);return ((n>>16&255)*.299+(n>>8&255)*.587+(n&255)*.114)/255;}

function drawWallpaper(mi){
  const o=S.wp,W=Math.max(800,Math.min(7680,+o.w||1920)),H=Math.max(600,Math.min(4320,+o.h||1080));

  x.fillStyle=o.bg;x.fillRect(0,0,W,H);

  let rx,rw;if(o.place==='right'){rx=W*.3;rw=W*.66;}else if(o.place==='center'){rx=W*.16;rw=W*.68;}else{rx=W*.05;rw=W*.9;}
  const m=MONTHS[mi],top=H*.07,bottom=H*.1;
  x.textBaseline='alphabetic';x.fillStyle=fg;x.font=F(92);sp('0px');
  const t1=MON_EN[m.m];x.fillText(t1,rx,top+80*s);const tw=x.measureText(t1).width;
  x.font=F(22);x.fillStyle=mute;x.fillText(m.y+' · '+(m.m+1)+'월',rx+tw+28*s,top+80*s);
  const hy=top+136*s,weeks=weeksOf(m.y,m.m),colW=rw/5;
  x.font=F(13);sp(Math.round(2.6*s)+'px');x.fillStyle=mute;['MON','TUE','WED','THU','FRI'].forEach((d,i)=>x.fillText(d,rx+i*colW+14*s,hy));sp('0px');
  const gTop=hy+16*s,gH=H-bottom-gTop,rowH=gH/weeks.length,lh=26*s,pd=14*s;
  weeks.forEach((w,ri)=>w.forEach((d,ci)=>{
    const info=dayInfo(K(d)),offC=info.customs.find(q=>q.off);
    if(info.hol||offC){x.fillStyle=hexA(info.hol?o.hol:offC.color,.16);x.fillRect(rx+ci*colW,gTop+ri*rowH,colW,rowH);}

  for(let q=0;q<=5;q++){const xx=rx+q*colW;x.beginPath();x.moveTo(xx,gTop);x.lineTo(xx,gTop+gH);x.stroke();}
  x.strokeStyle=fg;x.globalAlpha=.55;x.lineWidth=Math.max(2,2*s);x.setLineDash([8*s,6*s]);x.strokeRect(rx,gTop,rw,gH);x.globalAlpha=1;
  x.restore();
  weeks.forEach((w,ri)=>w.forEach((d,ci)=>{
    const k=K(d),cx=rx+ci*colW,cy=gTop+ri*rowH,info=dayInfo(k),inM=d.getMonth()===m.m;
    x.globalAlpha=inM?1:.38;

const LOCAL=location.protocol==='file:';
const VIEW_EXT=['pdf','png','jpg','jpeg','gif','webp','bmp','svg','txt','htm','html','mp4'];
const OFFICE={xlsx:'ms-excel',xls:'ms-excel',xlsm:'ms-excel',xlsb:'ms-excel',csv:'ms-excel',docx:'ms-word',doc:'ms-word',rtf:'ms-word',pptx:'ms-powerpoint',ppt:'ms-powerpoint'};
const isURL=s=>/^https?:\/\//i.test(s||'');
const extOf=n=>{const m=/\.([a-z0-9]+)$/i.exec(n||'');return m?m[1].toLowerCase():'';};
const lastSeg=p=>p.split('\\').filter(Boolean).pop()||p;
function fileURLToPath(u){try{const x=new URL(u);const p=decodeURIComponent(x.pathname);if(x.host)return '\\\\'+x.host+p.replace(/\//g,'\\');const q=p.replace(/^\//,'');return /^[a-zA-Z]:/.test(q)?q.replace(/\//g,'\\'):null;}catch(e){return null;}}
function asLink(raw){
  const s=String(raw).trim().replace(/^"(.*)"$/,'$1').trim();if(!s)return null;
  if(/^[a-zA-Z]:\\/.test(s)||/^\\\\[^\\]+\\/.test(s))return {id:uid(),path:s,name:lastSeg(s)};
  if(/^file:\/\//i.test(s)){const p=fileURLToPath(s);return p?{id:uid(),path:p,name:lastSeg(p)}:null;}
  if(isURL(s)){let n=s;try{const u=new URL(s);n=decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname);}catch(e){}return {id:uid(),path:s,name:n};}
  return null;
}
const parseLinks=t=>String(t||'').split(/\r?\n/).filter(l=>!/^\s*#/.test(l)).map(asLink).filter(Boolean);
function toFileURL(p){
  if(p.startsWith('\\\\'))return 'file://'+p.slice(2).split('\\').map(encodeURIComponent).join('/');
  return 'file:///'+p.slice(0,2)+'/'+p.slice(3).split('\\').map(encodeURIComponent).join('/');
}
const parentOf=p=>p.replace(/\\[^\\]*$/,'');
function xb(l){
  const e=isURL(l.path)&&!extOf(l.name)?'url':extOf(l.name||l.path);
  const g=e==='url'?'url':e==='pdf'?'pdf':/^hwpx?$/.test(e)?'hwp':/^(xls|xlsx|xlsm|xlsb|csv)$/.test(e)?'xls':/^(doc|docx|rtf)$/.test(e)?'doc':/^(ppt|pptx)$/.test(e)?'ppt':'';
  return '<span class="xb '+g+'">'+esc(e==='url'?'URL':(e||'파일').toUpperCase().slice(0,4))+'</span>';
}
function copyText(t){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(fb);else fb();}catch(e){fb();}
}
const quoted=p=>'"'+p+'"';
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{try{const r=indexedDB.open('weekday-cal-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return idbP;}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('h',mode);const r=fn(tx.objectStore('h'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);}));}
const putH=(k,h)=>idbDo('readwrite',st=>st.put(h,k));
const getH=k=>idbDo('readonly',st=>st.get(k));
const delH=k=>idbDo('readwrite',st=>st.delete(k)).catch(()=>{});
function openLink(l){
  if(l.path){
    const p=l.path;
    if(isURL(p)){window.open(p,'_blank','noopener');return;}
    const e=extOf(l.name||p);
    if(LOCAL&&VIEW_EXT.includes(e)){window.open(toFileURL(p),'_blank');return;}
    copyText(quoted(p));
    if(LOCAL&&OFFICE[e]){const a=document.createElement('a');a.href=OFFICE[e]+':ofe|u|'+toFileURL(p);document.body.appendChild(a);a.click();a.remove();toast('오피스에서 여는 중이에요. 안 열리면 Win+R → Ctrl+V → Enter (경로 복사됨)');return;}
    toast((LOCAL?'':'미리보기에서는 PC 파일을 직접 못 열어요. ')+'경로를 복사했어요 · Win+R → Ctrl+V → Enter로 열려요');
    return;
  }
  if(l.h){openHandle(l);return;}

async function openHandle(l){
  try{
    const h=await getH(l.id);if(!h)throw 0;
    let st=await h.queryPermission({mode:'read'});if(st!=='granted')st=await h.requestPermission({mode:'read'});
    if(st!=='granted'){toast('파일을 읽을 권한이 필요해요');return;}
    const f=await h.getFile(),e=extOf(f.name);
    if(VIEW_EXT.includes(e)){const u=URL.createObjectURL(f);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),120000);}
    else toast('크롬은 '+(e?e.toUpperCase():'이 형식')+' 파일을 직접 못 열어요. 경로를 붙여넣으면 원본을 열 수 있어요');

function handleDrop(e,k,itemId){
  const dt=e.dataTransfer;if(!dt)return;
  const files=Array.from(dt.items||[]).filter(i=>i.kind==='file');
  if(files.length){
    const parts=files.map(i=>{let hp=Promise.resolve(null);try{if(i.getAsFileSystemHandle)hp=i.getAsFileSystemHandle().catch(()=>null);}catch(err){}return {f:i.getAsFile(),hp};});
    Promise.all(parts.map(x=>x.hp)).then(async hs=>{
      const links=parts.map((x,j)=>({id:uid(),name:x.f?x.f.name:((hs[j]&&hs[j].name)||'문서'),path:'',h:!!(hs[j]&&hs[j].kind==='file')}));

});
$('modal').addEventListener('keydown',e=>{
  if(e.target.id==='day-add'&&e.key==='Enter'&&!e.isComposing){
    const r=addFromText(e.target.value,ui.selDay);
    if(r.err){$('day-err').textContent=r.err;return;}
    if(r.moved||r.it.due!==ui.selDay)toast(fmtD(r.it.due)+'에 추가했어요');
    renderSide();renderMain();renderModal();
  }
});
$('modal').addEventListener('input',e=>{
  const t=e.target;let rer=false;
  if(t.dataset.cn){const c=S.customs.find(q=>q.id===t.dataset.cn);if(c){c.name=t.value;delete c.ex;}}
  else if(t.dataset.cc){const c=S.customs.find(q=>q.id===t.dataset.cc);if(c){c.color=t.value;delete c.ex;}}
  else if(t.dataset.sk){S.style[t.dataset.sk]=t.value;applyStyle();}
  else if(t.dataset.wk){S.wp[t.dataset.wk]=t.type==='number'?+t.value:t.value;clearTimeout(ui.wpT);if(ui.wpUrl)ui.wpT=setTimeout(makeWp,400);}
  else return;
  save();soon();
});
$('modal').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.co){const c=S.customs.find(q=>q.id===t.dataset.co);if(c)c.off=t.checked;}
  else if(t.dataset.hol){const k=t.dataset.hol;S.disabledHol=S.disabledHol.filter(x=>x!==k);if(!t.checked)S.disabledHol.push(k);}
  else if(t.dataset.so){S.style[t.dataset.so]=+t.value;applyStyle();}
  else if(t.dataset.sb){S.style[t.dataset.sb]=t.checked;}
  else if(t.dataset.sk){renderModal();}
  else if(t.dataset.wm!=null){ui.wpMi=+t.value;ui.wpUrl=null;renderModal();return;}
  else if(t.dataset.wpre!=null){if(t.value){const [a,b]=t.value.split('x').map(Number);S.wp.w=a;S.wp.h=b;renderModal();}}
  else if(t.id==='bk-file'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{$('bk-in').value=r.result;$('bk-err').textContent='';};r.readAsText(t.files[0]);return;}
  else return;
  save();renderMain();renderSide();
});
document.addEventListener('keydown',e=>{
  if(ui.modal&&e.key==='Tab'){const f=[...$('modal').querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){const a=f[0],z=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||!$('modal').contains(document.activeElement))){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}
  if(!ui.modal&&e.target.classList&&e.target.classList.contains('cell')){const d=e.target.dataset.day;if(e.key==='Enter'||e.key===' '){e.preventDefault();ui.selDay=d;openModal('day');return;}const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5}[e.key];if(mv){e.preventDefault();const cs=[...$('grid').querySelectorAll('.cell')],i=cs.indexOf(e.target)+mv;if(cs[i]){e.target.tabIndex=-1;cs[i].tabIndex=0;ui.fk=cs[i].dataset.day;cs[i].focus();}return;}if(e.key==='PageUp'){e.preventDefault();go(-1);return;}if(e.key==='PageDown'){e.preventDefault();go(1);return;}}
  if(e.key==='Escape'){if(ui.modal)closeModal();else if(ui.sel){ui.sel=null;renderAll();}else $('app').classList.remove('side-open');return;}
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||ui.modal)return;
  if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);
});

document.addEventListener('paste',e=>{
  const t=e.target,tag=(t.tagName||'').toLowerCase();
  const ls=parseLinks(e.clipboardData&&e.clipboardData.getData('text'));
  if(!ls.length)return;
  if(t.id==='lk-new'){e.preventDefault();linksToItem(ui.sel,ls);return;}
  if(t.id==='day-add'){e.preventDefault();placeLinks(ls,ui.selDay);return;}
  if(t.id==='qa'){e.preventDefault();placeLinks(ls,ui.hoverDay||defaultDay());return;}
  if(tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable)return;
  e.preventDefault();
  if(ui.modal==='day'){placeLinks(ls,ui.selDay);return;}
  if(ui.modal==='full'&&ui.hoverDay){placeLinks(ls,ui.hoverDay);return;}
  if(ui.modal)return;
  if(ui.hoverDay){placeLinks(ls,ui.hoverDay);return;}
  if(ui.sel){linksToItem(ui.sel,ls);return;}
  placeLinks(ls,ui.selDay||defaultDay());
});
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('.cell[data-day]');ui.hoverDay=c?c.dataset.day:null;});
const clearDrop=()=>document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
function dropZone(e){
  const el=e.target.closest?e.target:e.target.parentElement;if(!el)return null;
  const c=el.closest('.cell[data-day]');if(c)return {el:c,day:c.dataset.day};
  const d=el.closest('#detail');if(d&&ui.sel)return {el:d.querySelector('.db')||d,item:ui.sel};
  if(ui.modal==='day'){const m=el.closest('#modal');if(m)return {el:m.querySelector('.mb')||m,day:ui.selDay};}
  return null;
}
document.addEventListener('dragover',e=>{
  e.preventDefault();const z=dropZone(e);
  document.querySelectorAll('.drop').forEach(x=>{if(!z||x!==z.el)x.classList.remove('drop');});
  if(z){z.el.classList.add('drop');if(e.dataTransfer)e.dataTransfer.dropEffect='copy';}else if(e.dataTransfer)e.dataTransfer.dropEffect='none';
});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)clearDrop();});
document.addEventListener('drop',e=>{
  e.preventDefault();clearDrop();const z=dropZone(e);if(!z)return;
  if(z.item)handleDrop(e,null,z.item);else handleDrop(e,z.day);
});

applyStyle();renderAll();
})();
</script>

</body>
</html>
